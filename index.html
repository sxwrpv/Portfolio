float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float hash13(vec3 p3) { p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec3 hash33(vec3 p3) { p3 = fract(p3 * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
float grain(vec2 p, float t) { return hash12(p + fract(t * 7.13) * 917.) - .5; }
uniform vec3 uA, uB, uC;

void main() {
  vec2 p = centered() * 1.3;
  float t = uTime * .15;
  for (float i = 1.; i < 6.; i++)
    p += .5 / i * sin(i * p.yx + t * i + vec2(0, 1.7));
  vec3 col = okMix(uA, uB, .5 + .5 * sin(p.x));
  col = okMix(col, uC, smoothstep(-.4, 1., sin(p.y * 1.2)));
  o = vec4(col + grain(gl_FragCoord.xy, uTime) * .03, 1);
}

 и взрыв конфетти с гравитацией, вращением и затуханием.", "desc_en": "A springy press and a burst of confetti with gravity, spin and fade."}, {"file": "buttons/dots-morph.html", "cat": "buttons", "src": "motion", "thumb": "_thumbs/buttons_dots-morph.jpg", "title": "Точки превращаются в крестик", "title_en": "Dots morph button", "desc": "Четыре точки на пружине вытягиваются в крестик.", "desc_en": "Four dots stretch into a cross on a spring."}, {"file": "buttons/hold-to-confirm.html", "cat": "buttons", "src": "motion", "thumb": "_thumbs/buttons_hold-to-confirm.jpg", "title": "Удерживайте для подтверждения", "title_en": "Hold to confirm", "desc": "Заполнение при удержании, пружинный откат при раннем отпускании, работает с мышью, тачем и пробелом.", "desc_en": "Fills while held, springs back if released early. Works with mouse, touch and the space bar."}, {"file": "buttons/ripple.html", "cat": "buttons", "src": "motion", "thumb": "_thumbs/buttons_ripple.jpg", "title": "Волна при нажатии", "title_en": "Press ripple", "desc": "Круг расходится из точки касания, как в Material Design.", "desc_en": "A circle spreads from the touch point, Material Design style."}, {"file": "buttons/status-badge.html", "cat": "buttons", "src": "motion", "thumb": "_thumbs/buttons_status-badge.jpg", "title": "Бейдж со статусами", "title_en": "Multi-state badge", "desc": "Готово → обработка → успех или ошибка. Ширина плавно подстраивается, при ошибке бейдж трясётся.", "desc_en": "Ready → processing → success or error. Width adapts smoothly, and the badge shakes on error."}, {"file": "buttons/add-to-basket.html", "cat": "buttons", "src": "motion", "thumb": "_thumbs/buttons_add-to-basket.jpg", "title": "Добавить в корзину", "title_en": "Add to basket", "desc": "Товар летит в корзину по дуге, корзина подпрыгивает, счётчик растёт.", "desc_en": "The product flies into the basket along an arc, the basket bounces, the counter grows."}, {"file": "buttons/create-button.html", "cat": "buttons", "src": "motion", "thumb": "_thumbs/buttons_create-button.jpg", "title": "Кнопка «Создать» раскрывается в меню", "title_en": "Create button expanding into a menu", "desc": "Кнопка растёт в панель с сеткой вариантов через clip-path, варианты появляются по очереди.", "desc_en": "The button grows into a panel with a grid of options through clip-path, options appear in sequence."}, {"file": "navigation/floating-action-button.html", "cat": "navigation", "src": "motion", "thumb": "_thumbs/navigation_floating-action-button.jpg", "title": "Плавающая кнопка действий", "title_en": "Floating action button", "desc": "Плюс поворачивается в крестик, над ним по очереди на пружине выезжают действия с подписями.", "desc_en": "The plus turns into a cross, and labelled actions spring out above it one by one."}, {"file": "navigation/command-palette.html", "cat": "navigation", "src": "motion", "thumb": "_thumbs/navigation_command-palette.jpg", "title": "Командная палитра (⌘K)", "title_en": "Command palette", "desc": "Пружинное появление, поиск, подсветка, переезжающая между пунктами, управление стрелками.", "desc_en": "Springy entrance, search, a highlight that glides between items, arrow-key control."}, {"file": "navigation/radial-menu.html", "cat": "navigation", "src": "motion", "thumb": "_thumbs/navigation_radial-menu.jpg", "title": "Радиальное меню", "title_en": "Radial menu", "desc": "Варианты веером разлетаются вокруг кнопки.", "desc_en": "Options fan out around the button."}, {"file": "navigation/context-menu.html", "cat": "navigation", "src": "motion", "thumb": "_thumbs/navigation_context-menu.jpg", "title": "Контекстное меню", "title_en": "Context menu with submenu", "desc": "Меню по правому клику растёт из точки клика. Подменю с «безопасным треугольником», чтобы не закрывалось при движении по диагонали. Работает с клавиатуры.", "desc_en": "A right-click menu grows from the click point. Submenus use a safe triangle so they stay open on diagonal moves. Works with the keyboard."}, {"file": "navigation/mega-menu.html", "cat": "navigation", "src": "motion", "thumb": "_thumbs/navigation_mega-menu.jpg", "title": "Мега-меню", "title_en": "Mega menu with sliding indicator", "desc": "Подсветка переезжает между пунктами, панель меняет размер под каждое меню, колонки появляются по очереди.", "desc_en": "The highlight glides between items, the panel resizes for each menu, columns appear in sequence."}, {"file": "navigation/tabs.html", "cat": "navigation", "src": "motion", "thumb": "_thumbs/navigation_tabs.jpg", "title": "Вкладки и переключатели", "title_en": "Tabs, tab select and toggle group", "desc": "Вкладки с бегущей линией, содержимым по направлению и плавной высотой; таблетка выбора; группа переключателей с blend-mode.", "desc_en": "Tabs with a sliding line, directional content and smooth height; a pill selector; a toggle group with blend mode."}, {"file": "overlays/toasts.html", "cat": "overlays", "src": "motion", "thumb": "_thumbs/overlays_toasts.jpg", "title": "Стопка уведомлений (тосты)", "title_en": "Toast stack", "desc": "Тосты складываются стопкой, раскрываются при наведении, смахиваются вбок и закрываются сами.", "desc_en": "Toasts stack up, expand on hover, swipe away sideways and dismiss themselves."}, {"file": "overlays/notifications.html", "cat": "overlays", "src": "motion", "thumb": "_thumbs/overlays_notifications.jpg", "title": "Уведомления: стопка и список", "title_en": "Notification stack and list", "desc": "Стопка как на iPhone раскрывается по клику. Список плавно раздвигается при добавлении и удалении.", "desc_en": "An iPhone-style stack that expands on click. A list that makes room smoothly as items are added and removed."}, {"file": "overlays/bottom-sheet.html", "cat": "overlays", "src": "motion", "thumb": "_thumbs/overlays_bottom-sheet.jpg", "title": "Нижняя шторка", "title_en": "Bottom sheet", "desc": "Тянется за ручку, прилипает к половине и к полной высоте, смахивается вниз, содержимое появляется по очереди.", "desc_en": "Drag the handle, snap to half and full height, swipe down to close; content appears in sequence."}, {"file": "overlays/modals.html", "cat": "overlays", "src": "motion", "thumb": "_thumbs/overlays_modals.jpg", "title": "Модальные окна", "title_en": "Modals", "desc": "Обычный диалог с пружиной; плитка вырастает в окно и возвращается; пошаговое окно с плавной высотой.", "desc_en": "A plain dialog with a spring; a tile that grows into a window and back; a stepped dialog with smooth height."}, {"file": "overlays/accordion.html", "cat": "overlays", "src": "motion", "thumb": "_thumbs/overlays_accordion.jpg", "title": "Аккордеон", "title_en": "Accordion", "desc": "Плавная высота при открытии и закрытии, плюс превращается в минус, открыт только один пункт.", "desc_en": "Smooth height on open and close, the plus turns into a minus, only one item is open."}, {"file": "overlays/warp-overlay.html", "cat": "overlays", "src": "motion", "thumb": "_thumbs/overlays_warp-overlay.jpg", "title": "Страница отодвигается под окном", "title_en": "Warp overlay", "desc": "При открытии шторки страница позади наклоняется, уменьшается и темнеет.", "desc_en": "When the sheet opens, the page behind tilts, shrinks and darkens."}, {"file": "forms/ui-primitives.html", "cat": "forms", "src": "motion", "thumb": "_thumbs/forms_ui-primitives.jpg", "title": "Анимированные элементы форм", "title_en": "Animated UI primitives", "desc": "Чекбокс с прорисовкой галочки, радиокнопки, переключатель, выпадающий список, подсказка, прогресс, панель инструментов с подсветкой.", "desc_en": "A checkbox with a drawn check, radio buttons, a switch, a dropdown, a tooltip, progress, a toolbar with a highlight."}, {"file": "forms/ios-slider.html", "cat": "forms", "src": "motion", "thumb": "_thumbs/forms_ios-slider.jpg", "title": "Тянущийся слайдер", "title_en": "Stretchy slider", "desc": "Слайдер как в iOS: за краем он растягивается и пружинит обратно.", "desc_en": "An iOS-style slider that stretches past its ends and springs back."}, {"file": "forms/color-picker.html", "cat": "forms", "src": "motion", "thumb": "_thumbs/forms_color-picker.jpg", "title": "Круговой выбор цвета", "title_en": "Circular colour picker", "desc": "Точки по кругу расступаются и растут возле курсора.", "desc_en": "Dots arranged in a circle part and grow near the cursor."}, {"file": "forms/sign-in-flow.html", "cat": "forms", "src": "motion", "thumb": "_thumbs/forms_sign-in-flow.jpg", "title": "Вход: поле по условию, код, меню пользователя", "title_en": "Sign-in flow", "desc": "Поле пароля выезжает только когда нужно; карточка с кодом наезжает поверх; аватар раскрывается в меню; счётчик символов с кольцом.", "desc_en": "The password field slides in only when needed; a code card slides over; the avatar expands into a menu; a character counter with a ring."}, {"file": "forms/exposure-slider.html", "cat": "forms", "src": "motion", "thumb": "_thumbs/forms_exposure-slider.jpg", "title": "Слайдер экспозиции", "title_en": "Exposure slider", "desc": "Линейка с делениями как в камере iPhone: перетаскивание, колесо, клавиши, деления у центра выше.", "desc_en": "A ruler with ticks like the iPhone camera: drag, wheel, keys, taller ticks near the centre."}, {"file": "layout/layout-basics.html", "cat": "layout", "src": "motion", "thumb": "_thumbs/layout_layout-basics.jpg", "title": "Анимация раскладки (FLIP)", "title_en": "Layout animation basics", "desc": "Смена расположения, соотношения сторон, перемешивание, общий подчёркивающий элемент, «якорь» детей при изменении размера, три режима появления и исчезновения.", "desc_en": "Position and aspect changes, shuffling, a shared underline, anchored children during resizes, three enter and exit modes."}, {"file": "layout/expanding-cards.html", "cat": "layout", "src": "motion", "thumb": "_thumbs/layout_expanding-cards.jpg", "title": "Карточки раскрываются в статью, папка приложений", "title_en": "Expanding cards and app folder", "desc": "Карточка в стиле App Store раскрывается в статью через clip-path. Папка вырастает в панель с иконками.", "desc_en": "An App Store style card opens into an article through clip-path. A folder grows into a panel of icons."}, {"file": "layout/card-stack.html", "cat": "layout", "src": "motion", "thumb": "_thumbs/layout_card-stack.jpg", "title": "Стопка карточек со свайпом", "title_en": "Swipeable card stack", "desc": "Свайп как в Tinder: поворот, штампы LIKE и NOPE, улёт с инерцией, следующая карточка поднимается.", "desc_en": "Tinder-style swipes: rotation, LIKE and NOPE stamps, an inertial throw, the next card rises."}, {"file": "layout/reorder.html", "cat": "layout", "src": "motion", "thumb": "_thumbs/layout_reorder.jpg", "title": "Перетаскивание для сортировки", "title_en": "Drag to reorder", "desc": "Список задач с галочками и зачёркиванием и сетка с перетаскиванием в двух направлениях. Alt + стрелки работают с клавиатуры.", "desc_en": "A to-do list with checks and strike-through, and a grid with dragging in two directions. Alt + arrows work from the keyboard."}, {"file": "layout/swipe-actions.html", "cat": "layout", "src": "motion", "thumb": "_thumbs/layout_swipe-actions.jpg", "title": "Свайп-действия в списке", "title_en": "Swipe actions", "desc": "Строка смахивается влево и открывает «Архив» и «Удалить». Длинный свайп сразу удаляет строку.", "desc_en": "Swipe a row left to reveal Archive and Delete. A long swipe deletes the row at once."}, {"file": "layout/stagger-grid.html", "cat": "layout", "src": "motion", "thumb": "_thumbs/layout_stagger-grid.jpg", "title": "Волна по сетке и бесконечный список", "title_en": "Physical stagger grid and infinite list", "desc": "Волна расходится от клика, задержка зависит от расстояния. Бесконечный список подгружает элементы с заглушками.", "desc_en": "A wave spreads from the click, the delay depends on distance. An infinite list loads items with placeholders."}, {"file": "loading/loaders.html", "cat": "loading", "src": "motion", "thumb": "_thumbs/loading_loaders.jpg", "title": "Загрузчики", "title_en": "Loaders", "desc": "Кольцо, прыгающие точки, пульсирующие точки, круги, полоса прогресса, вступительный экран с линией.", "desc_en": "A ring, bouncing dots, pulsing dots, circles, a progress bar, an intro screen with a line."}, {"file": "loading/skeleton-shimmer.html", "cat": "loading", "src": "motion", "thumb": "_thumbs/loading_skeleton-shimmer.jpg", "title": "Скелетон с переливом", "title_en": "Skeleton shimmer", "desc": "Заглушки точного размера с бегущим бликом, затем содержимое проявляется из размытия по очереди.", "desc_en": "Exact-size placeholders with a running shine, then content emerges from blur in sequence."}, {"file": "interactions/image-compare.html", "cat": "interactions", "src": "motion", "thumb": "_thumbs/interactions_image-compare.jpg", "title": "Сравнение «до/после»", "title_en": "Before/after image compare slider", "desc": "Ползунок делит два изображения; тянуть, нажимать, стрелки. Подписи гаснут у краёв.", "desc_en": "A handle splits two images; drag, click or use arrows. Labels fade near the edges."}, {"file": "interactions/tilt-card.html", "cat": "interactions", "src": "motion", "thumb": "_thumbs/interactions_tilt-card.jpg", "title": "Наклоняющаяся карточка", "title_en": "Tilt card", "desc": "Карточка наклоняется за курсором с пружиной и бликом, текст «приподнят» над ней.", "desc_en": "The card tilts after the cursor with a spring and a glare, its text lifted above the surface."}, {"file": "basics/transition-lab.html", "cat": "basics", "src": "motion", "thumb": "_thumbs/basics_transition-lab.jpg", "title": "Лаборатория переходов", "title_en": "Transition lab", "desc": "Ползунки жёсткости, затухания и массы пружины; график кривой; сравнение с bounce и ease; готовая CSS-строка linear() для пружины без JS.", "desc_en": "Sliders for spring stiffness, damping and mass; a curve plot; comparison with bounce and ease; a ready CSS linear() string for springs without JS."}, {"file": "basics/enter-exit-stagger.html", "cat": "basics", "src": "motion", "thumb": "_thumbs/basics_enter-exit-stagger.jpg", "title": "Появление, исчезновение, кадры, очередь", "title_en": "Enter, exit, keyframes and staggered variants", "desc": "Появление и исчезновение, ключевые кадры, прерываемый поворот, меню «родитель, затем дети», анимация по состоянию, уход в сторону, куда листали.", "desc_en": "Enter and exit, keyframes, an interruptible rotation, a parent-then-children menu, state-driven animation, exit in the swipe direction."}, {"file": "basics/svg-paths.html", "cat": "basics", "src": "motion", "thumb": "_thumbs/basics_svg-paths.jpg", "title": "SVG-пути", "title_en": "SVG paths", "desc": "Прорисовка линии, превращение фигур, движение по кривой, длина пути от ползунка.", "desc_en": "Line drawing, shape morphing, motion along a path, path length from a slider."}, {"file": "basics/drag-gestures.html", "cat": "basics", "src": "motion", "thumb": "_thumbs/basics_drag-gestures.jpg", "title": "Перетаскивание и жесты", "title_en": "Drag and gestures", "desc": "Свободное перетаскивание с возвратом, границы с упругими краями, блок по направлению, наведение и нажатие, следование за курсором.", "desc_en": "Free dragging with return, bounds with elastic edges, axis locking, hover and press, following the cursor."}, {"file": "basics/time-and-values.html", "cat": "basics", "src": "motion", "thumb": "_thumbs/basics_time-and-values.jpg", "title": "Кадры, время, значения, цвета", "title_en": "Frame loop, time, values and colour interpolation", "desc": "3D-куб на requestAnimationFrame, вращение с постоянной скоростью, счётчик в тексте, сравнение смешивания цветов (sRGB, линейный RGB, OKLCH).", "desc_en": "A 3D cube on requestAnimationFrame, constant-speed rotation, a counter in text, colour mixing compared (sRGB, linear RGB, OKLCH)."}, {"file": "basics/bezier-editor.html", "cat": "basics", "src": "motion", "thumb": "_thumbs/basics_bezier-editor.jpg", "title": "Редактор кривой cubic-bezier", "title_en": "Cubic-bezier editor", "desc": "Перетаскивайте точки (или стрелками) и сразу видите движение и готовую строку CSS.", "desc_en": "Drag the points (or use arrows) to see the motion and the ready CSS string at once."}, {"file": "hero/hero-stagger.html", "cat": "hero", "src": "motion", "thumb": "_thumbs/hero_hero-stagger.jpg", "title": "Первый экран с пружинным появлением", "title_en": "Hero with staggered spring entrance", "desc": "Бейдж, заголовок, текст, кнопки и цифры появляются одной волной с общей пружиной.", "desc_en": "Badge, headline, text, buttons and numbers enter in a single wave with a shared spring."}, {"file": "experimental/glow-ripple.html", "cat": "experimental", "src": "motion", "thumb": "_thumbs/experimental_glow-ripple.jpg", "title": "Свечение по краю экрана", "title_en": "Glow ripple", "desc": "Радужное свечение по контуру и волна от кнопки, как у голосовых ассистентов.", "desc_en": "A rainbow glow around the screen edge and a wave from the button, like voice assistants."}, {"file": "experimental/watch-grid.html", "cat": "experimental", "src": "motion", "thumb": "_thumbs/experimental_watch-grid.jpg", "title": "Сетка как на часах", "title_en": "Watch-style honeycomb grid", "desc": "Соты из иконок: перетаскивание с инерцией, у краёв иконки уменьшаются.", "desc_en": "A honeycomb of icons: inertial dragging, icons shrink near the edges."}, {"file": "experimental/bouncy-modal.html", "cat": "experimental", "src": "motion", "thumb": "_thumbs/experimental_bouncy-modal.jpg", "title": "Игровое окно", "title_en": "Playful game-style modal", "desc": "Окно «уровень пройден»: выпрыгивает с пружиной, звёзды загораются по очереди.", "desc_en": "A \"level complete\" window springs in and its stars light up one by one."}, {"file": "charts/area-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_area-chart.jpg", "title": "Диаграмма с областями", "title_en": "Area chart", "desc": "Выручка и расходы за 30 дней: области раскрываются слева направо, переключение кривой, перекрестие с подсказкой и выделение диапазона перетаскиванием.", "desc_en": "Revenue vs costs over 30 days: areas reveal left to right, switchable curves, a crosshair tooltip and drag-to-select range totals."}, {"file": "charts/bar-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_bar-chart.jpg", "title": "Столбчатая диаграмма", "title_en": "Bar chart", "desc": "90 столбиков вырастают волной; при смене метрики перетекают к новым значениям, остальные столбики отступают при наведении.", "desc_en": "90 bars grow in a wave and morph to new values when the metric changes; the rest step back on hover."}, {"file": "charts/candlestick-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_candlestick-chart.jpg", "title": "Свечной график", "title_en": "Candlestick chart", "desc": "Свечи раскрываются от середины, фитили тянутся следом. Перекрестие и ценник справа берут цвет свечи под курсором.", "desc_en": "Candles open from their midpoint with wicks stretching after. The crosshair and price tag take the colour of the candle under the cursor."}, {"file": "charts/choropleth-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_choropleth-chart.jpg", "title": "Карта мира по странам", "title_en": "Choropleth map", "desc": "Посетители по странам: страны проявляются с запада на восток, шкала фильтрует по уровню, клик плавно приближает страну.", "desc_en": "Visitors by country: countries fade in west to east, the scale isolates a band, and a click flies to the country."}, {"file": "charts/composed-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_composed-chart.jpg", "title": "Комбинированный график", "title_en": "Composed chart", "desc": "Столбцы, область и пунктирная линия на одной оси. Слои скрываются из легенды, кривая меняется для всех фигур сразу.", "desc_en": "Bars, an area and a dashed line on one axis. Layers toggle from the legend and the curve swaps for every shape at once."}, {"file": "charts/funnel-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_funnel-chart.jpg", "title": "Воронка продаж", "title_en": "Funnel chart", "desc": "Плавная лента воронки с ореолами вырастает из центральной линии; при наведении — доля от общего и от предыдущего этапа.", "desc_en": "A smooth funnel band with layered halos grows from its centre line; hover shows share of total and of the previous stage."}, {"file": "charts/gauge-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_gauge-chart.jpg", "title": "Шкала с насечками", "title_en": "Notched gauge", "desc": "Насечки загораются одна за другой, пока растёт значение, а число в центре прокручивается по цифрам.", "desc_en": "Notches light up one after another as the value climbs while the figure in the middle rolls digit by digit."}, {"file": "charts/heatmap-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_heatmap-chart.jpg", "title": "Тепловая карта активности", "title_en": "Activity heatmap", "desc": "Год активности круглыми ячейками с разбивкой по кварталам. Ячейки проявляются по диагонали, легенда оставляет один уровень.", "desc_en": "A year of activity in round cells split by quarter. Cells ripple in diagonally and the legend keeps a single level lit."}, {"file": "charts/line-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_line-chart.jpg", "title": "Линейный график с зумом", "title_en": "Line chart with brush", "desc": "Три плавные линии на точечной сетке и мини-обзор снизу: окно перетаскивается и растягивается за ручки, график приближается.", "desc_en": "Three smooth lines on a dot grid with an overview brush below: drag or resize the window to zoom the chart."}, {"file": "charts/live-line-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_live-line-chart.jpg", "title": "Живой график", "title_en": "Live line chart", "desc": "Цена приходит каждую секунду: окно прокручивается, ось плавно подстраивается, цифры перекатываются, точка пульсирует.", "desc_en": "A price streams in every second: the window scrolls, the axis eases to new extremes, digits roll and the head pulses."}, {"file": "charts/pie-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_pie-chart.jpg", "title": "Круговая диаграмма", "title_en": "Pie chart", "desc": "Сегменты пончика заполняются по кругу, выдвигаются при наведении, центр прокручивается к значению. Дырка плавно закрывается в режиме «Pie».", "desc_en": "Donut slices sweep in, pop out on hover and the centre rolls to the value. Switch to a pie and the hole closes smoothly."}, {"file": "charts/profit-loss-line.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_profit-loss-line.jpg", "title": "Линия прибыли и убытка", "title_en": "Profit / loss line", "desc": "Одна линия двух цветов: выше нуля — прибыль, ниже — убыток. Нулевая линия подсвечена, легенда изолирует сторону.", "desc_en": "One line in two colours: above zero is profit, below is loss. The zero baseline is highlighted and the legend isolates a side."}, {"file": "charts/radar-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_radar-chart.jpg", "title": "Радарная диаграмма", "title_en": "Radar chart", "desc": "Две модели по шести метрикам. Фигуры вырастают из центра, смена квартала перетягивает каждую вершину, сетка — многоугольник или круг.", "desc_en": "Two models across six metrics. Shapes grow from the centre, switching quarters morphs every vertex, and the grid toggles polygon/circle."}, {"file": "charts/ring-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_ring-chart.jpg", "title": "Кольцевые прогресс-бары", "title_en": "Ring chart", "desc": "Вложенные кольца с круглыми концами заполняются по очереди; дуга переключается между полной, три четверти и половиной.", "desc_en": "Nested rings with round caps fill one after another; the arc switches between full, three-quarter and half."}, {"file": "charts/sankey-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_sankey-chart.jpg", "title": "Диаграмма Санкей", "title_en": "Sankey chart", "desc": "Поток от источника к странице и результату. Ленты переливаются от цвета к цвету, наведение на узел подсвечивает всё, что через него идёт.", "desc_en": "Flow from source to page to outcome. Bands blend between node colours and hovering a node traces everything that passes through it."}, {"file": "charts/scatter-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_scatter-chart.jpg", "title": "Точечная диаграмма", "title_en": "Scatter chart", "desc": "Точки с кольцами появляются по очереди, перекрестие притягивается к ближайшей точке, серии скрываются из легенды.", "desc_en": "Ringed points pop in one by one, the crosshair snaps to the nearest point, and series hide from the legend."}, {"file": "charts/sunburst-chart.html", "cat": "charts", "src": "motion", "thumb": "_thumbs/charts_sunburst-chart.jpg", "title": "Диаграмма «солнце»", "title_en": "Sunburst chart", "desc": "Выручка на трёх уровнях вложенности. Клик по сегменту приближает его и перестраивает кольца, клик по центру — шаг назад.", "desc_en": "Revenue three levels deep. Click a segment to zoom and re-flow the rings; click the centre to step back out."}, {"file": "webgl/gradients/mesh-gradient.html", "cat": "webgl-gradients", "src": "webgl", "thumb": "_thumbs/webgl_gradients_mesh-gradient.jpg", "title": "Меш-градиент из 5 точек", "title_en": "Five-point mesh gradient", "desc": "Пять цветных точек медленно плавают, между ними мягкий градиент с зерном. Цвета меняются прямо на странице.", "desc_en": "Five coloured points drift slowly with a soft, grainy gradient between them. Colours can be changed on the page."}, {"file": "webgl/gradients/flow-gradient.html", "cat": "webgl-gradients", "src": "webgl", "thumb": "_thumbs/webgl_gradients_flow-gradient.jpg", "title": "Текучий градиент", "title_en": "Flowing gradient", "desc": "Жидкий розово-фиолетово-зелёный градиент, который всё время перетекает. Палитра настраивается.", "desc_en": "A liquid pink, violet and green gradient that keeps flowing. The palette is adjustable."}, {"file": "webgl/gradients/red-flow.html", "cat": "webgl-gradients", "src": "webgl", "thumb": "_thumbs/webgl_gradients_red-flow.jpg", "title": "Красный градиент-занавес", "title_en": "Red gradient curtain", "desc": "Мягкий красный «занавес» света на чёрном, волнуется от движения мыши.", "desc_en": "A soft red curtain of light on black that ripples with the mouse."}, {"file": "webgl/gradients/fluted-glass.html", "cat": "webgl-gradients", "src": "webgl", "thumb": "_thumbs/webgl_gradients_fluted-glass.jpg", "title": "Градиент за рифлёным стеклом", "title_en": "Gradient behind fluted glass", "desc": "Шумовой сине-мятный градиент сквозь рифлёное стекло, число полос регулируется.", "desc_en": "A blue and mint noise gradient behind fluted glass with an adjustable number of flutes."}, {"file": "webgl/gradients/azure-waves.html", "cat": "webgl-gradients", "src": "webgl", "thumb": "_thumbs/webgl_gradients_azure-waves.jpg", "title": "Синие стеклянные волны", "title_en": "Blue glass waves", "desc": "Широкая лента сине-фиолетовых волн с бликами на белом фоне.", "desc_en": "A wide band of blue and violet waves with highlights on white."}, {"file": "webgl/gradients/soft-shapes.html", "cat": "webgl-gradients", "src": "webgl", "thumb": "_thumbs/webgl_gradients_soft-shapes.jpg", "title": "Стопка мягких форм", "title_en": "Soft shape stack", "desc": "Размытые лавандовые и мятные формы наслаиваются на светлом фоне.", "desc_en": "Blurred lavender and mint shapes layered on a light background."}, {"file": "webgl/light/neon-tubes.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_neon-tubes.jpg", "title": "Неоновые трубки", "title_en": "Neon tubes", "desc": "Четыре неоновые лампы с цветным свечением и отражением на полу. Трубки перетаскиваются мышью, цвета меняются.", "desc_en": "Four neon tubes with coloured glow and a reflection on the floor. Drag the tubes, change the colours."}, {"file": "webgl/light/light-doorway.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_light-doorway.jpg", "title": "Световой проём", "title_en": "Light doorway", "desc": "Объёмный свет из дверного проёма в бирюзовой дымке, камера медленно приближается. Под заголовок.", "desc_en": "Volumetric light from a doorway in teal haze while the camera slowly moves in. Room for a headline."}, {"file": "webgl/light/circuit-horizon.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_circuit-horizon.jpg", "title": "Схемы до горизонта", "title_en": "Circuits to the horizon", "desc": "Перспективная сетка из прямоугольных дорожек, по ним бегут светящиеся узлы. Крупный заголовок сверху.", "desc_en": "A perspective grid of rectangular traces with glowing nodes running along them. A large headline on top."}, {"file": "webgl/light/light-helix.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_light-helix.jpg", "title": "Световая спираль", "title_en": "Light helix", "desc": "Голубая спираль из нитей света с частицами и боке на тёмно-синем.", "desc_en": "A blue helix of light strands with particles and bokeh on dark blue."}, {"file": "webgl/light/horizon-burst.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_horizon-burst.jpg", "title": "Вспышка над горизонтом", "title_en": "Burst over the horizon", "desc": "Синий взрыв света над краем планеты, лучи и туманность. Мышь сдвигает вспышку.", "desc_en": "A blue burst of light over the edge of a planet, with rays and nebula. The mouse moves the flare."}, {"file": "webgl/light/nebula-rays.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_nebula-rays.jpg", "title": "Зелёные лучи туманности", "title_en": "Green nebula rays", "desc": "Лучи света из угла экрана в глубоком бирюзовом, под центральный заголовок.", "desc_en": "Rays of light from a corner in deep teal, framing a centred headline."}, {"file": "webgl/light/led-grid.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_led-grid.jpg", "title": "Светодиодная сетка", "title_en": "LED grid", "desc": "Сетка точек загорается по рисуемым линиям, мышь тоже рисует светом.", "desc_en": "A grid of dots lights up along drawn lines; the mouse paints with light too."}, {"file": "webgl/light/light-collision.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_light-collision.jpg", "title": "Столкновение лучей", "title_en": "Light collision", "desc": "Тёплый и холодный лучи встречаются в одной точке, с хроматической аберрацией и зерном.", "desc_en": "A warm and a cold beam meet at one point, with chromatic aberration and grain."}, {"file": "webgl/light/light-blades.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_light-blades.jpg", "title": "Световые лезвия", "title_en": "Light blades", "desc": "Изогнутые белые блики, как отражения на клинках, плавно скользят.", "desc_en": "Curved white highlights, like reflections on blades, glide smoothly."}, {"file": "webgl/light/laser-beam.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_laser-beam.jpg", "title": "Лазерный луч", "title_en": "Laser beam", "desc": "Фиолетовый луч бьёт в землю и поднимает подсвеченный дым.", "desc_en": "A violet beam strikes the ground and lifts lit smoke."}, {"file": "webgl/light/ray-fan.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_ray-fan.jpg", "title": "Веер прожекторов", "title_en": "Floodlight fan", "desc": "Полукруг зелёных лучей, как свет стадиона, пульсирует наружу.", "desc_en": "A half circle of green rays, like stadium lights, pulses outwards."}, {"file": "webgl/light/electric-ring.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_electric-ring.jpg", "title": "Электрическое кольцо", "title_en": "Electric ring", "desc": "Синий эллипс-портал с бегущими молниями.", "desc_en": "A blue elliptical portal with running lightning."}, {"file": "webgl/light/ghost-ring.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_ghost-ring.jpg", "title": "Призрачное кольцо", "title_en": "Ghost ring", "desc": "Фиолетовое светящееся кольцо дышит и колышется, поверх символьный дизеринг.", "desc_en": "A glowing violet ring breathes and sways under glyph dithering."}, {"file": "webgl/light/red-blinds.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_red-blinds.jpg", "title": "Красные жалюзи", "title_en": "Red blinds", "desc": "Диагональный луч из красно-розовых квадратов-ламелей на тёмно-бирюзовом.", "desc_en": "A diagonal beam of red and pink slats on dark teal."}, {"file": "webgl/light/arc-lines-scan.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_arc-lines-scan.jpg", "title": "Дуги и сканирующий луч", "title_en": "Arcs and a scanning beam", "desc": "Пучок тонких синих линий-дуг, по нему проходит яркий луч сканера.", "desc_en": "A bundle of thin blue arcs swept by a bright scanning beam."}, {"file": "webgl/light/glass-logo-beams.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_glass-logo-beams.jpg", "title": "Стеклянный логотип в лучах света", "title_en": "Glass logo in light beams", "desc": "Логотип из стекла преломляет тёплые лучи на тёмно-коричневом. Можно загрузить свой PNG-логотип.", "desc_en": "A glass logo refracts warm beams on dark brown. Load your own PNG logo."}, {"file": "webgl/light/embossed-chip.html", "cat": "webgl-light", "src": "webgl", "thumb": "_thumbs/webgl_light_embossed-chip.jpg", "title": "Чип с бегущим светом", "title_en": "Chip with travelling light", "desc": "Тёмный чип с выдавленной надписью, по нему проходит точечный свет и зажигает рельеф.", "desc_en": "A dark chip with embossed lettering; a point light sweeps across and lights up the relief."}, {"file": "webgl/3d/circuit-board.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_circuit-board.jpg", "title": "Печатная плата с ASCII-линзой", "title_en": "Circuit board with an ASCII lens", "desc": "3D-плата с контурами и медными дорожками вращается над пиксельным заголовком. Курсор открывает круг оранжевых ASCII-символов.", "desc_en": "A 3D board with outlines and copper traces turns above a pixel headline. The cursor opens a circle of orange ASCII."}, {"file": "webgl/3d/voxel-clouds.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_voxel-clouds.jpg", "title": "Воксельные облака", "title_en": "Voxel clouds", "desc": "Потолок из кубических облаков над лавандовым небом, заголовок проявляется пиксельными блоками.", "desc_en": "A ceiling of cubic clouds over a lavender sky; the headline appears in pixel blocks."}, {"file": "webgl/3d/translucent-discs.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_translucent-discs.jpg", "title": "Полупрозрачные диски", "title_en": "Translucent discs", "desc": "Пять цветных дисков веером, наклоняются к курсору и отбрасывают радужную тень. Чистый CSS 3D.", "desc_en": "Five coloured discs in a fan tilt towards the cursor and cast a rainbow shadow. Pure CSS 3D."}, {"file": "webgl/3d/marble-run.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_marble-run.jpg", "title": "Шарик на трассе", "title_en": "Marble run", "desc": "Хромовый шарик катится по глянцевой синей трассе на опорах, камера идёт следом, фон мягко размыт.", "desc_en": "A chrome marble rolls along a glossy blue track on supports, the camera follows, the background is softly blurred."}, {"file": "webgl/3d/cd-carousel.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_cd-carousel.jpg", "title": "Карусель CD", "title_en": "CD carousel", "desc": "Диски с обложками летают по кругу и вращаются, ползунок прогресса можно тянуть. CSS 3D.", "desc_en": "Discs with covers fly in a circle and spin; the progress slider can be dragged. CSS le": "Слипающиеся шары", "title_en": "Merging spheres", "desc": "Шестнадцать глянцевых шаров стягиваются к центру и сливаются, мышь их подбрасывает. С метками трекинга.", "desc_en": "Sixteen glossy spheres pull to the centre and merge; the mouse tosses them. With tracking labels."}, {"file": "webgl/3d/wobble-blob.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_wobble-blob.jpg", "title": "Колышущаяся капля", "title_en": "Wobbling blob", "desc": "Тёмная 3D-капля с бирюзовым внутренним свечением, под ней бегущая строка.", "desc_en": "A dark 3D blob with a teal inner glow, a ticker beneath it."}, {"file": "webgl/3d/burning-tetra.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_burning-tetra.jpg", "title": "Огненный тетраэдр", "title_en": "Fire tetrahedron", "desc": "Тетраэдр на светодиодном табло: огненные точки, лучи от вершин, плавно появляется и гаснет.", "desc_en": "A tetrahedron on an LED board: fiery dots and rays from the vertices, fading in and out smoothly."}, {"file": "webgl/3d/hologram-bloom.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_hologram-bloom.jpg", "title": "Голографический цветок", "title_en": "Holographic bloom", "desc": "Кристаллическая 3D-форма с радужными гранями вращается и дышит.", "desc_en": "A crystalline 3D form with iridescent faces rotates and breathes."}, {"file": "webgl/3d/slab-ring.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_slab-ring.jpg", "title": "Кольцо из хромовых пластин", "title_en": "Ring of chrome slabs", "desc": "Кольцо зелёно-жёлтых зеркальных пластин вращается, камера отъезжает от крупного плана.", "desc_en": "A ring of green-gold mirror slabs rotates as the camera pulls back from a close-up."}, {"file": "webgl/3d/pillow-landscape.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_pillow-landscape.jpg", "title": "Мягкий ландшафт", "title_en": "Pillow landscape", "desc": "Монохромные «подушки» под боковым светом с мягки : "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_coil-rays.jpg", "title": "Пружина с лучами", "title_en": "Coil with rays", "desc": "Синяя спираль вращается, от неё расходятся световые лучи.", "desc_en": "A blue coil rotates while rays of light spread from it."}, {"file": "webgl/3d/gem.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_gem.jpg", "title": "Кристалл", "title_en": "Gem", "desc": "Бриллиант огранки с внутренними отражениями вращается над заголовком из шума.", "desc_en": "A brilliant-cut diamond with internal reflections turns above a headline made of noise."}, {"file": "webgl/3d/iso-landscape.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_iso-landscape.jpg", "title": "Изометрический пейзаж", "title_en": "Isometric landscape", "desc": "Пастельная сетка-рельеф с волнами высоты, от курсора расходится рябь.", "desc_en": "A pastel relief grid with height waves; ripples spread from the cursor."}, {"file": "webgl/3d/hand-horns.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_hand-horns.jpg", "title": "Рука «коза»", "title_en": "Horns hand", "desc": "Нефритовая 3D-рука с метками трекинга и подписями.", "desc_en": "A jade 3D hand with tracking markers and labels."}, {"file": "webgl/3d/balloon-dog.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_balloon-dog.jpg", "title": "Надувная собака", "title_en": "Balloon dog", "desc": "Глянцевая собачка из воздушных шариков проявляется из пикселей, мышь её растягивает.", "desc_en": "A glossy balloon dog emerges from pixels; the mouse stretches it."}, {"file": "webgl/3d/asteroid.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_asteroid.jpg", "title": "Астероид", "title_en": "Asteroid", "desc": "Каменная глыба медленно вращается в космосе, жёсткий свет и тёплое свечение по краю.", "desc_en": "A rock turns slowly in space with hard light and a warm rim glow."}, {"file": "webgl/3d/silver-swirl.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_silver-swirl.jpg", "title": "Серебряный завиток", "title_en": "Silver swirl", "desc": "Закрученная серебряная форма перед крупным серым заголовком.", "desc_en": "A twisted silver form in front of a large grey headline."}, {"file": "webgl/3d/disc-wave.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_disc-wave.jpg", "title": "Волна переворачивающихся дисков", "title_en": "Flipping disc wave", "desc": "Сетка объёмных синих дисков переворачивается волной с бликами. Чистый CSS.", "desc_en": "A grid of chunky blue discs flips over in a wave with highlights. Pure CSS."}, {"file": "webgl/3d/wireframe-globe.html", "cat": "webgl-3d", "src": "webgl", "thumb": "_thumbs/webgl_3d_wireframe-globe.jpg", "title": "Каркасный глобус", "title_en": "Wireframe globe", "desc": "Чёрный глобус из меридианов на ярко-зелёном, как постер. SVG.", "desc_en": "A black globe of meridians on bright green, like a poster. SVG."}, {"file": "webgl/text/chrome-scatter.html", "cat": "webgl-text", "src": "webgl", "thumb": "_thumbs/webgl_text_chrome-scatter.jpg", "title": "Хромовые буквы разлетаются", "title_en": "Scattering chrome letters", "desc": "Хромовая надпись прописью распадается, кувыркается и собирается обратно, буквы убегают от курсора.", "desc_en": "Chrome script lettering breaks apart, tumbles and reassembles; letters run from the cursor."}, {"file": "webgl/text/spray-dither-text.html", "cat": "webgl-text", "src": "webgl", "thumb": "_thumbs/webgl_text_spray-dither-text.jpg", "title": "Текст спреем с дизерингом", "title_en": "Spray text with dithering", "desc": "Размытая волнистая надпись в бело-синем дизеринге с HUD-прицелами.", "desc_en": "Blurry wavy lettering in white and blue dithering with HUD crosshairs."}, {"file": "webgl/text/particle-text.html", "cat": "webgl-text", "src": "webgl", "thumb": "_thumbs/webgl_text_particle-text.jpg", "title": "Надпись из частиц", "title_en": "Particle lettering", "desc": "Слово из оранжевых час     const to = el.dataset.roll;

    el.innerHTML = [...to].map(() => `<span class="dg" aria-hidden="true"><span>${'0123456789'.split('').map((d) => `<i>${d}</i>`).join('')}</span></span>`).join('');
    $$('.dg > span', el).forEach((s, k) => { s.style.transform = `translateY(${-((+to[k] + 6) % 10) * 10}%)`; });
  }
  function rollRun(el, base) {
    const to = el.dataset.roll;
    $$('.dg > span', el).forEach((s, k) => {
      s.style.transitionDelay = `${base + k * 110}ms`;
      s.style.transform = `translateY(${-to[k] * 10}%)`;
    });
  }
  const stats = $('[data-stats]');
  $$('[data-roll]', stats).forEach(rollBuild);
  if (reduce) $$('[data-roll]', stats).forEach((el) => rollRun(el, 0));
  else {
    stats.addEventListener('reveal', () => $$('[data-roll]', stats).forEach((el, i) => rollRun(el, i * 120)));
    io.observe(stats);
  }

  const FEATURED = [
    ['webgl/3d/laptop.html', 2, true],
    ['webgl/3d/glass-hash.html', 6],
    ['webgl/mouse/koi-pond.html', 6],
    ['webgl/3d/asteroid.html', 4],
    ['webgl/3d/balloon-dog.html', 8],
    ['webgl/3d/slab-ring.html', 7.5, true],
    ['webgl/light/neon-tubes.html', 6],
    ['webgl/text/liquid-chrome.html', 6],
  ];
  const featured = $('#featured');
  featured.innerHTML = FEATURED.map(([f, t, wide], k) => {
    const i = byFile[f];
    return `<article class="card${wide ? ' card--wide' : ''}" data-reveal data-file="${esc(f)}">
      <div class="media" data-src="${esc(f)}?embed&amp;t=${t}"><img src="${esc(i.thumb)}" alt="" loading="lazy" decoding="async"></div>
      <div class="cap"><span class="n">${String(k + 1).padStart(2, '0')}</span><h3></h3><a class="open" href="${esc(f)}" target="_blank" rel="noopener"></a><p></p><span class="label"></span></div>
    </article>`;
  }).join('');
  function featuredText() {
    $$('.card', featured).forEach((c) => {
      const i = byFile[c.dataset.file];
      $('h3', c).textContent = tt(i);
      $('p', c).textContent = dd(i);
      $('.label', c).textContent = catName(i.cat);
      $('.open', c).textContent = `${T[lang].open} ↗`;
      $('.media', c).dataset.title = tt(i);
    });
  }
  const ready = new WeakMap();
  function load(m) {
    if ($('iframe', m)) return;
    const f = document.createElement('iframe');
    f.title = m.dataset.title || '';
    f.tabIndex = -1;
    f.setAttribute('allow', 'autoplay');
    f.addEventListener('load', () => { if (f.src.startsWith('about:')) return; ready.set(f, setTimeout(() => m.classList.add('live'), 1600)); }, { once: true });
    f.src = m.dataset.src;
    m.append(f);
  }
  function unload(m) {
    const f = $('iframe', m);
    if (!f) return;
    clearTimeout(ready.get(f));
    m.classList.remove('live');
    f.src = 'about:blank';
    f.remove();
  }
  addEventListener('message', (e) => {
    if (e.data !== 'mk-ready') return;
    const f = $$('.media iframe').find((x) => x.contentWindow === e.source);
    if (f) { clearTimeout(ready.get(f)); f.parentElement.classList.add('live'); }
  });
  const nearIO = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && load(e.target)), { rootMargin: '20% 0px' });
  const farIO = new IntersectionObserver((es) => es.forEach((e) => !e.isIntersecting && unload(e.target)), { rootMargin: '60% 0px' });
  $$('.media', featured).forEach((m) => { nearIO.observe(m); farIO.observe(m); });

  const order = items.map((x, k) => [x, (k * 0.6180339887) % 1]).sort((a, b) => a[1] - b[1]).map((x) => x[0]);
  const pick = order.filter((x, k) => k % 3 === 0);
  const rows = $$('[data-row]').map((row, r) => {
    const list = pick.filter((x, k) => k % 2 === r);
    const html = list.map((i) => `<a class="tile" href="${esc(i.file)}" target="_blank" rel="noopener" data-file="${esc(i.file)}"><img data-src="${esc(i.thumb)}" alt="" decoding="async"><span></span></a>`).join('');
    row.innerHTML = html + html.replace(/<a class="tile"/g, '<a class="tile" tabindex="-1" aria-hidden="true"');
    return { el: row, n: list.length, x: 0, period: 0, start: r ? .5 : 0, dir: r ? 1 : -1, v: 1, hover: 0 };
  });
  function marqueeText() {
    $$('.tile').forEach((a) => { const i = byFile[a.dataset.file]; a.querySelector('span').textContent = tt(i); a.setAttribute('aria-label', tt(i)); });
  }
  rows.forEach((r) => {
    r.el.addEventListener('pointerenter', (e) => { if (e.pointerType !== 'touch') r.hover = 1; });
    r.el.addEventListener('pointerleave', () => { r.hover = 0; });
    r.el.addEventListener('focusin', () => { r.hover = 1; });
    r.el.addEventListener('focusout', () => { r.hover = 0; });
  });
  let mqOn = false, mqRaf = 0, mqLast = 0, scrollV = 0, lastScroll = scrollY, lastScrollT = performance.now();
  function marquee(now) {
    const dt = Math.min(.05, (now - mqLast) / 1000);
    mqLast = now;
    scrollV *= Math.exp(-dt * 3.5);
    rows.forEach((r) => {
      if (!r.period) {
        r.period = r.el.children[r.n].offsetLeft - r.el.children[0].offsetLeft;
        if (r.start) { r.x = -r.period * r.start; r.start = 0; }
      }
      const half = r.period;
      if (!half) return;
      const target = (1 - r.hover) * (1 + clamp(Math.abs(scrollV) / 900, 0, 4));
      r.v += (target - r.v) * (1 - Math.exp(-dt * 5));
      r.x += r.dir * r.v * 34 * dt;
      r.x = ((r.x % half) - half) % half;
      r.el.style.transform = `translate3d(${r.x.toFixed(2)}px, 0, 0)`;
    });
    mqRaf = mqOn ? requestAnimationFrame(marquee) : 0;
  }
  new IntersectionObserver(([e], o) => {
    if (!e.isIntersecting) return;
    $$('[data-marquee] img[data-src]').forEach((im) => { im.src = im.dataset.src; im.removeAttribute('data-src'); });
    o.disconnect();
  }, { rootMargin: '120% 0px' }).observe($('[data-marquee]'));
  if (!reduce) new IntersectionObserver(([e]) => {
    mqOn = e.isIntersecting;
    if (mqOn && !mqRaf) { mqLast = performance.now(); mqRaf = requestAnimationFrame(marquee); }
  }).observe($('[data-marquee]'));

  function indexRender() {
    ['motion', 'webgl'].forEach((src) => {
      const n = src === 'motion' ? nMotion : nWebgl;
      $(`[data-ix-head="${src}"]`).textContent = `${src === 'motion' ? T[lang].ixMotion : T[lang].ixWebgl} · ${n}`;
      $(`[data-ix="${src}"]`).innerHTML = cats.filter((c) => items.some((i) => i.cat === c[0] && i.src === src)).map(([k]) => {
        const list = items.filter((i) => i.cat === k);
        return `<div class="grp"><a class="label" href="catalog.html#${esc(k)}">${esc(catName(k))}<span>${list.length}</span></a><ul>${list.map((i) => `<li><a href="${esc(i.file)}" target="_blank" rel="noopener" data-thumb="${esc(i.thumb)}">${esc(tt(i))}</a></li>`).join('')}</ul></div>`;
      }).join('');
    });
  }

  const peek = $('.peek'), pimg = $('img', peek);
  const pk = { x: 0, y: 0, tx: 0, ty: 0, vis: 0, tv: 0, rot: 0, raf: 0, last: 0 };
  function peekStep(now) {
    const dt = Math.min(.05, (now - pk.last) / 1000 || .016);
    pk.last = now;
    const ox = pk.x;
    pk.x += (pk.tx - pk.x) * (1 - Math.exp(-dt * 13));
    pk.y += (pk.ty - pk.y) * (1 - Math.exp(-dt * 13));
    const vx = (pk.x - ox) / Math.max(dt, 1e-3);
    pk.rot += (clamp(vx * .011, -10, 10) - pk.rot) * (1 - Math.exp(-dt * 9));
    pk.vis += (pk.tv - pk.vis) * (1 - Math.exp(-dt * 15));
    const w = peek.offsetWidth, h = peek.offsetHeight;
    const left = pk.x + 28 + w > innerWidth - 12 ? pk.x - 28 - w : pk.x + 28;
    const top = clamp(pk.y - h / 2, 12, innerHeight - h - 12);
    peek.style.opacity = pk.vis.toFixed(3);
    peek.style.transform = `translate3d(${left.toFixed(1)}px, ${top.toFixed(1)}px, 0) rotate(${(reduce ? 0 : pk.rot).toFixed(2)}deg) scale(${(.86 + .14 * pk.vis).toFixed(3)})`;
    const moving = Math.abs(pk.tv - pk.vis) > .002 || Math.abs(pk.tx - pk.x) > .3 || Math.abs(pk.ty - pk.y) > .3 || Math.abs(pk.rot) > .05;
    pk.raf = moving ? requestAnimationFrame(peekStep) : 0;
  }
  const peekKick = () => { if (!pk.raf) { pk.last = performance.now(); pk.raf = requestAnimationFrame(peekStep); } };
  if (fine) {
    document.addEventListener('pointerover', (e) => {
      const a = e.target.closest?.('[data-thumb]');
      if (!a || e.pointerType === 'touch') return;
      if (pimg.getAttribute('src') !== a.dataset.thumb) pimg.src = a.dataset.thumb;
      if (pk.vis < .03) { pk.x = pk.tx = e.clientX; pk.y = pk.ty = e.clientY; }
      pk.tv = 1;
      peekKick();
    });
    document.addEventListener('pointerout', (e) => {
      const a = e.target.closest?.('[data-thumb]');
      if (a && !(e.relatedTarget && a.contains(e.relatedTarget))) { pk.tv = 0; peekKick(); }
    });
    addEventListener('pointermove', (e) => { pk.tx = e.clientX; pk.ty = e.clientY; if (pk.tv || pk.vis > .01) peekKick(); }, { passive: true });
    addEventListener('scroll', () => { if (pk.tv) { pk.tv = 0; peekKick(); } }, { passive: true });
  }

  function applyLang() {
    const L = T[lang];
    document.documentElement.lang = lang;
    document.title = L.docTitle;
    $$('[data-t]').forEach((el) => {
      const v = L[el.dataset.t];
      if (el.classList.contains('split')) split(el, v);
      else el.textContent = v;
    });
    wordsSet(L.intro);
    $$('[data-l]').forEach((s) => s.setAttribute('aria-current', String(s.dataset.l === lang)));
    featuredText();
    marqueeText();
    indexRender();
  }
  $('[data-lang]').addEventListener('click', () => {
    lang = lang === 'ru' ? 'en' : 'ru';
    try { localStorage.setItem('mk-lang', lang); } catch (e) {}
    applyLang();
    if (heroCtl && word.width) { paintWord(word.width, word.height); heroCtl.tex('uText', word, { mips: true }); }
  });
  applyLang();
  $$('.split, [data-reveal]').forEach((el) => io.observe(el));

  const nav = $('[data-nav]'), hero = $('.hero'), heroUi = $('.hero-ui'), foot = $('[data-foot]'), main = $('main');
  let heroP = 0, lastY = scrollY, ticking = false;
  function onScroll() {
    ticking = false;
    const y = scrollY, now = performance.now();
    const dy = y - lastScroll;
    scrollV = scrollV * .6 + (dy / Math.max(1, now - lastScrollT)) * 1000 * .4;
    lastScroll = y;
    lastScrollT = now;
    heroP = clamp(y / hero.offsetHeight, 0, 1);
    if (!reduce) {
      heroUi.style.opacity = clamp(1 - heroP * 1.8, 0, 1).toFixed(3);
      heroUi.style.transform = `translate3d(0, ${(-heroP * 70).toFixed(1)}px, 0)`;
      wordsUpdate();
      const r = main.getBoundingClientRect(), fh = foot.parentElement.offsetHeight;
      const p = clamp((innerHeight - r.bottom) / fh, 0, 1);
      foot.style.transform = `translate3d(0, ${((1 - p) * 22).toFixed(2)}%, 0)`;
      foot.style.opacity = (.2 + .8 * p).toFixed(3);
    }
    if (Math.abs(y - lastY) > 6) {
      nav.classList.toggle('is-hidden', y > lastY && y > 140 && !nav.contains(document.activeElement));
      lastY = y;
    }
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  addEventListener('resize', () => { fitFoot(); rows.forEach((r) => { r.period = 0; }); onScroll(); });

  const footWord = $('.foot-word'), footSpan = $('span', footWord);
  function fitFoot() {
    footWord.style.fontSize = '100px';
    const w = footSpan.getBoundingClientRect().width;
    if (w) footWord.style.fontSize = `${(100 * footWord.clientWidth / w).toFixed(2)}px`;
  }
  fitFoot();
  document.fonts?.ready.then(fitFoot);
  onScroll();

  const word = document.createElement('canvas');
  let lift = 0, gem = .39;
  function paintWord(W, H) {
    const c = word, ctx = c.getContext('2d');
    c.width = W;
    c.height = H;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    const tall = W / H < .82, lines = tall ? ['sxw', 'rpv'] : ['sxwrpv'];
    const k = W / Math.max(1, hero.clientWidth), top = 72 * k, bottom = Math.min(H, (heroUi.offsetTop - 16) * k);
    const fam = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif';
    const set = (s) => { ctx.font = `700 ${s}px ${fam}`; if ('letterSpacing' in ctx) ctx.letterSpacing = `${(-.045 * s).toFixed(2)}px`; };
    set(100);
    const mw = Math.max(...lines.map((l) => ctx.measureText(l).width));
    const xr = (ctx.measureText('x').actualBoundingBoxAscent || 52) / 100, dr = (ctx.measureText('p').actualBoundingBoxDescent || 21) / 100, lr = .9;
    let s = 100 * (W * (tall ? .86 : .9)) / mw;
    s = Math.min(s, Math.max(40 * k, (bottom - top) * .94) / (tall ? lr + xr + dr : xr + dr));
    set(s);
    const xh = xr * s, lh = lr * s, half = tall ? (lh + xh) / 2 : xh / 2;
    const cy = Math.max(top + half, Math.min(H / 2 * (1 - (tall ? .2 : .03)), bottom - half - dr * s));
    lift = 1 - 2 * cy / H;
    gem = Math.min(.42, (tall ? .86 : .73) * xh / (H / 2));
    const y0 = cy + xh / 2 - ((lines.length - 1) * lh) / 2;
    lines.forEach((l, i) => ctx.fillText(l, W / 2, y0 + i * lh));
  }
  const heroCtl = shader({
    canvas: '#hero-gl',
    budget: 5.5e6,
    mouseEase: 3.2,
    uniforms: { uScroll: () => heroP, uLift: () => lift, uGem: () => gem },
    passes: [{ id: 'uScene', fs: 'hero-scene', float: true }, ...bloom('uScene', 5, 1.2), { fs: 'hero-main' }],
    onResize: (W, H, c) => { paintWord(W, H); c.tex('uText', word, { mips: true }); },
  });
  if (!heroCtl) hero.classList.add('no-gl');
  requestAnimationFrame(() => setTimeout(() => hero.classList.add('ready'), heroCtl ? 350 : 0));

  const demoCtl = shader({ canvas: '#demo-gl', fs: 'demo-fs', budget: 1.6e6, uniforms: { uA: '#ff5a36', uB: '#2b3dff', uC: '#f3e9dc' } });
  $$('[data-u]').forEach((inp) => inp.addEventListener('input', () => {
    demoCtl?.set(inp.dataset.u, inp.value);
    const v = $(`[data-hex="${inp.dataset.u}"]`);
    if (v) v.textContent = `'${inp.value}'`;
  }));
})();
</script>
</body>
</html>
