<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Notification stack and list</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #1f1f24; --line: #2c2c31; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; padding: 40px 24px; background: radial-gradient(120% 80% at 50% 0, #2a2140, var(--bg)); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
section { display: grid; gap: 14px; align-content: start; justify-items: center; }
h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 8px; }
.row button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
</style>
<style id="effect">
.nstack { position: relative; width: 340px; display: grid; cursor: pointer; }
.ncard { display: flex; gap: 12px; padding: 14px; border-radius: 20px; background: rgba(40, 40, 48, .82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, .06); text-align: left; color: var(--text); }
.ncard__app { width: 38px; height: 38px; flex: none; border-radius: 10px; display: grid; place-items: center; font-size: 20px; }
.ncard b { display: block; font-size: 15px; }
.ncard p { color: var(--muted); font-size: 14px; }
.ncard time { margin-left: auto; color: var(--muted); font-size: 12px; }
.nstack .ncard { grid-area: 1 / 1; transition: transform .55s cubic-bezier(.2, 1, .3, 1), opacity .35s; transform: translateY(calc(var(--i) * 12px)) scale(calc(1 - var(--i) * .05)); opacity: calc(1 - var(--i) * .3); z-index: calc(10 - var(--i)); }
.nstack .ncard:nth-child(n+4) { opacity: 0; }
.nstack.is-open .ncard { transform: translateY(calc(var(--i) * (100% + 10px))); opacity: 1; transition-delay: calc(var(--i) * 30ms); }
.nstack__count { position: absolute; left: 0; right: 0; bottom: -34px; text-align: center; color: var(--muted); font-size: 13px; transition: opacity .2s; }
.nstack.is-open .nstack__count { opacity: 0; }
.nlist { width: 340px; display: grid; gap: 10px; list-style: none; padding: 0; }
.nlist .ncard { position: relative; }
@media (prefers-reduced-motion: reduce) { .nstack .ncard { transition: none; } }
</style>
</head>
<body>
<section>
  <h2>Stack · click to expand</h2>
  <button class="nstack" type="button" data-stack aria-expanded="false" style="border:0;background:none;padding:0;font:inherit"><span class="nstack__count" data-count></span></button>
</section>
<section>
  <h2>List · add and remove with layout animation</h2>
  <div class="row"><button type="button" data-add>Add</button><button type="button" data-remove>Remove random</button></div>
  <ul class="nlist" data-list aria-live="polite"></ul>
</section>
<script>
const APPS = [['💬', '#3ddc84', 'Messages', 'Coffee tomorrow at 9?'], ['📞', '#4f9dff', 'Missed call', '+1 555 010 2024'], ['📅', '#ff6a3d', 'Calendar', 'Design review · 14:00'], ['⭐', '#ffd23f', 'Photos', 'Your sunset got 120 likes'], ['📦', '#b26bff', 'Tickets', 'Concert on Friday is confirmed']];
const card = ([icon, color, title, text], tag = 'div') => {
  const el = document.createElement(tag);
  el.className = 'ncard';
  el.innerHTML = `<span class="ncard__app" style="background:${color}" aria-hidden="true">${icon}</span><div><b>${title}</b><p>${text}</p></div><time>now</time>`;
  return el;
};
const stack = document.querySelector('[data-stack]');
APPS.forEach((a, i) => { const c = card(a, 'span'); c.style.setProperty('--i', i); stack.insertBefore(c, stack.lastElementChild); });
stack.querySelector('[data-count]').textContent = `+${APPS.length - 1} more`;
stack.addEventListener('click', () => { const open = !stack.classList.contains('is-open'); stack.classList.toggle('is-open', open); stack.setAttribute('aria-expanded', String(open)); });
const list = document.querySelector('[data-list]');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const flip = (mutate) => {
  const items = [...list.children];
  const first = new Map(items.map((el) => [el, el.getBoundingClientRect().top]));
  mutate();
  if (reduce) return;
  [...list.children].forEach((el) => {
    const f = first.get(el);
    if (f === undefined) { el.animate([{ opacity: 0, transform: 'translateY(-16px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2, 1, .3, 1)' }); return; }
    const d = f - el.getBoundingClientRect().top;
    if (d) el.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2, 1, .3, 1)' });
  });
};
let k = 0;
const add = () => flip(() => list.prepend(card(APPS[k++ % APPS.length], 'li')));
document.querySelector('[data-add]').addEventListener('click', add);
document.querySelector('[data-remove]').addEventListener('click', async () => {
  const items = [...list.children];
  if (!items.length) return;
  const el = items[Math.floor(Math.random() * items.length)];
  if (!reduce) await el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(40px) scale(.95)' }], { duration: 220, easing: 'ease-in' }).finished;
  flip(() => el.remove());
});
add(); add(); add();
</script>
</body>
</html>
