<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Expanding cards and app folder</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; padding: 32px 24px 80px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
h2 { max-width: 980px; margin: 0 auto 14px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
</style>
<style id="effect">
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; max-width: 980px; margin: 0 auto 50px; }
.story { position: relative; height: 340px; border: 0; padding: 0; border-radius: 22px; overflow: hidden; cursor: pointer; text-align: left; color: #fff; transition: transform .25s; }
.story:hover { transform: scale(.985); }
.story__bg { position: absolute; inset: 0; }
.story__label { position: absolute; left: 18px; top: 16px; font: 700 12px/1 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.story__title { position: absolute; left: 18px; right: 18px; bottom: 18px; font: 800 26px/1.1 system-ui, sans-serif; }
.article { position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: rgba(0, 0, 0, 0); transition: background-color .4s; }
.article.is-on { background: rgba(0, 0, 0, .7); }
.article__card { position: relative; width: min(720px, 100%); margin: 40px auto; border-radius: 22px; overflow: hidden; background: var(--panel); }
.article__hero { position: relative; height: 420px; color: #fff; }
.article__body { padding: 26px; display: grid; gap: 14px; color: var(--muted); opacity: 0; transform: translateY(20px); transition: opacity .4s .2s, transform .5s .2s cubic-bezier(.2, 1, .3, 1); }
.article.is-on .article__body { opacity: 1; transform: none; }
.article__close { position: absolute; right: 14px; top: 14px; z-index: 2; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .45); color: #fff; font-size: 20px; cursor: pointer; opacity: 0; transition: opacity .3s .3s; }
.article.is-on .article__close { opacity: 1; }
.folder-wrap { max-width: 980px; margin: 0 auto; }
.folder { width: 120px; height: 120px; padding: 12px; border: 0; border-radius: 28px; background: rgba(255, 255, 255, .14); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; cursor: pointer; }
.folder i, .folder-open__grid i { border-radius: 9px; aspect-ratio: 1; }
.folder-open { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(0, 0, 0, 0); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); transition: background-color .4s, backdrop-filter .4s, -webkit-backdrop-filter .4s; }
.folder-open.is-on { background: rgba(0, 0, 0, .35); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.folder-open__panel { width: min(360px, 90vw); padding: 24px; border-radius: 36px; background: rgba(60, 60, 70, .7); }
.folder-open__title { margin-bottom: 16px; text-align: center; font: 700 22px/1 system-ui, sans-serif; }
.folder-open__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.folder-open__grid i { border-radius: 18px; }
</style>
</head>
<body>
<h2>App Store style cards · click to open</h2>
<div class="cards" data-cards></div>
<h2>App folder</h2>
<div class="folder-wrap"><button class="folder" type="button" data-folder aria-label="Open Tools folder"></button></div>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.2, 1, .3, 1)';
const STORIES = [['Guide', 'A week without screens', '#ffb36b', '#a8324a'], ['Behind the scenes', 'A day in the studio', '#7ad0ff', '#273c8f'], ['Notes', 'Field notes from the night sky', '#c9f27a', '#2a6b3a']];
const cards = document.querySelector('[data-cards]');
const morph = (el, from, to, back = false) => {
  const kf = [{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width}, ${from.height / to.height})` }, { transform: 'none' }];
  el.style.transformOrigin = '0 0';
  return el.animate(back ? kf.reverse() : kf, { duration: back ? 420 : 600, easing: EASE, fill: back ? 'forwards' : 'none' });
};
STORIES.forEach(([label, title, a, b]) => {
  const bg = `linear-gradient(160deg, ${a}, ${b})`;
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'story';
  card.innerHTML = `<div class="story__bg" style="background:${bg}"></div><span class="story__label">${label}</span><span class="story__title">${title}</span>`;
  card.addEventListener('click', () => open(card, label, title, bg));
  cards.append(card);
});
function open(card, label, title, bg) {
  const layer = document.createElement('div');
  layer.className = 'article';
  layer.setAttribute('role', 'dialog');
  layer.setAttribute('aria-modal', 'true');
  layer.setAttribute('aria-label', title);
  layer.innerHTML = `<article class="article__card"><button class="article__close" type="button" aria-label="Close">×</button><div class="article__hero" style="background:${bg}"><span class="story__label">${label}</span><span class="story__title" style="font-size:38px">${title}</span></div><div class="article__body"><p>The card grows into the article using one measured transform, so it stays smooth even with long content.</p><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer nec odio. Praesent libero.</p><p>Sed cursus ante dapibus diam. Sed nisi. Nulla quis sem at nibh elementum imperdiet.</p></div></article>`;
  document.body.append(layer);
  document.body.style.overflow = 'hidden';
  const art = layer.querySelector('.article__card');
  const clipFrom = () => {
    const c = card.getBoundingClientRect(), a = art.getBoundingClientRect();
    return `inset(${c.top - a.top}px ${a.right - c.right}px ${a.bottom - c.bottom}px ${c.left - a.left}px round 22px)`;
  };
  card.style.visibility = 'hidden';
  if (!reduce) art.animate([{ clipPath: clipFrom() }, { clipPath: 'inset(0 0 0 0 round 22px)' }], { duration: 600, easing: EASE });
  layer.classList.add('is-on');
  const close = async () => {
    removeEventListener('keydown', esc);
    layer.classList.remove('is-on');
    if (!reduce) await art.animate([{ clipPath: 'inset(0 0 0 0 round 22px)' }, { clipPath: clipFrom() }], { duration: 420, easing: EASE, fill: 'forwards' }).finished;
    card.style.visibility = '';
    document.body.style.overflow = '';
    layer.remove();
    card.focus();
  };
  const esc = (e) => { if (e.key === 'Escape') close(); };
  addEventListener('keydown', esc);
  layer.querySelector('.article__close').addEventListener('click', close);
  layer.addEventListener('click', (e) => { if (e.target === layer) close(); });
  layer.querySelector('.article__close').focus();
}
const APPS = ['#ff6a3d', '#ffd23f', '#3ddc84', '#4f9dff', '#b26bff', '#ff5fa2', '#7affd8', '#e3a8ff', '#f4f4f5'];
const folder = document.querySelector('[data-folder]');
APPS.forEach((c) => { const i = document.createElement('i'); i.style.background = c; folder.append(i); });
folder.addEventListener('click', () => {
  const layer = document.createElement('div');
  layer.className = 'folder-open';
  layer.setAttribute('role', 'dialog');
  layer.setAttribute('aria-modal', 'true');
  layer.setAttribute('aria-label', 'Tools');
  layer.innerHTML = `<div class="folder-open__panel"><p class="folder-open__title">Tools</p><div class="folder-open__grid">${APPS.map((c) => `<i style="background:${c}"></i>`).join('')}</div></div>`;
  document.body.append(layer);
  const panel = layer.firstElementChild;
  folder.style.visibility = 'hidden';
  if (!reduce) {
    morph(panel, folder.getBoundingClientRect(), panel.getBoundingClientRect());
    [...panel.querySelectorAll('.folder-open__grid i')].forEach((icon, k) => icon.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 450, delay: 60 + k * 25, easing: EASE, fill: 'backwards' }));
  }
  requestAnimationFrame(() => layer.classList.add('is-on'));
  const close = async () => {
    removeEventListener('keydown', esc);
    layer.classList.remove('is-on');
    if (!reduce) await morph(panel, folder.getBoundingClientRect(), panel.getBoundingClientRect(), true).finished;
    folder.style.visibility = '';
    layer.remove();
    folder.focus();
  };
  const esc = (e) => { if (e.key === 'Escape') close(); };
  addEventListener('keydown', esc);
  layer.addEventListener('click', (e) => { if (e.target === layer) close(); });
});
</script>
</body>
</html>
