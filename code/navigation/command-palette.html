<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Command palette</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
.open { padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--muted); font: inherit; cursor: pointer; }
kbd { padding: 2px 6px; border: 1px solid var(--line); border-radius: 5px; font: 12px/1 ui-monospace, Menlo, monospace; color: var(--text); }
</style>
<style id="effect">
.palette { width: min(560px, 92vw); max-height: min(440px, 80vh); padding: 0; margin: 14vh auto auto; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--text); box-shadow: 0 30px 80px rgba(0, 0, 0, .6); overflow: hidden; }
.palette::backdrop { background: rgba(0, 0, 0, .5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.palette[open] { animation: pal-in .38s cubic-bezier(.2, 1.3, .3, 1); }
.palette[open]::backdrop { animation: pal-fade .25s; }
.palette.is-closing { animation: pal-out .18s ease-in forwards; }
@keyframes pal-in { from { opacity: 0; transform: translateY(-12px) scale(.96); } }
@keyframes pal-out { to { opacity: 0; transform: scale(.97); } }
@keyframes pal-fade { from { opacity: 0; } }
.palette__input { width: 100%; padding: 18px 20px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); font: 500 17px/1.2 system-ui, sans-serif; outline: none; }
.palette__list { position: relative; max-height: 340px; overflow-y: auto; padding: 8px; list-style: none; margin: 0; }
.palette__hl { position: absolute; left: 8px; right: 8px; top: 0; height: 44px; border-radius: 10px; background: var(--line); transform: translateY(var(--y, 0)); transition: transform .22s cubic-bezier(.2, .9, .3, 1.1); pointer-events: none; }
.palette__item { position: relative; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; cursor: pointer; }
.palette__item span:first-child { width: 22px; text-align: center; }
.palette__item small { margin-left: auto; color: var(--muted); }
.palette__empty { padding: 24px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .palette[open], .palette.is-closing { animation: none; } .palette__hl { transition: none; } }
</style>
</head>
<body>
<button class="open" type="button" data-open>Search or jump to… <kbd>⌘K</kbd></button>
<dialog class="palette" data-palette aria-label="Command palette">
  <input class="palette__input" data-q type="text" placeholder="Type a command…" role="combobox" aria-controls="pal-list" aria-expanded="true" autocomplete="off">
  <ul class="palette__list" id="pal-list" role="listbox" data-list><li class="palette__hl" aria-hidden="true" data-hl></li></ul>
</dialog>
<script>
const COMMANDS = [['🏠', 'Go to home', 'G H'], ['📝', 'New note', 'N'], ['⏱️', 'Start a focus timer', 'T'], ['🔗', 'Copy share link', '⌘L'], ['🎲', 'Surprise me', ''], ['🌙', 'Toggle dark mode', '⇧D'], ['🌍', 'Switch language', 'L'], ['⌨️', 'Keyboard shortcuts', '?'], ['📄', 'Privacy policy', '']];
const dlg = document.querySelector('[data-palette]');
const q = dlg.querySelector('[data-q]');
const list = dlg.querySelector('[data-list]');
const hl = dlg.querySelector('[data-hl]');
let items = [], active = 0;
function render() {
  const term = q.value.trim().toLowerCase();
  list.querySelectorAll('.palette__item, .palette__empty').forEach((el) => el.remove());
  items = COMMANDS.filter(([, name]) => name.toLowerCase().includes(term)).map(([icon, name, key], i) => {
    const li = document.createElement('li');
    li.className = 'palette__item';
    li.id = `pal-${i}`;
    li.setAttribute('role', 'option');
    li.innerHTML = `<span aria-hidden="true">${icon}</span><span>${name}</span>${key ? `<small>${key}</small>` : ''}`;
    li.addEventListener('pointermove', () => setActive(i));
    li.addEventListener('click', () => choose(i));
    list.append(li);
    return li;
  });
  if (!items.length) { const e = document.createElement('li'); e.className = 'palette__empty'; e.textContent = 'No results'; list.append(e); }
  hl.style.display = items.length ? '' : 'none';
  setActive(0);
}
function setActive(i) {
  if (!items.length) return;
  active = (i + items.length) % items.length;
  items.forEach((el, k) => el.setAttribute('aria-selected', String(k === active)));
  hl.style.setProperty('--y', `${items[active].offsetTop}px`);
  q.setAttribute('aria-activedescendant', items[active].id);
  items[active].scrollIntoView({ block: 'nearest' });
}
function choose(i) { const name = items[i].children[1].textContent; close(); setTimeout(() => alert(`→ ${name}`), 200); }
function open() { q.value = ''; render(); dlg.showModal(); q.focus(); }
function close() {
  if (!dlg.open) return;
  dlg.classList.add('is-closing');
  setTimeout(() => { dlg.classList.remove('is-closing'); dlg.close(); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180);
}
document.querySelector('[data-open]').addEventListener('click', open);
addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); dlg.open ? close() : open(); } });
q.addEventListener('input', render);
q.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
  if (e.key === 'Enter' && items.length) choose(active);
});
dlg.addEventListener('cancel', (e) => { e.preventDefault(); close(); });
dlg.addEventListener('click', (e) => { if (e.target === dlg) close(); });
</script>
</body>
</html>
