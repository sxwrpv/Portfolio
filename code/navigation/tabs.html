<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Tabs, tab select and toggle group</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; gap: 44px; padding: 32px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
</style>
<style id="effect">
.stabs { width: min(560px, 90vw); }
.stabs__list { position: relative; display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.stabs__tab { position: relative; padding: 10px 14px; border: 0; background: transparent; color: var(--muted); font: 600 15px/1 system-ui, sans-serif; cursor: pointer; transition: color .2s; }
.stabs__tab[aria-selected="true"] { color: var(--text); }
.stabs__ink { position: absolute; left: 0; bottom: -1px; height: 2px; width: var(--w, 0); background: var(--accent); transform: translateX(var(--x, 0)); transition: transform .4s cubic-bezier(.2, .9, .3, 1.15), width .4s cubic-bezier(.2, .9, .3, 1.15); }
.stabs__panels { position: relative; overflow: hidden; height: var(--h, auto); transition: height .4s cubic-bezier(.2, .9, .25, 1); }
.stabs__panel { padding: 18px 2px; color: var(--muted); }
.stabs__panel[hidden] { display: block; visibility: hidden; position: absolute; inset: 0 0 auto; }
.stabs__panel.is-enter { animation: tab-in .45s cubic-bezier(.2, .9, .25, 1) both; }
@keyframes tab-in { from { opacity: 0; transform: translateX(calc(var(--dir) * 30px)); filter: blur(3px); } }
.pills { position: relative; display: inline-flex; padding: 4px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.pills button { position: relative; z-index: 1; padding: 8px 16px; border: 0; background: transparent; color: var(--text); font: 600 14px/1 system-ui, sans-serif; cursor: pointer; }
.pills__hl { position: absolute; top: 4px; bottom: 4px; left: 0; width: var(--w, 0); border-radius: 999px; background: var(--text); transform: translateX(var(--x, 0)); transition: transform .45s cubic-bezier(.2, 1.1, .3, 1), width .45s cubic-bezier(.2, 1.1, .3, 1); }
.pills--blend .pills__hl { mix-blend-mode: difference; z-index: 2; pointer-events: none; }
.pills:not(.pills--blend) button[aria-pressed="true"], .pills:not(.pills--blend) button[aria-selected="true"] { color: var(--bg); transition: color .3s; }
@media (prefers-reduced-motion: reduce) { .stabs__ink, .pills__hl, .stabs__panels { transition: none; } .stabs__panel.is-enter { animation: none; } }
</style>
</head>
<body>
<section>
  <h2>Smooth tabs · sliding ink, directional content, animated height</h2>
  <div class="stabs" data-stabs>
    <div class="stabs__list" role="tablist" aria-label="Plans"><span class="stabs__ink" aria-hidden="true"></span></div>
    <div class="stabs__panels"></div>
  </div>
</section>
<section>
  <h2>Tab select</h2>
  <div class="pills" role="tablist" aria-label="Period" data-pills><span class="pills__hl" aria-hidden="true"></span><button type="button" role="tab" aria-selected="true">Day</button><button type="button" role="tab" aria-selected="false">Week</button><button type="button" role="tab" aria-selected="false">Month</button><button type="button" role="tab" aria-selected="false">Year</button></div>
</section>
<section>
  <h2>Toggle group · blend-mode highlight</h2>
  <div class="pills pills--blend" role="group" aria-label="Alignment" data-pills><span class="pills__hl" aria-hidden="true"></span><button type="button" aria-pressed="true">Left</button><button type="button" aria-pressed="false">Centre</button><button type="button" aria-pressed="false">Right</button></div>
</section>
<script>
const TABS = [['Overview', 'A short overview. Switching tabs slides the new panel in from the direction of the tab you picked.'], ['Pricing', 'Pricing details take more room, so the container animates its height.<br><br>Free for hobby projects. Pro from $9 a month. Studio plans for teams of any size.<br><br>Every plan includes unlimited ideas and the occasional bad pun.'], ['Reviews', '★★★★★ "Like a good playlist for my workflow."'], ['FAQ', 'Does it work offline? Yes, even on a plane.']];
const root = document.querySelector('[data-stabs]');
const list = root.querySelector('[role="tablist"]');
const ink = root.querySelector('.stabs__ink');
const panelsBox = root.querySelector('.stabs__panels');
let current = 0;
const tabs = TABS.map(([name, html], i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'stabs__tab'; b.id = `t${i}`; b.textContent = name;
  b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', `p${i}`); b.setAttribute('aria-selected', String(i === 0)); b.tabIndex = i === 0 ? 0 : -1;
  const p = document.createElement('div');
  p.className = 'stabs__panel'; p.id = `p${i}`; p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', b.id); p.hidden = i !== 0; p.innerHTML = html;
  list.append(b); panelsBox.append(p);
  b.addEventListener('click', () => select(i));
  b.addEventListener('keydown', (e) => { const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key]; if (d) { const n = (i + d + TABS.length) % TABS.length; select(n); tabs[n].b.focus(); } });
  return { b, p };
});
function moveInk() { const r = tabs[current].b; ink.style.setProperty('--x', `${r.offsetLeft}px`); ink.style.setProperty('--w', `${r.offsetWidth}px`); }
function select(i) {
  if (i === current) return;
  const dir = i > current ? 1 : -1;
  panelsBox.style.setProperty('--h', `${panelsBox.offsetHeight}px`);
  tabs.forEach(({ b, p }, k) => { b.setAttribute('aria-selected', String(k === i)); b.tabIndex = k === i ? 0 : -1; p.hidden = k !== i; p.classList.remove('is-enter'); });
  const p = tabs[i].p;
  p.style.setProperty('--dir', dir);
  void p.offsetWidth;
  p.classList.add('is-enter');
  current = i;
  moveInk();
  requestAnimationFrame(() => panelsBox.style.setProperty('--h', `${p.offsetHeight}px`));
}
moveInk();
panelsBox.style.setProperty('--h', `${tabs[0].p.offsetHeight}px`);
document.querySelectorAll('[data-pills]').forEach((group) => {
  const hl = group.querySelector('.pills__hl');
  const btns = [...group.querySelectorAll('button')];
  const attr = btns[0].hasAttribute('aria-pressed') ? 'aria-pressed' : 'aria-selected';
  const move = (b) => { hl.style.setProperty('--x', `${b.offsetLeft}px`); hl.style.setProperty('--w', `${b.offsetWidth}px`); };
  btns.forEach((b) => b.addEventListener('click', () => { btns.forEach((x) => x.setAttribute(attr, String(x === b))); move(b); }));
  move(btns.find((b) => b.getAttribute(attr) === 'true'));
});
addEventListener('resize', moveInk);
</script>
</body>
</html>
