<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Confetti button</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --text: #f4f4f5; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; overflow: hidden; }
</style>
<style id="effect">
.party { padding: 18px 34px; border: 0; border-radius: 999px; background: var(--accent); color: #111; font: 800 20px/1 system-ui, sans-serif; cursor: pointer; transition: transform .5s cubic-bezier(.2, 1.6, .3, 1); }
.party:hover { transform: scale(1.05); }
.party:active { transform: scale(.9); transition-duration: .1s; }
.confetti { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; will-change: transform, opacity; }
</style>
</head>
<body>
<button class="party" type="button" data-confetti>Celebrate 🎉</button>
<script>
const COLORS = ['#ff6a3d', '#ffd23f', '#4f9dff', '#3ddc84', '#ff5fa2', '#b26bff'];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x, y, count = 90) {
  if (reduce) return;
  const parts = Array.from({ length: count }, () => {
    const el = document.createElement('i');
    el.className = 'confetti';
    const w = 6 + Math.random() * 6, h = Math.random() < .3 ? w : w * (.4 + Math.random() * .5);
    el.style.width = `${w}px`;
    el.style.height = `${h}px`;
    el.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.style.borderRadius = Math.random() < .3 ? '50%' : '2px';
    document.body.append(el);
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * .9;
    const sp = 420 + Math.random() * 520;
    return { el, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 360, vr: (Math.random() - .5) * 900, flip: Math.random() * 6, life: 0, max: 1.6 + Math.random() * 1.2 };
  });
  let last = performance.now();
  const step = (now) => {
    const dt = Math.min(.033, (now - last) / 1000);
    last = now;
    let alive = 0;
    parts.forEach((p) => {
      if (!p.el.isConnected) return;
      p.life += dt;
      p.vy += 1100 * dt;
      p.vx *= Math.pow(.35, dt);
      p.vy *= Math.pow(.6, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.r += p.vr * dt;
      const o = Math.max(0, 1 - Math.max(0, p.life - p.max * .6) / (p.max * .4));
      p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotate(${p.r}deg) scaleY(${Math.cos(p.life * p.flip * 3)})`;
      p.el.style.opacity = o;
      if (p.life > p.max || p.y > innerHeight + 40) p.el.remove(); else alive++;
    });
    if (alive) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
document.querySelector('[data-confetti]').addEventListener('click', (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
});
</script>
</body>
</html>
