<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Cursor follow with springs</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; cursor: none; overflow: hidden; }
.tabs { display: flex; gap: 8px; cursor: auto; }
.tabs button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
p { color: var(--muted); }
</style>
<style id="effect">
.follower { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; border-radius: 50%; will-change: transform; }
.follower--dot { width: 10px; height: 10px; margin: -5px 0 0 -5px; background: var(--text); }
.follower--ring { width: 44px; height: 44px; margin: -22px 0 0 -22px; border: 2px solid var(--accent); }
.follower--tail { margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); width: var(--s); height: var(--s); background: var(--accent); opacity: var(--o); mix-blend-mode: screen; }
@media (hover: none) { .follower { display: none; } body { cursor: auto; } }
</style>
</head>
<body>
<div class="tabs" role="group" aria-label="Mode">
  <button type="button" data-mode="ring" aria-pressed="true">Dot + spring ring</button>
  <button type="button" data-mode="tail" aria-pressed="false">Multi-follow tail</button>
</div>
<p>Move the pointer around</p>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pointer = { x: innerWidth / 2, y: innerHeight / 2 };
addEventListener('pointermove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
const make = (cls, k, c, style = '') => {
  const el = document.createElement('div');
  el.className = `follower ${cls}`;
  el.setAttribute('style', style);
  el.setAttribute('aria-hidden', 'true');
  document.body.append(el);
  return { el, k, c, x: pointer.x, y: pointer.y, vx: 0, vy: 0, target: pointer };
};
let followers = [];
const setMode = (mode) => {
  followers.forEach((f) => f.el.remove());
  if (mode === 'ring') {
    const dot = make('follower--dot', 2000, 90);
    const ring = make('follower--ring', 170, 18);
    followers = [dot, ring];
  } else {
    followers = Array.from({ length: 7 }, (_, i) => make('follower--tail', 420 - i * 45, 30 - i * 2, `--s:${34 - i * 4}px;--o:${1 - i * .12}`));
    followers.forEach((f, i) => { if (i) f.target = followers[i - 1]; });
  }
};
document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  setMode(b.dataset.mode);
}));
setMode('ring');
let last = performance.now();
const frame = (now) => {
  const dt = Math.min(.032, (now - last) / 1000);
  last = now;
  followers.forEach((f) => {
    if (reduce) { f.x = pointer.x; f.y = pointer.y; }
    else for (let i = 0; i < 4; i++) {
      const h = dt / 4;
      f.vx += (-f.k * (f.x - f.target.x) - f.c * f.vx) * h;
      f.vy += (-f.k * (f.y - f.target.y) - f.c * f.vy) * h;
      f.x += f.vx * h;
      f.y += f.vy * h;
    }
    f.el.style.transform = `translate3d(${f.x}px, ${f.y}px, 0)`;
  });
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
