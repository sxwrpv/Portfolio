<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Image hover follow</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
.list { width: min(90vw, 760px); list-style: none; padding: 0; }
.list a { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 4px; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; font: 800 clamp(26px, 4.5vw, 46px)/1.1 system-ui, sans-serif; letter-spacing: -.02em; transition: color .2s, padding .3s; }
.list a span { font-size: 15px; font-weight: 500; color: var(--muted); }
.list a:hover { color: var(--accent); padding-left: 14px; }
</style>
<style id="effect">
.hover-img { position: fixed; left: 0; top: 0; z-index: 20; width: 260px; height: 320px; margin: -160px 0 0 -130px; border-radius: 14px; pointer-events: none; overflow: hidden; opacity: 0; scale: .6; transition: opacity .25s, scale .4s cubic-bezier(.2, .9, .3, 1.2); will-change: transform; }
.hover-img.is-on { opacity: 1; scale: 1; }
.hover-img__inner { position: absolute; inset: 0; transition: background .35s; }
@media (hover: none) { .hover-img { display: none; } }
</style>
</head>
<body>
<ul class="list">
  <li><a href="#" data-img="linear-gradient(150deg,#ffb36b,#a8324a)">Paper Moons <span>2024</span></a></li>
  <li><a href="#" data-img="linear-gradient(150deg,#7ad0ff,#273c8f)">Blue Hour <span>2025</span></a></li>
  <li><a href="#" data-img="linear-gradient(150deg,#c9f27a,#2a6b3a)">Wild Garden <span>2025</span></a></li>
  <li><a href="#" data-img="linear-gradient(150deg,#e3a8ff,#4b2a8f)">Night Swim <span>2026</span></a></li>
</ul>
<div class="hover-img" data-hover-img aria-hidden="true"><div class="hover-img__inner"></div></div>
<script>
const box = document.querySelector('[data-hover-img]');
const inner = box.firstElementChild;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const p = { x: 0, y: 0 }, s = { x: 0, y: 0, vx: 0, vy: 0 };
let skx = 0, sky = 0;
addEventListener('pointermove', (e) => { p.x = e.clientX; p.y = e.clientY; });
document.querySelectorAll('[data-img]').forEach((a) => {
  a.addEventListener('pointerenter', (e) => {
    if (!box.classList.contains('is-on')) { s.x = e.clientX; s.y = e.clientY; }
    inner.style.background = a.dataset.img;
    box.classList.add('is-on');
  });
  a.addEventListener('pointerleave', () => box.classList.remove('is-on'));
});
let last = performance.now(), acc = 0;
const frame = (now) => {
  acc = Math.min(.1, acc + Math.max(0, now - last) / 1000);
  last = now;
  while (acc >= 1 / 120) {
    const h = 1 / 120;
    s.vx += (-260 * (s.x - p.x) - 26 * s.vx) * h; s.x += s.vx * h;
    s.vy += (-260 * (s.y - p.y) - 26 * s.vy) * h; s.y += s.vy * h;
    skx += ((reduce ? 0 : Math.max(-25, Math.min(25, s.vx / 60))) - skx) * .08;
    sky += ((reduce ? 0 : Math.max(-15, Math.min(15, s.vy / 80))) - sky) * .08;
    acc -= h;
  }
  box.style.transform = `translate3d(${s.x}px, ${s.y}px, 0) skew(${-skx}deg, ${sky * .5}deg) rotate(${skx * .3}deg)`;
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
