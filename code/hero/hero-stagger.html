<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Hero with staggered spring entrance</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; background: radial-gradient(70% 60% at 50% 0, #2a1e2e, var(--bg)); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
.replay { position: fixed; right: 16px; bottom: 16px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
</style>
<style id="effect">
.hero { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 40px 20px; text-align: center; }
.hero__badge { display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; color: var(--muted); }
.hero__badge b { color: var(--accent); }
.hero__title { max-width: 14ch; font: 900 clamp(44px, 8vw, 96px)/.95 system-ui, sans-serif; letter-spacing: -.04em; }
.hero__lead { max-width: 52ch; color: var(--muted); font-size: 18px; }
.hero__cta { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.hero__cta a { padding: 14px 22px; border-radius: 12px; text-decoration: none; font-weight: 700; transition: transform .35s cubic-bezier(.2, 1.6, .3, 1); }
.hero__cta a:hover { transform: translateY(-2px) scale(1.03); }
.hero__cta a:first-child { background: var(--text); color: var(--bg); }
.hero__cta a:last-child { border: 1px solid var(--line); color: var(--text); }
.hero__stats { display: flex; gap: 34px; margin-top: 10px; color: var(--muted); font-size: 14px; }
.hero__stats b { display: block; color: var(--text); font-size: 26px; }
.hero [data-in] { opacity: 0; transform: translateY(24px) scale(.97); filter: blur(6px); }
.hero.is-in [data-in] { opacity: 1; transform: none; filter: none; transition: opacity .6s, filter .6s, transform var(--sd) var(--se); transition-delay: calc(var(--i) * 90ms); }
@media (prefers-reduced-motion: reduce) { .hero [data-in] { opacity: 1; transform: none; filter: none; } }
</style>
</head>
<body>
<section class="hero" data-hero>
  <span class="hero__badge" data-in><b>New</b> Spring collection is live</span>
  <h1 class="hero__title" data-in>Ideas, set in motion.</h1>
  <p class="hero__lead" data-in>Every element enters with the same spring, offset by a small delay, so the page settles in one smooth motion.</p>
  <div class="hero__cta" data-in><a href="#">Start exploring</a><a href="#">See how it works</a></div>
  <div class="hero__stats" data-in><span><b>12k</b>makers</span><span><b>4.9</b>rating</span><span><b>60 fps</b>smooth</span></div>
</section>
<button class="replay" type="button" data-replay>Replay</button>
<script>
function spring(stiffness = 220, damping = 20) {
  const w0 = Math.sqrt(stiffness), z = damping / (2 * Math.sqrt(stiffness)), wd = w0 * Math.sqrt(Math.max(1e-6, 1 - z * z));
  const x = (t) => (z < 1 ? 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)) : 1 - Math.exp(-w0 * t) * (1 + w0 * t));
  let T = .1;
  while (T < 5 && (Math.abs(1 - x(T)) > .001 || Math.abs(1 - x(T - .05)) > .001)) T += .02;
  const pts = Array.from({ length: 41 }, (_, i) => +x((T * i) / 40).toFixed(4));
  pts[40] = 1;
  return { easing: `linear(${pts.join(', ')})`, duration: Math.round(T * 1000) };
}
const hero = document.querySelector('[data-hero]');
const s = spring();
hero.style.setProperty('--se', s.easing);
hero.style.setProperty('--sd', `${s.duration}ms`);
hero.querySelectorAll('[data-in]').forEach((el, i) => el.style.setProperty('--i', i));
const play = () => { hero.classList.remove('is-in'); void hero.offsetWidth; hero.classList.add('is-in'); };
document.querySelector('[data-replay]').addEventListener('click', play);
play();
</script>
</body>
</html>
