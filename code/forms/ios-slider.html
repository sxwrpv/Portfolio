<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Stretchy slider</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --text: #f4f4f5; --muted: #a1a1aa; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 22px; background: radial-gradient(100% 80% at 50% 0, #2b2340, var(--bg)); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
small { color: var(--muted); }
</style>
<style id="effect">
.isl { position: relative; width: 300px; height: 56px; border-radius: 18px; background: rgba(255, 255, 255, .12); overflow: hidden; touch-action: none; cursor: grab; transform-origin: var(--origin, 50%) 50%; transform: scaleX(var(--sx, 1)) scaleY(var(--sy, 1)); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.isl:active { cursor: grabbing; }
.isl__fill { position: absolute; inset: 0; background: #fff; transform-origin: 0 50%; transform: scaleX(var(--v, .5)); }
.isl__icon { position: absolute; left: 16px; top: 50%; translate: 0 -50%; font-size: 22px; mix-blend-mode: difference; filter: grayscale(1); }
.isl:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<div class="isl" data-isl role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><div class="isl__fill"></div><span class="isl__icon" aria-hidden="true">🔊</span></div>
<small>Drag past either end to stretch it</small>
<script>
const el = document.querySelector('[data-isl]');
let v = .5, over = 0, ov = 0, drag = null;
const W = () => el.offsetWidth;
const render = () => {
  el.style.setProperty('--v', v.toFixed(4));
  const amt = Math.abs(over);
  el.style.setProperty('--sx', (1 + amt / W() * .6).toFixed(4));
  el.style.setProperty('--sy', (1 - amt / W() * .35).toFixed(4));
  el.style.setProperty('--origin', over > 0 ? '0%' : '100%');
  el.setAttribute('aria-valuenow', Math.round(v * 100));
};
el.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, v }; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const raw = drag.v + (e.clientX - drag.x) / W();
  v = Math.max(0, Math.min(1, raw));
  const extra = (raw - v) * W();
  over = Math.sign(extra) * Math.pow(Math.abs(extra), .7) * 1.6;
  render();
});
const end = () => {
  if (!drag) return;
  drag = null;
  const tick = () => {
    ov += (-500 * over - 20 * ov) / 60;
    over += ov / 60;
    render();
    if (Math.abs(over) > .2 || Math.abs(ov) > .2) requestAnimationFrame(tick); else { over = 0; ov = 0; render(); }
  };
  requestAnimationFrame(tick);
};
el.addEventListener('pointerup', end);
el.addEventListener('pointercancel', end);
el.addEventListener('keydown', (e) => {
  const d = { ArrowRight: .05, ArrowUp: .05, ArrowLeft: -.05, ArrowDown: -.05 }[e.key];
  if (d === undefined) return;
  e.preventDefault();
  v = Math.max(0, Math.min(1, v + d));
  render();
});
render();
</script>
</body>
</html>
