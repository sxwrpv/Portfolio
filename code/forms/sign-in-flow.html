<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Sign-in flow: conditional field, code card, user menu, character counter</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; --ok: #3ddc84; --err: #ff5a5a; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; align-items: start; padding: 40px 24px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
section { display: grid; gap: 12px; justify-items: center; }
h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
input, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); font: inherit; outline: none; }
input:focus, textarea:focus { border-color: var(--accent); }
.primary { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #111; font: 700 15px/1 system-ui, sans-serif; cursor: pointer; }
.link { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; }
</style>
<style id="effect">
.stack { position: relative; width: 340px; display: grid; }
.card { grid-area: 1 / 1; display: grid; gap: 12px; padding: 22px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); transition: transform .5s cubic-bezier(.2, 1, .3, 1), opacity .35s, filter .35s; }
.card h3 { font-size: 19px; }
.card p { color: var(--muted); font-size: 14px; }
.card--back { transform: translateY(-14px) scale(.94); filter: brightness(.6); pointer-events: none; }
.card.is-enter { animation: card-up .55s cubic-bezier(.2, 1, .3, 1) both; }
.card.is-leave { animation: card-down .35s ease-in both; }
@keyframes card-up { from { transform: translateY(60px) scale(.96); opacity: 0; } }
@keyframes card-down { to { transform: translateY(60px) scale(.96); opacity: 0; } }
.cond { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .45s cubic-bezier(.2, 1, .3, 1), opacity .3s; }
.cond > div { overflow: hidden; }
.cond.is-shown { grid-template-rows: 1fr; opacity: 1; }
.otp { display: flex; gap: 8px; }
.otp input { width: 46px; height: 54px; padding: 0; text-align: center; font: 700 22px/1 system-ui, sans-serif; }
.user { position: relative; width: 240px; }
.user__btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
.user__avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #ffb36b, #a8324a); }
.user__menu { position: absolute; left: 0; right: 0; top: 0; z-index: 3; padding: 8px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); clip-path: inset(0 0 calc(100% - 52px) 0 round 14px); opacity: 0; pointer-events: none; transition: clip-path .45s cubic-bezier(.2, 1, .3, 1), opacity .15s .3s; }
.user.is-open .user__menu { clip-path: inset(0 0 0 0 round 14px); opacity: 1; pointer-events: auto; transition: clip-path .45s cubic-bezier(.2, 1, .3, 1), opacity 0s; }
.user__menu a { display: block; padding: 9px 10px; border-radius: 8px; color: var(--text); text-decoration: none; }
.user__menu a:hover { background: var(--line); }
.user__head { display: flex; gap: 10px; align-items: center; padding: 0 0 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.counter { width: 340px; display: grid; gap: 8px; }
.counter__row { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.counter__ring { width: 26px; height: 26px; transform: rotate(-90deg); }
.counter__ring circle { fill: none; stroke-width: 3; }
.counter__ring .bg { stroke: var(--line); }
.counter__ring .fg { stroke: var(--accent); stroke-dasharray: 1; stroke-dashoffset: calc(1 - var(--p, 0)); transition: stroke-dashoffset .3s, stroke .2s; }
.counter.is-warn .fg { stroke: #ffd23f; }
.counter.is-over .fg { stroke: var(--err); }
.counter__left { min-width: 28px; text-align: right; font: 700 14px/1 ui-monospace, Menlo, monospace; color: var(--muted); transition: transform .4s cubic-bezier(.2, 1.8, .3, 1), color .2s; }
.counter.is-over .counter__left { color: var(--err); transform: scale(1.25); }
@media (prefers-reduced-motion: reduce) { .card, .cond, .user__menu, .counter__left { transition: none; } .card.is-enter, .card.is-leave { animation: none; } }
</style>
</head>
<body>
<section>
  <h2>Sign in · conditional field + code card</h2>
  <div class="stack" data-stack>
    <form class="card" data-signin>
      <h3>Sign in</h3>
      <p>Type an email that contains "pass" to reveal a password field.</p>
      <input type="email" placeholder="you@example.com" autocomplete="email" required data-email aria-label="Email">
      <div class="cond" data-cond><div><input type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" tabindex="-1"></div></div>
      <button class="primary" type="submit">Continue</button>
    </form>
  </div>
</section>
<section>
  <h2>User button → account menu</h2>
  <div class="user" data-user>
    <button class="user__btn" type="button" aria-expanded="false" data-user-btn><span class="user__avatar"></span>Alex Doe</button>
    <div class="user__menu" role="menu">
      <div class="user__head"><span class="user__avatar"></span><div><b>Alex Doe</b><br><small style="color:var(--muted)">alex@example.com</small></div></div>
      <a href="#" role="menuitem">Manage account</a><a href="#" role="menuitem">Billing</a><a href="#" role="menuitem">Sign out</a>
    </div>
  </div>
</section>
<section>
  <h2>Characters remaining</h2>
  <div class="counter" data-counter>
    <textarea rows="3" maxlength="200" placeholder="Describe what needs moving…" aria-describedby="left" data-text></textarea>
    <div class="counter__row"><svg class="counter__ring" viewBox="0 0 26 26" aria-hidden="true"><circle class="bg" cx="13" cy="13" r="10" pathLength="1"/><circle class="fg" cx="13" cy="13" r="10" pathLength="1"/></svg><span class="counter__left" id="left" data-left aria-live="polite"></span></div>
  </div>
</section>
<script>
const email = document.querySelector('[data-email]');
const cond = document.querySelector('[data-cond]');
email.addEventListener('input', () => {
  const show = email.value.includes('pass');
  cond.classList.toggle('is-shown', show);
  cond.querySelector('input').tabIndex = show ? 0 : -1;
});
const stack = document.querySelector('[data-stack]');
const signin = document.querySelector('[data-signin]');
signin.addEventListener('submit', (e) => {
  e.preventDefault();
  signin.classList.add('card--back');
  const otp = document.createElement('form');
  otp.className = 'card is-enter';
  otp.innerHTML = `<h3>Check your email</h3><p>We sent a 4-digit code to ${email.value.replace(/[<>&]/g, '')}</p><div class="otp">${'<input inputmode="numeric" maxlength="1" aria-label="Digit">'.repeat(4)}</div><button class="link" type="button" data-back>Use a different email</button>`;
  stack.append(otp);
  const boxes = [...otp.querySelectorAll('.otp input')];
  boxes[0].focus();
  boxes.forEach((b, i) => b.addEventListener('input', () => { if (b.value && boxes[i + 1]) boxes[i + 1].focus(); }));
  otp.querySelector('[data-back]').addEventListener('click', () => {
    otp.classList.remove('is-enter');
    otp.classList.add('is-leave');
    signin.classList.remove('card--back');
    setTimeout(() => otp.remove(), 350);
    email.focus();
  });
});
const user = document.querySelector('[data-user]');
const ubtn = document.querySelector('[data-user-btn]');
const setUser = (open) => { user.classList.toggle('is-open', open); ubtn.setAttribute('aria-expanded', String(open)); };
ubtn.addEventListener('click', () => setUser(true));
document.addEventListener('pointerdown', (e) => { if (!user.contains(e.target)) setUser(false); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') setUser(false); });
const counter = document.querySelector('[data-counter]');
const text = counter.querySelector('[data-text]');
const left = counter.querySelector('[data-left]');
const MAX = 120;
text.removeAttribute('maxlength');
const update = () => {
  const n = text.value.length;
  counter.style.setProperty('--p', Math.min(1, n / MAX));
  counter.classList.toggle('is-warn', n >= MAX * .8 && n <= MAX);
  counter.classList.toggle('is-over', n > MAX);
  left.textContent = MAX - n <= 20 ? MAX - n : '';
};
text.addEventListener('input', update);
update();
</script>
</body>
</html>
