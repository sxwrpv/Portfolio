<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Watch-style honeycomb grid</title>
<style id="page">
:root { color-scheme: dark; --bg: #000; --text: #f4f4f5; --muted: #a1a1aa; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; background: #0e0e10; color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
small { color: var(--muted); }
</style>
<style id="effect">
.watch { position: relative; width: 320px; height: 380px; border-radius: 64px; background: var(--bg); overflow: hidden; touch-action: none; cursor: grab; border: 10px solid #222; }
.watch:active { cursor: grabbing; }
.watch__app { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; will-change: transform; }
</style>
</head>
<body>
<div class="watch" data-watch aria-label="App grid" role="img"></div>
<small>Drag around · icons shrink towards the edges</small>
<script>
const watch = document.querySelector('[data-watch]');
const R = 5, GAP = 62;
const apps = [];
for (let q = -R; q <= R; q++) for (let r = Math.max(-R, -q - R); r <= Math.min(R, -q + R); r++) {
  const el = document.createElement('i');
  el.className = 'watch__app';
  el.style.background = `radial-gradient(circle at 35% 30%, hsl(${(q * 40 + r * 70 + 720) % 360} 85% 70%), hsl(${(q * 40 + r * 70 + 760) % 360} 75% 40%))`;
  watch.append(el);
  apps.push({ el, x: GAP * (q + r / 2), y: GAP * (r * Math.sqrt(3) / 2) });
}
let ox = 0, oy = 0, vx = 0, vy = 0, drag = null;
watch.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, ox, oy, t: performance.now(), lx: e.clientX, ly: e.clientY }; watch.setPointerCapture(e.pointerId); vx = vy = 0; });
watch.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const now = performance.now(), dt = Math.max(1, now - drag.t);
  vx = (e.clientX - drag.lx) / dt * 16; vy = (e.clientY - drag.ly) / dt * 16;
  drag.lx = e.clientX; drag.ly = e.clientY; drag.t = now;
  ox = drag.ox + e.clientX - drag.x; oy = drag.oy + e.clientY - drag.y;
});
const end = () => { drag = null; };
watch.addEventListener('pointerup', end);
watch.addEventListener('pointercancel', end);
const W = 150, H = 180;
let last = performance.now();
const frame = (now) => {
  const f = Math.min(3, Math.max(0, (now - last) / 16.667));
  last = now;
  if (!drag) {
    ox += vx * f; oy += vy * f;
    const damp = Math.pow(.92, f), pull = 1 - Math.pow(.85, f);
    vx *= damp; vy *= damp;
    const lim = GAP * R * .8;
    if (Math.abs(ox) > lim) ox += (Math.sign(ox) * lim - ox) * pull;
    if (Math.abs(oy) > lim) oy += (Math.sign(oy) * lim - oy) * pull;
  }
  apps.forEach((a) => {
    const x = a.x + ox, y = a.y + oy;
    const ex = Math.max(0, Math.abs(x) - W * .55) / (W * .5), ey = Math.max(0, Math.abs(y) - H * .55) / (H * .5);
    const s = Math.max(0, 1 - Math.hypot(ex, ey));
    const pull = 1 - s;
    a.el.style.transform = `translate(${x - Math.sign(x) * pull * 18}px, ${y - Math.sign(y) * pull * 18}px) scale(${s})`;
  });
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
