<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Coverflow and offset-linked carousel</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; gap: 22px; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; overflow-x: hidden; }
.tabs { display: flex; gap: 8px; justify-content: center; }
.tabs button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
</style>
<style id="effect">
.flow { position: relative; width: 100vw; height: 360px; perspective: 1100px; overflow: hidden; touch-action: pan-y; cursor: grab; }
.flow.is-dragging { cursor: grabbing; }
.flow__item { position: absolute; left: 50%; top: 20px; width: 240px; height: 320px; margin-left: -120px; border-radius: 16px; overflow: hidden; transform-style: preserve-3d; will-change: transform; -webkit-user-select: none; user-select: none; box-shadow: 0 30px 60px rgba(0, 0, 0, .45); }
.flow__img { position: absolute; inset: 0 -30%; display: grid; place-items: center; font: 900 64px/1 system-ui, sans-serif; color: rgba(255, 255, 255, .9); }
.flow__label { position: absolute; left: 14px; bottom: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, .4); }
</style>
</head>
<body>
<div class="tabs" role="group" aria-label="Style">
  <button type="button" data-mode="coverflow" aria-pressed="true">Coverflow</button>
  <button type="button" data-mode="scale" aria-pressed="false">Offset scale</button>
  <button type="button" data-mode="parallax" aria-pressed="false">Parallax</button>
</div>
<div class="flow" data-flow tabindex="0" aria-roledescription="carousel" aria-label="Albums"></div>
<script>
const flow = document.querySelector('[data-flow]');
const N = 11;
const items = Array.from({ length: N }, (_, i) => {
  const h = (i * 33 + 300) % 360;
  const el = document.createElement('div');
  el.className = 'flow__item';
  el.innerHTML = `<div class="flow__img" style="background: radial-gradient(70% 70% at 40% 30%, hsl(${h} 90% 66%), hsl(${(h + 40) % 360} 70% 24%))">${i + 1}</div><span class="flow__label">Item ${i + 1}</span>`;
  flow.append(el);
  return el;
});
let mode = 'coverflow';
let pos = 5, target = 5, vel = 0;
const SPACING = { coverflow: 150, scale: 260, parallax: 260 };
const render = () => {
  items.forEach((el, i) => {
    const o = i - pos;
    const a = Math.abs(o);
    const img = el.firstElementChild;
    if (mode === 'coverflow') {
      const side = Math.max(-1, Math.min(1, o));
      el.style.transform = `translateX(${o * SPACING.coverflow + side * 60}px) translateZ(${-a * 90 - (a > .01 ? 80 : 0) * Math.min(1, a)}px) rotateY(${-side * 55}deg)`;
      el.style.zIndex = 100 - Math.round(a * 10);
      el.style.opacity = a > 4.5 ? 0 : 1;
      img.style.transform = 'none';
    } else if (mode === 'scale') {
      el.style.transform = `translateX(${o * SPACING.scale}px) scale(${Math.max(.6, 1 - a * .18)})`;
      el.style.zIndex = 100 - Math.round(a * 10);
      el.style.opacity = Math.max(.25, 1 - a * .3);
      img.style.transform = 'none';
    } else {
      el.style.transform = `translateX(${o * SPACING.parallax}px)`;
      el.style.zIndex = 1;
      el.style.opacity = 1;
      img.style.transform = `translateX(${-o * 60}px)`;
    }
  });
};
const tick = () => {
  if (!drag) {
    const f = -120 * (pos - target) - 20 * vel;
    vel += f / 60;
    pos += vel / 60;
  }
  render();
  requestAnimationFrame(tick);
};
let drag = null;
flow.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, start: pos, v: 0, last: e.clientX, t: performance.now() }; flow.setPointerCapture(e.pointerId); flow.classList.add('is-dragging'); });
flow.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const now = performance.now();
  drag.v = drag.v * .5 + ((e.clientX - drag.last) / Math.max(1, now - drag.t)) * .5;
  drag.last = e.clientX;
  drag.t = now;
  pos = Math.max(-.4, Math.min(N - .6, drag.start - (e.clientX - drag.x) / SPACING[mode]));
});
const end = () => {
  if (!drag) return;
  const v = performance.now() - drag.t > 80 ? 0 : drag.v;
  drag = null;
  flow.classList.remove('is-dragging');
  target = Math.max(0, Math.min(N - 1, Math.round(pos - v * 2.2)));
  vel = 0;
};
flow.addEventListener('pointerup', end);
flow.addEventListener('pointercancel', end);
flow.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') target = Math.min(N - 1, Math.round(target) + 1);
  if (e.key === 'ArrowLeft') target = Math.max(0, Math.round(target) - 1);
});
items.forEach((el, i) => el.addEventListener('click', () => { if (Math.abs(pos - target) < .05) target = i; }));
document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));
requestAnimationFrame(tick);
</script>
</body>
</html>
