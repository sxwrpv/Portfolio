<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Sankey chart</title>
<style id="page">
:root {
  color-scheme: dark;
  --bg: #070708; --panel: #0f0f11; --line: rgba(255, 255, 255, .08); --grid: rgba(255, 255, 255, .07);
  --text: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
  --c1: #f4f4f5; --c2: #a1a1aa; --c3: #71717a; --c4: #52525b; --c5: #3f3f46;
  --s0: #1c1c1f; --s1: #3f3f46; --s2: #52525b; --s3: #71717a; --s4: #a1a1aa; --s5: #f4f4f5;
  --up: #22c55e; --down: #ef4444;
  --ease: cubic-bezier(.85, 0, .15, 1); --out: cubic-bezier(.16, 1, .3, 1);
}
[data-theme="lagoon"] { --c1: #67e8f9; --c2: #22d3ee; --c3: #06b6d4; --c4: #0891b2; --c5: #0e7490; --s1: #083344; --s2: #155e75; --s3: #0891b2; --s4: #22d3ee; --s5: #67e8f9; }
[data-theme="warm"] { --c1: #fcd34d; --c2: #fbbf24; --c3: #f59e0b; --c4: #d97706; --c5: #b45309; --s1: #451a03; --s2: #92400e; --s3: #d97706; --s4: #fbbf24; --s5: #fcd34d; }
[data-theme="forest"] { --c1: #5eead4; --c2: #2dd4bf; --c3: #14b8a6; --c4: #0d9488; --c5: #0f766e; --s1: #042f2e; --s2: #115e59; --s3: #0d9488; --s4: #2dd4bf; --s5: #5eead4; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.card { width: min(92vw, 880px); padding: 22px 22px 18px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
.head h1 { font: 650 15px/1.3 system-ui, sans-serif; letter-spacing: -.01em; }
.head p { margin-top: 4px; color: var(--muted); font-size: 13px; }
.themes { display: flex; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 99px; flex: none; }
.themes button { width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .15); transition: transform .3s var(--out), box-shadow .3s; }
.themes button:hover { transform: scale(1.15); }
.themes button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--text); }
.note { margin-top: 14px; color: var(--dim); font-size: 12px; }
.tip { position: fixed; left: 0; top: 0; z-index: 10; min-width: 120px; padding: 8px 10px; border-radius: 10px; background: rgba(24, 24, 27, .92); border: 1px solid rgba(255, 255, 255, .1); box-shadow: 0 12px 32px rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 12px; pointer-events: none; opacity: 0; transform: translate(var(--tx, 0), var(--ty, 0)) scale(.96); transition: opacity .15s, transform .25s var(--out); font-variant-numeric: tabular-nums; }
.tip.on { opacity: 1; transform: translate(var(--tx, 0), var(--ty, 0)); }
.tip b { display: block; margin-bottom: 4px; font-weight: 600; }
.tip .row { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.tip .row i { width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.tip .row span { margin-left: auto; padding-left: 12px; color: var(--text); font-weight: 600; }
.axis text, .lbl { fill: var(--dim); font: 11px system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-dasharray: 3 4; }
.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; }
.seg button { padding: 5px 10px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: 500 12px system-ui, sans-serif; cursor: pointer; transition: background .2s, color .2s; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .09); color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.legend > * { display: flex; align-items: center; gap: 7px; padding: 0; border: 0; background: none; color: var(--muted); font: 500 12px system-ui, sans-serif; cursor: default; transition: opacity .25s, color .25s; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--k); flex: none; }
.legend .off { opacity: .35; }
@media (max-width: 560px) { .card { padding: 16px 14px 14px; } .head { flex-direction: column; } }
</style>
<style id="effect">
.chart { position: relative; height: 380px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.link { fill-opacity: .32; transition: fill-opacity .3s; cursor: pointer; }
.sankey.hover .link { fill-opacity: .07; }
.sankey.hover .link.on { fill-opacity: .6; }
.node { transform-box: fill-box; transform-origin: center; transform: scaleY(0); transition: transform .8s var(--out), opacity .3s; cursor: pointer; }
.in .node { transform: scaleY(1); }
.sankey.hover .node { opacity: .4; }
.sankey.hover .node.on { opacity: 1; }
.nl { fill: var(--text); font: 600 12px system-ui, sans-serif; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; opacity: 0; transition: opacity .5s .6s; }
.nl tspan { fill: var(--muted); font-weight: 500; }
.in .nl { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .node, .nl { transition: opacity .3s; } }
</style>
</head>
<body>
<main class="card">
  <header class="head"><div><h1>Sankey chart</h1><p>User flow from traffic source to page to outcome. Bands are sized by sessions and blend from one node colour to the next.</p></div><div class="themes" data-themes role="group" aria-label="Colour theme"><button type="button" data-t="mono" style="--sw:#a1a1aa" aria-label="Mono theme" title="Mono"></button><button type="button" data-t="lagoon" style="--sw:#22d3ee" aria-label="Lagoon theme" title="Lagoon"></button><button type="button" data-t="warm" style="--sw:#fbbf24" aria-label="Warm theme" title="Warm"></button><button type="button" data-t="forest" style="--sw:#2dd4bf" aria-label="Forest theme" title="Forest"></button></div></header>
  <div class="chart" data-chart role="img" aria-label="Sankey diagram of sessions from source to outcome"></div>
  <p class="note">Hover a node to trace everything that passes through it, or a band to see a single flow.</p>
</main>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.append(n); return n; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const bezier = (x1, y1, x2, y2) => (t) => {
  if (t <= 0 || t >= 1) return clamp(t, 0, 1);
  let u = t;
  for (let i = 0; i < 8; i++) {
    const x = 3 * (1 - u) ** 2 * u * x1 + 3 * (1 - u) * u * u * x2 + u ** 3 - t;
    const dx = 3 * (1 - u) ** 2 * x1 + 6 * (1 - u) * u * (x2 - x1) + 3 * u * u * (1 - x2);
    if (Math.abs(x) < 1e-5 || !dx) break;
    u = clamp(u - x / dx, 0, 1);
  }
  return 3 * (1 - u) ** 2 * u * y1 + 3 * (1 - u) * u * u * y2 + u ** 3;
};
const easeChart = bezier(.85, 0, .15, 1);
const easeOut = bezier(.16, 1, .3, 1);
const tween = (ms, fn, easing = easeChart, delay = 0) => new Promise((done) => {
  if (reduce || ms <= 0) { fn(1); done(); return; }
  const t0 = performance.now() + delay;
  const step = (now) => {
    const t = clamp((now - t0) / ms, 0, 1);
    fn(easing(t));
    if (t < 1) requestAnimationFrame(step); else done();
  };
  requestAnimationFrame(step);
});
const fmt = (v, o) => new Intl.NumberFormat('en-US', o).format(v);
const compact = (v) => fmt(v, { notation: 'compact', maximumFractionDigits: 1 });
const rng = (seed) => () => { seed |= 0; seed = seed + 0x6d2b79f5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const whenVisible = (node, fn) => new IntersectionObserver(([e], o) => { if (e.isIntersecting) { o.disconnect(); fn(); } }, { threshold: .25 }).observe(node);
const hoverable = (node, on, off) => {
  if (!/^(BUTTON|A|INPUT)$/.test(node.tagName)) node.tabIndex = 0;
  node.addEventListener('pointerenter', on); node.addEventListener('pointerleave', off);
  node.addEventListener('focus', on); node.addEventListener('blur', off);
};
const onResize = (node, fn) => { let w = node.clientWidth; new ResizeObserver(() => { if (node.clientWidth !== w) { w = node.clientWidth; fn(); } }).observe(node); };
(() => {
  const box = document.querySelector('[data-themes]');
  const set = (t) => {
    document.documentElement.dataset.theme = t;
    box.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    try { localStorage.setItem('mk-chart-theme', t); } catch (e) {}
  };
  let saved = 'mono';
  try { saved = localStorage.getItem('mk-chart-theme') || 'mono'; } catch (e) {}
  box.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) set(b.dataset.t); });
  set(saved);
})();

const tip = (() => {
  const node = Object.assign(document.createElement('div'), { className: 'tip' });
  node.setAttribute('aria-hidden', 'true');
  document.body.append(node);
  let html = '';
  return {
    show(x, y, content) {
      if (content !== html) { node.innerHTML = content; html = content; }
      const r = node.getBoundingClientRect();
      const tx = x + 16 + r.width > innerWidth - 8 ? x - 16 - r.width : x + 16;
      const ty = clamp(y - r.height / 2, 8, innerHeight - r.height - 8);
      node.style.setProperty('--tx', `${tx}px`);
      node.style.setProperty('--ty', `${ty}px`);
      node.classList.add('on');
    },
    hide() { node.classList.remove('on'); },
  };
})();
const row = (color, label, value) => `<div class="row"><i style="--k:${color}"></i>${label}<span>${value}</span></div>`;
const cols = [
  [['Organic', 'var(--c1)'], ['Social', 'var(--c2)'], ['Paid', 'var(--c3)'], ['Direct', 'var(--c4)']],
  [['Blog', 'var(--c2)'], ['Pricing', 'var(--c3)'], ['Product', 'var(--c4)']],
  [['Converted', 'var(--c1)'], ['Bounced', 'var(--c5)']],
];
const flows = [
  ['Organic', 'Blog', 3000], ['Organic', 'Pricing', 1700], ['Organic', 'Product', 1000],
  ['Social', 'Blog', 2000], ['Social', 'Pricing', 900], ['Social', 'Product', 500],
  ['Paid', 'Blog', 1000], ['Paid', 'Pricing', 2800], ['Paid', 'Product', 1500],
  ['Direct', 'Blog', 1000], ['Direct', 'Pricing', 1000], ['Direct', 'Product', 900],
  ['Blog', 'Converted', 3600], ['Blog', 'Bounced', 3400],
  ['Pricing', 'Converted', 4600], ['Pricing', 'Bounced', 1800],
  ['Product', 'Converted', 2000], ['Product', 'Bounced', 1900],
];
const nodes = new Map();
cols.forEach((c, ci) => c.forEach(([name, color], ri) => nodes.set(name, { name, color, ci, ri, out: [], in: [] })));
const links = flows.map(([s, t, v], i) => { const l = { i, s: nodes.get(s), t: nodes.get(t), v }; l.s.out.push(l); l.t.in.push(l); return l; });
nodes.forEach((n) => { n.value = Math.max(n.out.reduce((a, l) => a + l.v, 0), n.in.reduce((a, l) => a + l.v, 0)); });
const NODE_W = 12, PAD = 18;
const wrap = document.querySelector('[data-chart]');
const svg = el('svg', {}, wrap);
const defs = el('defs', {}, svg);
const root = el('g', { class: 'sankey' }, svg);
const linkG = el('g', {}, root), nodeG = el('g', {}, root), labelG = el('g', {}, root);
const total = [...nodes.values()].filter((n) => n.ci === 0).reduce((a, n) => a + n.value, 0);

function layout() {
  const W = wrap.clientWidth, H = wrap.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const k = Math.min(...cols.map((c) => (H - PAD * (c.length - 1)) / total));
  nodes.forEach((n) => {
    const col = cols[n.ci], used = total * k + PAD * (col.length - 1);
    const before = col.slice(0, n.ri).reduce((a, [nm]) => a + nodes.get(nm).value * k + PAD, 0);
    n.x = n.ci * (W - NODE_W) / (cols.length - 1);
    n.y = (H - used) / 2 + before;
    n.h = n.value * k;
  });
  // Stack band ends inside each node in the order of the opposite column.
  nodes.forEach((n) => {
    let o = n.y; n.out.sort((a, b) => a.t.ri - b.t.ri).forEach((l) => { l.sy = o; o += l.v * k; });
    let q = n.y; n.in.sort((a, b) => a.s.ri - b.s.ri).forEach((l) => { l.ty = q; q += l.v * k; });
  });
  root.classList.remove('hover'); tip.hide();
  defs.replaceChildren(); linkG.replaceChildren(); nodeG.replaceChildren(); labelG.replaceChildren();
  links.forEach((l) => {
    const g = el('linearGradient', { id: `lg${l.i}`, gradientUnits: 'userSpaceOnUse', x1: l.s.x + NODE_W, x2: l.t.x }, defs);
    el('stop', { offset: 0, 'stop-color': l.s.color }, g); el('stop', { offset: 1, 'stop-color': l.t.color }, g);
    const x0 = l.s.x + NODE_W, x1 = l.t.x, xm = (x0 + x1) / 2, h = l.v * k;
    l.el = el('path', { class: 'link', fill: `url(#lg${l.i})`, d: `M${x0} ${l.sy}C${xm} ${l.sy} ${xm} ${l.ty} ${x1} ${l.ty}L${x1} ${l.ty + h}C${xm} ${l.ty + h} ${xm} ${l.sy + h} ${x0} ${l.sy + h}Z` }, linkG);
    l.el.addEventListener('pointerenter', (e) => focus([l], [l.s, l.t], e, `<b>${l.s.name} → ${l.t.name}</b>${row(l.s.color, 'Sessions', fmt(l.v))}${row('transparent', `Share of ${l.s.name}`, Math.round(l.v / l.s.value * 100) + '%')}`));
    l.el.addEventListener('pointermove', (e) => tip.show(e.clientX, e.clientY, tipHtml));
    l.el.addEventListener('pointerleave', unfocus);
  });
  nodes.forEach((n) => {
    n.el = el('rect', { class: 'node', x: n.x, y: n.y, width: NODE_W, height: Math.max(1, n.h), rx: 3, fill: n.color }, nodeG);
    n.el.style.transitionDelay = `${n.ci * 180}ms`;
    const right = n.ci < cols.length - 1;
    const t = el('text', { class: 'nl', x: right ? n.x + NODE_W + 8 : n.x - 8, y: n.y + n.h / 2 + 4, 'text-anchor': right ? 'start' : 'end' }, labelG);
    t.innerHTML = `${n.name} <tspan>${compact(n.value)}</tspan>`;
    n.el.addEventListener('pointerenter', (e) => focus([...n.in, ...n.out], [n, ...n.in.map((l) => l.s), ...n.out.map((l) => l.t)], e, `<b>${n.name}</b>${row(n.color, 'Sessions', fmt(n.value))}${row('transparent', 'Of all traffic', Math.round(n.value / total * 100) + '%')}`));
    n.el.addEventListener('pointerleave', unfocus);
  });
}
let tipHtml = '';
function focus(ls, ns, e, html) {
  root.classList.add('hover');
  links.forEach((l) => l.el.classList.toggle('on', ls.includes(l)));
  nodes.forEach((n) => n.el.classList.toggle('on', ns.includes(n)));
  tipHtml = html;
  tip.show(e.clientX, e.clientY, html);
}
function unfocus() { root.classList.remove('hover'); tip.hide(); }

// Bands sweep left to right behind a clip.
const clipRect = el('rect', { x: 0, y: -10, width: 0, height: 4000 }, el('clipPath', { id: 'sweep' }, svg));
linkG.setAttribute('clip-path', 'url(#sweep)');
layout();
onResize(wrap, () => { layout(); clipRect.setAttribute('width', wrap.clientWidth + 10); });
whenVisible(wrap, () => { svg.classList.add('in'); tween(1400, (t) => clipRect.setAttribute('width', (wrap.clientWidth + 10) * t), easeChart, 250); });
</script>
</body>
</html>
