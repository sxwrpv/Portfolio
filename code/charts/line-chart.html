<html lang="en">
<head>

<title>Line chart</title>
<style id="page">
:root {
  color-scheme: dark;
  --bg: #070708; --panel: #0f0f11; --line: rgba(255, 255, 255, .08); --grid: rgba(255, 255, 255, .07);
  --text: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
  --c1: #f4f4f5; --c2: #a1a1aa; --c3: #71717a; --c4: #52525b; --c5: #3f3f46;

}

[data-theme="warm"] { --c1: #fcd34d; --c2: #fbbf24; --c3: #f59e0b; --c4: #d97706; --c5: #b45309; --s1: #451a03; --s2: #92400e; --s3: #d97706; --s4: #fbbf24; --s5: #fcd34d; }
[data-theme="forest"] { --c1: #5eead4; --c2: #2dd4bf; --c3: #14b8a6; --c4: #0d9488; --c5: #0f766e; --s1: #042f2e; --s2: #115e59; --s3: #0d9488; --s4: #2dd4bf; --s5: #5eead4; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.card { width: min(92vw, 880px); padding: 22px 22px 18px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }

</style>
<style id="effect">
:root { --l1: #e3a5f5; --l2: #f4f4f5; --l3: #f5a97f; }
[data-theme="lagoon"], [data-theme="warm"], [data-theme="forest"] { --l1: var(--c1); --l2: #f4f4f5; --l3: var(--c4); }
.legend > button { cursor: pointer; }
.chart { position: relative; height: 280px; touch-action: pan-y; cursor: crosshair; }
.chart svg, .brush svg { display: block; width: 100%; height: 100%; overflow: visible; }
.line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: opacity .35s; }
.line.off { opacity: 0; }
.cross { stroke: var(--muted); stroke-dasharray: 3 3; opacity: 0; transition: opacity .15s; }
.dot { stroke: var(--panel); stroke-width: 2.5; opacity: 0; transition: opacity .15s; }
.chart.hover .cross, .chart.hover .dot:not(.off) { opacity: 1; }
.brush { position: relative; height: 54px; margin-top: 10px; touch-action: none; user-select: none; }
.brush .mini { fill: none; stroke-width: 1.2; opacity: .5; }

<body>
<main class="card">
  <header class="head"><div><h1>Line chart</h1><p>Three smooth series on a dot grid. Drag the brush below to zoom into any stretch of the 60 days.</p></div><div class="themes" data-themes role="group" aria-label="Colour theme"><button type="button" data-t="mono" style="--sw:#a1a1aa" aria-label="Mono theme" title="Mono"></button><button type="button" data-t="lagoon" style="--sw:#22d3ee" aria-label="Lagoon theme" title="Lagoon"></button><button type="button" data-t="warm" style="--sw:#fbbf24" aria-label="Warm theme" title="Warm"></button><button type="button" data-t="forest" style="--sw:#2dd4bf" aria-label="Forest theme" title="Forest"></button></div></header>
  <div class="toolbar"><div class="legend" data-legend></div><span class="lbl" data-span style="font-size:12px"></span></div>
  <div class="chart" data-chart role="img" aria-label="Line chart of desktop, mobile and tablet visitors"></div>
  <div class="brush" data-brush aria-label="Zoom brush"></div>
  <p class="note">Click a legend item to hide a series. Drag the brush window or its handles to zoom.</p>
</main>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const easeChart = bezier(.85, 0, .15, 1);
const easeOut = bezier(.16, 1, .3, 1);
const tween = (ms, fn, easing = easeChart, delay = 0) => new Promise((done) => {

  const step = (now) => {

const fmt = (v, o) => new Intl.NumberFormat('en-US', o).format(v);
const compact = (v) => fmt(v, { notation: 'compact', maximumFractionDigits: 1 });
const rng = (seed) => () => { seed |= 0; seed = seed + 0x6d2b79f5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const hoverable = (node, on, off) => {

  node.addEventListener('pointerenter', on); node.addEventListener('pointerleave', off);
  node.addEventListener('focus', on); node.addEventListener('blur', off);
};
const onResize = (node, fn) => { let w = node.clientWidth; new ResizeObserver(() => { if (node.clientWidth !== w) { w = node.clientWidth; fn(); } }).observe(node); };
(() => {
  const box = document.querySelector('[data-themes]');
  const set = (t) => {
    document.documentElement.dataset.theme = t;
    box.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    try { localStorage.setItem('mk-chart-theme', t); } catch (e) {}
  };

  try { saved = localStorage.getItem('mk-chart-theme') || 'mono'; } catch (e) {}

  set(saved);
})();

const r1 = (v) => Math.round(v * 10) / 10;
const pt = (p) => `${r1(p[0])} ${r1(p[1])}`;
const curves = {
  linear: (p) => p.map((q, i) => (i ? 'L' : 'M') + pt(q)).join(''),
  step: (p) => p.map((q, i) => (i ? `H${r1((p[i - 1][0] + q[0]) / 2)}V${r1(q[1])}H${r1(q[0])}` : 'M' + pt(q))).join(''),
  monotone: (p) => {
    const n = p.length;
    if (n < 3) return curves.linear(p);

    for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1][0] - p[i][0]; m[i] = dx[i] ? (p[i + 1][1] - p[i][1]) / dx[i] : 0; }

    return d;
  },
  catmull: (p) => {
    let d = 'M' + pt(p[0]);
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
      d += `C${pt([b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6])} ${pt([c[0] - (e[0] - b[0]) / 6, c[1] - (e[1] - b[1]) / 6])} ${pt(c)}`;
    }
    return d;
  },
};
const areaPath = (p, curve, base) => curves[curve](p) + `L${r1(p.at(-1)[0])} ${r1(base)}L${r1(p[0][0])} ${r1(base)}Z`;
const linear = (d0, d1, a, b) => { const f = (v) => a + (v - d0) / (d1 - d0 || 1) * (b - a); f.inv = (p) => d0 + (p - a) / (b - a || 1) * (d1 - d0); return f; };
const niceStep = (span, count) => { const raw = span / count, p = 10 ** Math.floor(Math.log10(raw)), e = raw / p; return (e < 1.5 ? 1 : e < 3 ? 2 : e < 7 ? 5 : 10) * p; };
const ticks = (lo, hi, count = 4) => { const s = niceStep(hi - lo, count), out = []; for (let v = Math.ceil(lo / s) * s; v <= hi + s * 1e-6; v += s) out.push(+v.toFixed(8)); return out; };
const niceMax = (v, count = 4) => { const s = niceStep(v, count); return Math.ceil(v / s) * s; };
const xTicks = (n, every) => [...Array(n).keys()].filter((i) => (i % every === 0 && n - 1 - i >= every * .6) || i === n - 1);
const day = (i, o = { month: 'short', day: 'numeric' }) => new Date(Date.UTC(2026, 0, 1 + i)).toLocaleDateString('en-US', { ...o, timeZone: 'UTC' });
const clipReveal = (defs, id) => {
  const rect = el('rect', { x: -6, y: -40, width: 0, height: 4000 }, el('clipPath', { id }, defs));
  let done = false;
  return {
    play: (width) => tween(1100, (t) => rect.setAttribute('width', (width() + 12) * t)).then(() => { done = true; }),
    fit: (w) => { if (done || reduce) rect.setAttribute('width', w + 12); },

};
// Eases a list of numbers toward a target every frame — used for crosshairs.
const follower = (apply, k = .28) => {
  let cur = null, target = null, raf = 0;
  const step = () => {
    if (!cur) { raf = 0; return; }
    let settled = true;
    cur = cur.map((c, i) => { const d = target[i] - c; if (Math.abs(d) > .05) settled = false; return c + d * k; });
    apply(cur);
    raf = settled ? 0 : requestAnimationFrame(step);

  const go = (t) => { target = t; if (!cur || reduce) { cur = t.slice(); apply(cur); return; } if (!raf) raf = requestAnimationFrame(step); };

const tip = (() => {
  const node = Object.assign(document.createElement('div'), { className: 'tip' });
  node.setAttribute('aria-hidden', 'true');
  document.body.append(node);
  let html = '';

    show(x, y, content) {
      if (content !== html) { node.innerHTML = content; html = content; }
      const r = node.getBoundingClientRect();
      const tx = x + 16 + r.width > innerWidth - 8 ? x - 16 - r.width : x + 16;
      const ty = clamp(y - r.height / 2, 8, innerHeight - r.height - 8);
      node.style.setProperty('--tx', `${tx}px`);
      node.style.setProperty('--ty', `${ty}px`);
      node.classList.add('on');
    },
    hide() { node.classList.remove('on'); },
  };
})();
const row = (color, label, value) => `<div class="row"><i style="--k:${color}"></i>${label}<span>${value}</span></div>`;
const rand = rng(12);
const N = 60;
const walk = (base, amp, f) => { let v = base; return Array.from({ length: N }, (_, i) => (v = Math.max(40, v + Math.sin(i / f) * amp + (rand() - .5) * amp * 1.6))); };
const series = [
  { name: 'Desktop', color: 'var(--l1)', data: walk(420, 18, 6) },
  { name: 'Mobile', color: 'var(--l2)', data: walk(360, 16, 9) },
  { name: 'Tablet', color: 'var(--l3)', data: walk(300, 10, 5) },

const M = { t: 10, r: 6, b: 26, l: 6 };
const max = niceMax(Math.max(...series.flatMap((s) => s.data)) * 1.1);
let win = [N - 30, N - 1];
const wrap = document.querySelector('[data-chart]');
const svg = el('svg', {}, wrap);
const defs = el('defs', {}, svg);
const pat = el('pattern', { id: 'dots', width: 14, height: 14, patternUnits: 'userSpaceOnUse' }, defs);
el('circle', { cx: 7, cy: 7, r: .9, fill: 'rgba(255,255,255,.1)' }, pat);

const plot = el('g', { 'clip-path': 'url(#plot)' }, svg);

const dots = series.map((s) => el('circle', { class: 'dot', r: 5, fill: s.color }, svg));
let W = 0, H = 0, x, y;

function layout() {

  document.querySelector('[data-span]').textContent = `${day(Math.round(win[0]))} – ${day(Math.round(win[1]))}`;

// Legend toggles series
const legend = document.querySelector('[data-legend]');
series.forEach((s, k) => {
  const b = Object.assign(document.createElement('button'), { type: 'button', innerHTML: `<i style="--k:${s.color}"></i>${s.name}` });
  b.setAttribute('aria-pressed', 'true');
  b.addEventListener('click', () => {
    if (s.on && series.filter((q) => q.on).length === 1) return;

    b.classList.toggle('off', !s.on); b.setAttribute('aria-pressed', String(s.on));

// Crosshair
const move = follower(([cx, ...ys]) => {

  move([x(i), ...series.map((s) => y(s.data[i]))]);

// Brush: overview lines, shaded outside, draggable window with handles.
const bw = document.querySelector('[data-brush]');
const bs = el('svg', {}, bw);
const minis = series.map((s) => el('path', { class: 'mini', stroke: s.color }, bs));
const shadeL = el('rect', { class: 'shade' }, bs), shadeR = el('rect', { class: 'shade' }, bs);
const winRect = el('rect', { class: 'win', rx: 6 }, bs);

  const w = bw.clientWidth, h = bw.clientHeight;

  const by = linear(0, max, h - 4, 4);

function drawBrush() {
  const w = bw.clientWidth, h = bw.clientHeight, a = bx(win[0]), b = bx(win[1]);
  Object.entries({ x: 0, y: 0, width: a, height: h }).forEach(([k, v]) => shadeL.setAttribute(k, v));
  Object.entries({ x: b, y: 0, width: Math.max(0, w - b), height: h }).forEach(([k, v]) => shadeR.setAttribute(k, v));
  Object.entries({ x: a, y: .5, width: b - a, height: h - 1 }).forEach(([k, v]) => winRect.setAttribute(k, v));
  handles.forEach((hd, k) => { hd.g.setAttribute('transform', `translate(${k ? b : a} 0)`); hd.hit.setAttribute('height', h); hd.bar.setAttribute('y', h / 2 - 10); hd.bar.setAttribute('height', 20); });
}
const MIN_SPAN = 6;
let drag = null;
const at = (e) => bx.inv(e.clientX - bw.getBoundingClientRect().left);
bw.addEventListener('pointerdown', (e) => {
  const v = at(e);
  const near = handles.findIndex((hd, k) => Math.abs(bx(win[k]) - bx(v)) < 12);
  drag = { mode: near >= 0 ? near : v > win[0] && v < win[1] ? 'pan' : 'jump', start: v, from: win.slice() };
  if (drag.mode === 'jump') { const half = (win[1] - win[0]) / 2; drag = { mode: 'pan', start: v, from: [v - half, v + half] }; }
  bw.setPointerCapture(e.pointerId);
  onDrag(e);
});
const onDrag = (e) => {
  if (!drag) return;
  const v = at(e);
  if (drag.mode === 'pan') {
    const span = drag.from[1] - drag.from[0];
    const a = clamp(drag.from[0] + v - drag.start, 0, N - 1 - span);
    win = [a, a + span];
  } else if (drag.mode === 0) win = [clamp(v, 0, win[1] - MIN_SPAN), win[1]];
  else win = [win[0], clamp(v, win[0] + MIN_SPAN, N - 1)];
  draw(); drawBrush(); syncAria();
};
bw.addEventListener('pointermove', onDrag);
bw.addEventListener('pointerup', () => { drag = null; });
bw.addEventListener('pointercancel', () => { drag = null; });
// Keyboard: arrows pan, +/- zoom.
bw.tabIndex = 0;
bw.setAttribute('role', 'slider');
bw.setAttribute('aria-valuemin', 0); bw.setAttribute('aria-valuemax', N - 1);
const syncAria = () => { bw.setAttribute('aria-valuenow', Math.round(win[0])); bw.setAttribute('aria-valuetext', document.querySelector('[data-span]').textContent); };
bw.addEventListener('keydown', (e) => {
  const span = win[1] - win[0];
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const a = clamp(win[0] + (e.key === 'ArrowLeft' ? -1 : 1), 0, N - 1 - span); win = [a, a + span]; }
  else if (e.key === '-' || e.key === '+' || e.key === '=') { const mid = (win[0] + win[1]) / 2, half = clamp(span / 2 + (e.key === '-' ? 2 : -2), MIN_SPAN / 2, (N - 1) / 2); const a = clamp(mid - half, 0, N - 1 - half * 2); win = [a, a + half * 2]; }
  else return;
  e.preventDefault(); draw(); drawBrush(); syncAria();
});

layout(); layoutBrush(); syncAria();
onResize(wrap, () => { layout(); layoutBrush(); });
whenVisible(wrap, () => clip.play(() => W));
</script>
