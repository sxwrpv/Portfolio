  const tk = ticks(lo, hi, 4);
  grid.replaceChildren(...tk.map((v) => el('line', { class: 'gridline', x1: M.l, x2: W - M.r, y1: r1(y(v)), y2: r1(y(v)) })));
  yAxis.replaceChildren(...tk.map((v) => { const t = el('text', { x: W - M.r + 10, y: r1(y(v)) + 4 }); t.textContent = '$' + v; return t; }));
  const marks = [];
  for (let t = Math.ceil((clock - SPAN) / 7500) * 7500; t <= clock; t += 7500) marks.push(t);
  xAxis.replaceChildren(...marks.map((t) => { const n = el('text', { x: r1(x(t)), y: H - 7, 'text-anchor': 'middle', opacity: clamp((x(t) - M.l) / 50, 0, 1) }); n.textContent = time(t); return n; }));
  if (hoverX !== null) scrub(x, y, vis);
  if (!reduce) requestAnimationFrame(frame);
}
function scrub(x, y, vis) {
  const t = x.inv(hoverX);
  const p = vis.reduce((a, b) => (Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a));
  const px = x(p.t), py = y(p.v);
  cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('y1', M.t); cross.setAttribute('y2', H - M.b);
  cdot.setAttribute('cx', px); cdot.setAttribute('cy', py);
  tip.show(wrap.getBoundingClientRect().left + px, wrap.getBoundingClientRect().top + py, `<b>${time(p.t)}</b>${row('var(--c1)', 'Price', '$' + p.v.toFixed(2))}`);
}
function push() {
  syncClock();
  if (paused) return;
  points.push({ t: clock, v: next() });
  if (points.length > 80) points.shift();
  setPrice(value);
  const ch = value - open;
  deltaEl.textContent = `${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(2)} (${Math.abs(ch / open * 100).toFixed(2)}%)`;
  deltaEl.style.color = ch >= 0 ? 'var(--up)' : 'var(--down)';
  if (reduce) frame(performance.now());
}

wrap.addEventListener('pointermove', (e) => { hoverX = e.clientX - wrap.getBoundingClientRect().left; wrap.classList.add('hover'); if (reduce) frame(performance.now()); });
wrap.addEventListener('pointerleave', () => { hoverX = null; wrap.classList.remove('hover'); tip.hide(); });
document.querySelector('[data-toggle]').addEventListener('click', (e) => {
  paused = !paused;
  e.currentTarget.textContent = paused ? 'Resume' : 'Pause';
  document.querySelector('[data-state]').textContent = paused ? 'Paused' : 'Live';
  document.querySelector('.card').classList.toggle('paused', paused);
});

resize();
onResize(wrap, () => { resize(); if (reduce) frame(performance.now()); });
push();
setInterval(push, TICK);
requestAnimationFrame(frame);
</script>
</body>
