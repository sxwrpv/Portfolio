<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Sunburst chart</title>
<style id="page">
:root {
  color-scheme: dark;
  --bg: #070708; --panel: #0f0f11; --line: rgba(255, 255, 255, .08); --grid: rgba(255, 255, 255, .07);
  --text: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
  --c1: #f4f4f5; --c2: #a1a1aa; --c3: #71717a; --c4: #52525b; --c5: #3f3f46;
  --s0: #1c1c1f; --s1: #3f3f46; --s2: #52525b; --s3: #71717a; --s4: #a1a1aa; --s5: #f4f4f5;
  --up: #22c55e; --down: #ef4444;
  --ease: cubic-bezier(.85, 0, .15, 1); --out: cubic-bezier(.16, 1, .3, 1);
}
[data-theme="lagoon"] { --c1: #67e8f9; --c2: #22d3ee; --c3: #06b6d4; --c4: #0891b2; --c5: #0e7490; --s1: #083344; --s2: #155e75; --s3: #0891b2; --s4: #22d3ee; --s5: #67e8f9; }
[data-theme="warm"] { --c1: #fcd34d; --c2: #fbbf24; --c3: #f59e0b; --c4: #d97706; --c5: #b45309; --s1: #451a03; --s2: #92400e; --s3: #d97706; --s4: #fbbf24; --s5: #fcd34d; }
[data-theme="forest"] { --c1: #5eead4; --c2: #2dd4bf; --c3: #14b8a6; --c4: #0d9488; --c5: #0f766e; --s1: #042f2e; --s2: #115e59; --s3: #0d9488; --s4: #2dd4bf; --s5: #5eead4; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.card { width: min(92vw, 880px); padding: 22px 22px 18px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
.head h1 { font: 650 15px/1.3 system-ui, sans-serif; letter-spacing: -.01em; }
.head p { margin-top: 4px; color: var(--muted); font-size: 13px; }
.themes { display: flex; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: 99px; flex: none; }
.themes button { width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; background: var(--sw); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .15); transition: transform .3s var(--out), box-shadow .3s; }
.themes button:hover { transform: scale(1.15); }
.themes button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--text); }
.note { margin-top: 14px; color: var(--dim); font-size: 12px; }
.tip { position: fixed; left: 0; top: 0; z-index: 10; min-width: 120px; padding: 8px 10px; border-radius: 10px; background: rgba(24, 24, 27, .92); border: 1px solid rgba(255, 255, 255, .1); box-shadow: 0 12px 32px rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-size: 12px; pointer-events: none; opacity: 0; transform: translate(var(--tx, 0), var(--ty, 0)) scale(.96); transition: opacity .15s, transform .25s var(--out); font-variant-numeric: tabular-nums; }
.tip.on { opacity: 1; transform: translate(var(--tx, 0), var(--ty, 0)); }
.tip b { display: block; margin-bottom: 4px; font-weight: 600; }
.tip .row { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.tip .row i { width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.tip .row span { margin-left: auto; padding-left: 12px; color: var(--text); font-weight: 600; }
.axis text, .lbl { fill: var(--dim); font: 11px system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-dasharray: 3 4; }
.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; }
.seg button { padding: 5px 10px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: 500 12px system-ui, sans-serif; cursor: pointer; transition: background .2s, color .2s; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .09); color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.legend > * { display: flex; align-items: center; gap: 7px; padding: 0; border: 0; background: none; color: var(--muted); font: 500 12px system-ui, sans-serif; cursor: default; transition: opacity .25s, color .25s; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--k); flex: none; }
.legend .off { opacity: .35; }
@media (max-width: 560px) { .card { padding: 16px 14px 14px; } .head { flex-direction: column; } }
</style>
<style id="effect">
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 24px; color: var(--dim); font-size: 12px; }
.crumbs button { padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: none; color: var(--muted); font: 500 12px system-ui, sans-serif; cursor: pointer; }
.crumbs button:last-child { color: var(--text); border-color: rgba(255, 255, 255, .2); }
.stage { display: grid; place-items: center; }
.stage svg { width: min(100%, 460px); height: auto; overflow: visible; }
.arc { stroke: var(--panel); stroke-width: 1.5; cursor: pointer; transition: opacity .25s, fill-opacity .25s; }
.sun.hover .arc { opacity: .3; }
.sun.hover .arc.on { opacity: 1; }
.al { fill: #09090b; font: 600 10px system-ui, sans-serif; pointer-events: none; transition: opacity .2s; }
.al.light { fill: var(--text); }
.hole { fill: var(--panel); cursor: pointer; }
.hole-t { fill: var(--text); font: 650 15px system-ui, sans-serif; pointer-events: none; }
.hole-s { fill: var(--muted); font: 500 11px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<main class="card">
  <header class="head"><div><h1>Sunburst chart</h1><p>Revenue broken down three levels deep. Click a segment to zoom into it; click the centre to step back out.</p></div><div class="themes" data-themes role="group" aria-label="Colour theme"><button type="button" data-t="mono" style="--sw:#a1a1aa" aria-label="Mono theme" title="Mono"></button><button type="button" data-t="lagoon" style="--sw:#22d3ee" aria-label="Lagoon theme" title="Lagoon"></button><button type="button" data-t="warm" style="--sw:#fbbf24" aria-label="Warm theme" title="Warm"></button><button type="button" data-t="forest" style="--sw:#2dd4bf" aria-label="Forest theme" title="Forest"></button></div></header>
  <div class="crumbs" data-crumbs></div>
  <div class="stage"><svg viewBox="-220 -220 440 440" role="img" aria-label="Sunburst chart of revenue by category" data-svg></svg></div>
  <p class="note">Hover to inspect a segment and its path. The rings re-flow with every zoom.</p>
</main>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.append(n); return n; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const bezier = (x1, y1, x2, y2) => (t) => {
  if (t <= 0 || t >= 1) return clamp(t, 0, 1);
  let u = t;
  for (let i = 0; i < 8; i++) {
    const x = 3 * (1 - u) ** 2 * u * x1 + 3 * (1 - u) * u * u * x2 + u ** 3 - t;
    const dx = 3 * (1 - u) ** 2 * x1 + 6 * (1 - u) * u * (x2 - x1) + 3 * u * u * (1 - x2);
    if (Math.abs(x) < 1e-5 || !dx) break;
    u = clamp(u - x / dx, 0, 1);
  }
  return 3 * (1 - u) ** 2 * u * y1 + 3 * (1 - u) * u * u * y2 + u ** 3;
};
const easeChart = bezier(.85, 0, .15, 1);
const easeOut = bezier(.16, 1, .3, 1);
const tween = (ms, fn, easing = easeChart, delay = 0) => new Promise((done) => {
  if (reduce || ms <= 0) { fn(1); done(); return; }
  const t0 = performance.now() + delay;
  const step = (now) => {
    const t = clamp((now - t0) / ms, 0, 1);
    fn(easing(t));
    if (t < 1) requestAnimationFrame(step); else done();
  };
  requestAnimationFrame(step);
});
const fmt = (v, o) => new Intl.NumberFormat('en-US', o).format(v);
const compact = (v) => fmt(v, { notation: 'compact', maximumFractionDigits: 1 });
const rng = (seed) => () => { seed |= 0; seed = seed + 0x6d2b79f5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const whenVisible = (node, fn) => new IntersectionObserver(([e], o) => { if (e.isIntersecting) { o.disconnect(); fn(); } }, { threshold: .25 }).observe(node);
const hoverable = (node, on, off) => {
  if (!/^(BUTTON|A|INPUT)$/.test(node.tagName)) node.tabIndex = 0;
  node.addEventListener('pointerenter', on); node.addEventListener('pointerleave', off);
  node.addEventListener('focus', on); node.addEventListener('blur', off);
};
const onResize = (node, fn) => { let w = node.clientWidth; new ResizeObserver(() => { if (node.clientWidth !== w) { w = node.clientWidth; fn(); } }).observe(node); };
(() => {
  const box = document.querySelector('[data-themes]');
  const set = (t) => {
    document.documentElement.dataset.theme = t;
    box.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    try { localStorage.setItem('mk-chart-theme', t); } catch (e) {}
  };
  let saved = 'mono';
  try { saved = localStorage.getItem('mk-chart-theme') || 'mono'; } catch (e) {}
  box.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) set(b.dataset.t); });
  set(saved);
})();

const TAU = Math.PI * 2;
// Angles start at 12 o'clock and run clockwise.
const polar = (r, a) => [r * Math.sin(a), -r * Math.cos(a)];
const P = (r, a) => polar(r, a).map((v) => Math.round(v * 100) / 100).join(' ');
const sector = (r0, r1, a0, a1) => {
  a1 = Math.min(a1, a0 + TAU - 1e-4);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  if (a1 - a0 < 1e-4) return '';
  if (r0 <= 0) return `M0 0L${P(r1, a0)}A${r1} ${r1} 0 ${large} 1 ${P(r1, a1)}Z`;
  return `M${P(r1, a0)}A${r1} ${r1} 0 ${large} 1 ${P(r1, a1)}L${P(r0, a1)}A${r0} ${r0} 0 ${large} 0 ${P(r0, a0)}Z`;
};
const arc = (r, a0, a1) => {
  a1 = Math.min(a1, a0 + TAU - 1e-4);
  if (a1 - a0 < 1e-4) return `M${P(r, a0)}`;
  return `M${P(r, a0)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${P(r, a1)}`;
};

const tip = (() => {
  const node = Object.assign(document.createElement('div'), { className: 'tip' });
  node.setAttribute('aria-hidden', 'true');
  document.body.append(node);
  let html = '';
  return {
    show(x, y, content) {
      if (content !== html) { node.innerHTML = content; html = content; }
      const r = node.getBoundingClientRect();
      const tx = x + 16 + r.width > innerWidth - 8 ? x - 16 - r.width : x + 16;
      const ty = clamp(y - r.height / 2, 8, innerHeight - r.height - 8);
      node.style.setProperty('--tx', `${tx}px`);
      node.style.setProperty('--ty', `${ty}px`);
      node.classList.add('on');
    },
    hide() { node.classList.remove('on'); },
  };
})();
const row = (color, label, value) => `<div class="row"><i style="--k:${color}"></i>${label}<span>${value}</span></div>`;
const tree = { name: 'Revenue', children: [
  { name: 'Product', children: [
    { name: 'Enterprise', children: [{ name: 'North America', value: 420 }, { name: 'EMEA', value: 260 }, { name: 'APAC', value: 150 }] },
    { name: 'Pro', children: [{ name: 'Teams', value: 210 }, { name: 'Solo', value: 120 }] },
    { name: 'Starter', value: 140 },
  ] },
  { name: 'Services', children: [
    { name: 'Consulting', children: [{ name: 'Strategy', value: 130 }, { name: 'Implementation', value: 170 }] },
    { name: 'Support', children: [{ name: 'Premium', value: 120 }, { name: 'Standard', value: 80 }] },
  ] },
  { name: 'Partners', children: [
    { name: 'Resellers', children: [{ name: 'Global', value: 110 }, { name: 'Regional', value: 90 }] },
    { name: 'Affiliates', value: 70 },
    { name: 'Referrals', value: 60 },
  ] },
  { name: 'Licensing', value: 140 },
] };
const TONES = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];
const all = [];
const sum = (n) => (n.value = n.children ? n.children.reduce((a, c) => a + sum(c), 0) : n.value);
sum(tree);
// Partition: each node gets an angular span [x0, x1] in 0..1 and a depth.
(function place(n, x0, depth, parent, tone) {
  n.x0 = x0; n.x1 = x0 + n.value / tree.value; n.depth = depth; n.parent = parent; n.tone = tone;
  all.push(n);
  let x = x0;
  (n.children || []).forEach((c, i) => { place(c, x, depth + 1, n, depth === 0 ? TONES[i % TONES.length] : tone); x = c.x1; });
})(tree, 0, 0, null, 'var(--c2)');
const svg = document.querySelector('[data-svg]');
const sun = el('g', { class: 'sun' }, svg);
const R0 = 62, RING = 50;
const arcs = all.filter((n) => n.depth > 0).map((n) => {
  const p = el('path', { class: 'arc', fill: n.tone, 'fill-opacity': [1, .95, .7, .5][n.depth] }, sun);
  const t = el('text', { class: 'al', 'text-anchor': 'middle' }, sun);
  t.textContent = n.name;
  p.addEventListener('pointerenter', (e) => hover(n, e));
  p.addEventListener('pointermove', (e) => hover(n, e));
  p.addEventListener('pointerleave', () => { sun.classList.remove('hover'); tip.hide(); });
  p.addEventListener('click', () => { if (n.children) zoom(n); });
  if (n.children) {
    p.tabIndex = 0;
    p.setAttribute('role', 'button');
    p.setAttribute('aria-label', `Zoom into ${n.name}`);
    p.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zoom(n); } });
  }
  return { n, p, t };
});
const hole = el('circle', { class: 'hole', r: R0 - 3 }, svg);
const holeT = el('text', { class: 'hole-t', 'text-anchor': 'middle', y: 2 }, svg);
const holeS = el('text', { class: 'hole-s', 'text-anchor': 'middle', y: 20 }, svg);
hole.addEventListener('click', () => { if (focusNode.parent) zoom(focusNode.parent); });
let focusNode = tree, view = { x0: 0, x1: 1, d: 0 }, grow = 0;

function draw() {
  const span = view.x1 - view.x0;
  arcs.forEach(({ n, p, t }) => {
    const a0 = clamp((n.x0 - view.x0) / span, 0, 1) * TAU * grow, a1 = clamp((n.x1 - view.x0) / span, 0, 1) * TAU * grow;
    const rd = n.depth - view.d;
    const visible = rd > 0 && rd < 4 && a1 - a0 > .001;
    const r0 = Math.max(0, R0 + (rd - 1) * RING), r1 = Math.max(r0, R0 + rd * RING - 2);
    p.setAttribute('d', visible ? sector(r0, r1, a0, a1) : '');
    if (n.children) p.tabIndex = visible ? 0 : -1;
    const mid = (a0 + a1) / 2, rm = (r0 + r1) / 2;
    const room = (a1 - a0) * rm;
    // Wide arcs carry the label along the arc, narrow ones along the radius; both stay upright.
    const len = t.textContent.length * 5.4;
    const along = room > len + 12, radial = !along && RING - 8 > len && room > 14;
    t.setAttribute('opacity', visible && (along || radial) ? 1 : 0);
    const [lx, ly] = polar(rm, mid);
    const deg = mid * 180 / Math.PI;
    const rot = along ? (mid > Math.PI / 2 && mid < Math.PI * 1.5 ? deg + 180 : deg) : (mid > Math.PI ? deg + 90 : deg - 90);
    t.setAttribute('transform', `translate(${lx.toFixed(1)} ${ly.toFixed(1)}) rotate(${rot.toFixed(1)})`);
    t.setAttribute('dy', 3.5);
    t.classList.toggle('light', !(n.tone === 'var(--c1)' || (n.tone === 'var(--c2)' && n.depth === 1)));
  });
  holeT.textContent = '$' + fmt(focusNode.value) + 'K';
  holeS.textContent = focusNode.parent ? `${focusNode.name} · back` : focusNode.name;
}
function zoom(n) {
  const from = { ...view }, to = { x0: n.x0, x1: n.x1, d: n.depth };
  focusNode = n;
  crumbs();
  tween(800, (t) => { view = { x0: lerp(from.x0, to.x0, t), x1: lerp(from.x1, to.x1, t), d: lerp(from.d, to.d, t) }; draw(); });
}
function hover(n, e) {
  const path = [];
  for (let q = n; q; q = q.parent) path.unshift(q);
  sun.classList.add('hover');
  arcs.forEach((a) => a.p.classList.toggle('on', path.includes(a.n)));
  tip.show(e.clientX, e.clientY, `<b>${path.slice(1).map((q) => q.name).join(' › ')}</b>${row(n.tone, 'Revenue', '$' + fmt(n.value) + 'K')}${row('transparent', 'Of total', (n.value / tree.value * 100).toFixed(1) + '%')}`);
}
function crumbs() {
  const box = document.querySelector('[data-crumbs]');
  const path = [];
  for (let q = focusNode; q; q = q.parent) path.unshift(q);
  box.replaceChildren(...path.flatMap((q, i) => {
    const b = Object.assign(document.createElement('button'), { type: 'button', textContent: q.name });
    b.addEventListener('click', () => zoom(q));
    return i ? [Object.assign(document.createElement('span'), { textContent: '›' }), b] : [b];
  }));
}

crumbs();
draw();
whenVisible(svg, () => tween(1200, (t) => { grow = t; draw(); }));
</script>
</body>
</html>
