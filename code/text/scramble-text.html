<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Scramble text</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 36px; background: var(--bg); color: var(--text); font: 16px/1.5 ui-monospace, Menlo, monospace; }
h1 { font: 700 clamp(32px, 6vw, 64px)/1.1 ui-monospace, Menlo, monospace; }
.links { display: flex; gap: 28px; }
.links a { color: var(--text); text-decoration: none; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; }
.links a:hover { color: var(--accent); }
small { color: var(--muted); font-family: system-ui, sans-serif; }
</style>
<style id="effect">
.scramble__glyph { color: var(--accent); opacity: .85; }
</style>
</head>
<body>
<h1 data-cycle="STAY CURIOUS|BUILD THINGS|DREAM LOUDER|SHIP DAILY" aria-live="polite">STAY CURIOUS</h1>
<nav class="links">
  <a href="#" data-hover>Services</a>
  <a href="#" data-hover="center">Pricing</a>
  <a href="#" data-hover="center">Contact</a>
</nav>
<small>Top: changes every 2.5 s · Links: hover (left one left-to-right, others from the centre)</small>
<script>
const GLYPHS = '!<>-_\\/[]{}—=+*^?#ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function scramble(el, to, { from = el.textContent, order = 'start', speed = 1 } = {}) {
  if (reduce) { el.textContent = to; return Promise.resolve(); }
  cancelAnimationFrame(el._raf);
  const len = Math.max(from.length, to.length);
  const mid = (len - 1) / 2;
  const queue = Array.from({ length: len }, (_, i) => {
    const offset = order === 'center' ? Math.abs(i - mid) * 3 : i * 2;
    const start = Math.floor(offset / speed + Math.random() * 6);
    return { from: from[i] || '', to: to[i] || '', start, end: start + Math.floor(8 + Math.random() * 14), glyph: '' };
  });
  let frame = 0;
  return new Promise((resolve) => {
    const tick = () => {
      let done = 0;
      el.innerHTML = queue.map((q) => {
        if (frame >= q.end) { done++; return q.to; }
        if (frame < q.start) return q.from;
        if (!q.glyph || Math.random() < .3) q.glyph = q.to === ' ' ? ' ' : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        return `<span class="scramble__glyph">${q.glyph.replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c])}</span>`;
      }).join('');
      frame++;
      if (done === queue.length) resolve(); else el._raf = requestAnimationFrame(tick);
    };
    tick();
  });
}
const title = document.querySelector('[data-cycle]');
const words = title.dataset.cycle.split('|');
let w = 0;
setInterval(() => { w = (w + 1) % words.length; scramble(title, words[w]); }, 2500);
document.querySelectorAll('[data-hover]').forEach((a) => {
  const label = a.textContent;
  a.setAttribute('aria-label', label);
  const run = () => scramble(a, label, { from: label, order: a.dataset.hover || 'start', speed: 1.4 });
  a.addEventListener('pointerenter', run);
  a.addEventListener('focus', run);
});
</script>
</body>
</html>
