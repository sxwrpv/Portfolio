<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Rolling text button</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 22px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
small { color: var(--muted); }
</style>
<style id="effect">
.roll {
  --ease: cubic-bezier(.7, 0, .2, 1);
  display: inline-flex; align-items: center; gap: 10px; padding: 16px 30px; border: 0; border-radius: 999px;
  background: var(--accent); color: #111; font: 650 18px/1.1 system-ui, -apple-system, sans-serif; cursor: pointer;
}
.roll--ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 2px currentColor; }
.roll__label { display: inline-flex; overflow: hidden; }
.roll__label > span { position: relative; display: inline-block; white-space: pre; transition: transform .5s var(--ease) calc(var(--d, 0) * 1ms); }
.roll__label > span::after { content: attr(data-c); position: absolute; left: 0; top: 100%; }
.roll:hover .roll__label > span, .roll:focus-visible .roll__label > span { transform: translateY(-100%); }
@media (prefers-reduced-motion: reduce) { .roll__label > span { transition: none; } }
</style>
</head>
<body>
<button class="roll" type="button"><span class="roll__label"><span data-c="Get started">Get started</span></span></button>
<button class="roll" type="button" aria-label="Leave a note"><span class="roll__label" data-roll="stagger" aria-hidden="true">Leave a note</span></button>
<button class="roll roll--ghost" type="button" aria-label="Say hello"><span class="roll__label" data-roll="center" aria-hidden="true">Say hello</span></button>
<small>Hover or focus each button</small>
<script>
document.querySelectorAll('[data-roll]').forEach((label) => {
  const chars = [...label.textContent];
  const mid = (chars.length - 1) / 2;
  label.textContent = '';
  chars.forEach((c, i) => {
    const s = document.createElement('span');
    s.textContent = c;
    s.dataset.c = c;
    s.style.setProperty('--d', label.dataset.roll === 'center' ? Math.abs(i - mid) * 28 : i * 22);
    label.append(s);
  });
});
</script>
</body>
</html>
