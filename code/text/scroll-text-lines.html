<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Scroll text lines</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; overflow-x: hidden; }
.spacer { height: 80vh; display: grid; place-items: center; color: var(--muted); }
</style>
<style id="effect">
.lines { display: grid; gap: .1em; padding: 6vh 0; font: 900 clamp(48px, 10vw, 140px)/1 system-ui, -apple-system, sans-serif; letter-spacing: -.03em; text-transform: uppercase; }
.lines__row { display: flex; width: max-content; white-space: nowrap; will-change: transform; }
.lines__row span { padding-right: .4em; }
.lines__row:nth-child(2) { color: transparent; -webkit-text-stroke: 2px var(--text); }
.lines__row:nth-child(3) { color: var(--accent); }
</style>
</head>
<body>
<div class="spacer">Scroll</div>
<section class="lines" aria-label="Ideas, sketches, prototypes">
  <div class="lines__row" data-speed="-0.6" aria-hidden="true">Ideas · Sketches · Prototypes ·</div>
  <div class="lines__row" data-speed="0.9" aria-hidden="true">Bold · Playful · Made with care ·</div>
  <div class="lines__row" data-speed="-1.3" aria-hidden="true">A little better every day ·</div>
</section>
<div class="spacer">End</div>
<script>
const rows = [...document.querySelectorAll('.lines__row')].map((row) => {
  const text = row.textContent.trim();
  row.innerHTML = '';
  const unit = document.createElement('span');
  unit.textContent = text;
  row.append(unit);
  const copies = Math.ceil((innerWidth * 2) / unit.offsetWidth) + 1;
  for (let i = 0; i < copies; i++) row.append(unit.cloneNode(true));
  return { row, speed: Number(row.dataset.speed), unit };
});
const update = () => {
  rows.forEach(({ row, speed, unit }) => {
    const w = unit.offsetWidth;
    const x = ((scrollY * speed) % w + w) % w;
    row.style.transform = `translate3d(${-x}px, 0, 0)`;
  });
};
addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
update();
</script>
</body>
</html>
