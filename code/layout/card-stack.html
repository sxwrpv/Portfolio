<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Swipeable card stack</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 22px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; overflow: hidden; }
.row { display: flex; gap: 14px; }
.row button { width: 54px; height: 54px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--text); font-size: 20px; cursor: pointer; }
</style>
<style id="effect">
.cstack { position: relative; width: 300px; height: 400px; }
.cstack__card { position: absolute; inset: 0; border-radius: 22px; display: grid; place-items: end start; padding: 20px; font: 800 30px/1 system-ui, sans-serif; color: #fff; touch-action: none; cursor: grab; box-shadow: 0 20px 50px rgba(0, 0, 0, .45); transform: translateY(calc(var(--d, 0) * 24px)) scale(calc(1 - var(--d, 0) * .04)); transition: transform .45s cubic-bezier(.2, 1, .3, 1); will-change: transform; }
.cstack__card.is-dragging { transition: none; cursor: grabbing; }
.cstack__stamp { position: absolute; top: 22px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 8px; font: 900 22px/1 system-ui, sans-serif; letter-spacing: .06em; opacity: 0; }
.cstack__stamp--yes { left: 20px; color: #3ddc84; transform: rotate(-14deg); }
.cstack__stamp--no { right: 20px; color: #ff5a5a; transform: rotate(14deg); }
</style>
</head>
<body>
<div class="cstack" data-stack aria-live="polite"></div>
<div class="row"><button type="button" data-no aria-label="Skip">✕</button><button type="button" data-reset aria-label="Reset">↺</button><button type="button" data-yes aria-label="Like">♥</button></div>
<script>
const COLORS = [['#ffb36b', '#a8324a'], ['#7ad0ff', '#273c8f'], ['#c9f27a', '#2a6b3a'], ['#e3a8ff', '#4b2a8f'], ['#ffe27a', '#8f5a1a'], ['#7affd8', '#1a6b5a']];
const stack = document.querySelector('[data-stack]');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cards = [];
function deal() {
  stack.innerHTML = '';
  cards = COLORS.map(([a, b], i) => {
    const c = document.createElement('div');
    c.className = 'cstack__card';
    c.style.background = `linear-gradient(160deg, ${a}, ${b})`;
    c.innerHTML = `Card ${i + 1}<span class="cstack__stamp cstack__stamp--yes">LIKE</span><span class="cstack__stamp cstack__stamp--no">NOPE</span>`;
    stack.prepend(c);
    return c;
  });
  layout();
}
const layout = () => cards.forEach((c, i) => { c.style.setProperty('--d', Math.min(i, 3)); c.style.zIndex = 100 - i; c.style.opacity = i > 3 ? 0 : 1; });
function fling(card, dir, vx = 0) {
  cards = cards.filter((c) => c !== card);
  const x = dir * (innerWidth * .8 + 200);
  const rot = dir * 30 + vx * 4;
  card.classList.add('is-dragging');
  card.animate([{ transform: card.style.transform || 'none' }, { transform: `translate(${x}px, ${-60}px) rotate(${rot}deg)`, opacity: 0 }], { duration: reduce ? 0 : 450, easing: 'cubic-bezier(.3, .6, .4, 1)', fill: 'forwards' }).onfinish = () => card.remove();
  layout();
  bind();
}
function bind() {
  const top = cards[0];
  if (!top || top.dataset.bound) return;
  top.dataset.bound = '1';
  const yes = top.querySelector('.cstack__stamp--yes'), no = top.querySelector('.cstack__stamp--no');
  let drag = null;
  top.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, t: performance.now(), lx: e.clientX, v: 0 }; top.setPointerCapture(e.pointerId); top.classList.add('is-dragging'); });
  top.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const now = performance.now();
    drag.v = (e.clientX - drag.lx) / Math.max(1, now - drag.t); drag.lx = e.clientX; drag.t = now;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    top.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 14}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 100));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 100));
  });
  const up = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    const v = performance.now() - drag.t > 80 ? 0 : drag.v;
    drag = null;
    if (Math.abs(dx) > 110 || Math.abs(v) > .6) { fling(top, Math.sign(dx || v), v); return; }
    top.classList.remove('is-dragging');
    top.style.transform = '';
    yes.style.opacity = no.style.opacity = 0;
  };
  top.addEventListener('pointerup', up);
  top.addEventListener('pointercancel', up);
}
document.querySelector('[data-yes]').addEventListener('click', () => cards[0] && fling(cards[0], 1));
document.querySelector('[data-no]').addEventListener('click', () => cards[0] && fling(cards[0], -1));
document.querySelector('[data-reset]').addEventListener('click', () => { deal(); bind(); });
deal();
bind();
</script>
</body>
</html>
