<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Flipping disc wave</title>
<style id="page">
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { overflow: hidden; background: #000; color: #fff; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
canvas[data-gl] { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.dock { position: fixed; left: 16px; bottom: 16px; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; }
.dock button, .dock label { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; background: rgba(10, 10, 12, .5); color: #fff; font: 500 13px/1 system-ui, sans-serif; cursor: pointer; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.dock input[type=file] { display: none; }
.dock input[type=color] { width: 22px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; }
.gl-fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #aaa; }
.embed .dock, .embed .hint { display: none !important; }
.embed canvas[data-gl] { touch-action: pan-y; }
body { background: radial-gradient(120% 90% at 50% 20%, #eefcff, #d3f2f8 60%, #c2e8f1); }
.view { position: fixed; inset: -12vmin -8vmin; perspective: 1200px; perspective-origin: 50% 20%; }
.grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--cols), 1fr); place-items: center; transform: rotateX(24deg) rotateZ(-6deg); transform-style: preserve-3d; }
.d { position: relative; width: 70%; aspect-ratio: 1; transform-style: preserve-3d; animation: wave 5.6s cubic-bezier(.62, 0, .32, 1) infinite; animation-delay: calc((var(--x) * .8 + var(--y)) * -.13s); will-change: transform; }
.d i { position: absolute; inset: 0; border-radius: 50%; }
.d .f { background: radial-gradient(circle at 30% 26%, #a9e8ff, #5f80ff 50%, #3d24d8 92%, #2c169f); transform: translateZ(2.4px); backface-visibility: hidden; }
.d .g { background: radial-gradient(circle at 72% 78%, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0) 58%); transform: translateZ(2.5px); backface-visibility: hidden; opacity: 0; animation: glint 5.6s linear infinite; animation-delay: calc((var(--x) * .8 + var(--y)) * -.13s); }
.d .e1 { background: #2b1aa6; transform: translateZ(.8px); }
.d .e2 { background: #9db3e6; transform: translateZ(-.8px); }
.d .b { background: radial-gradient(circle at 38% 32%, #ffffff, #c4ecf4 70%, #a9dce8); transform: translateZ(-2.4px) rotateY(180deg); backface-visibility: hidden; }
@keyframes wave { 0%, 14% { transform: rotate3d(1, .6, 0, 0deg); } 50%, 64% { transform: rotate3d(1, .6, 0, 180deg); } 100% { transform: rotate3d(1, .6, 0, 360deg); } }
@keyframes glint { 0%, 16% { opacity: 0; } 24% { opacity: .85; } 32%, 66% { opacity: 0; } 74% { opacity: .6; } 82%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .d, .d .g { animation: none; } .d { transform: rotate3d(1, .6, 0, 32deg); } }
</style>
</head>
<body>
<div class="view"><div class="grid" data-grid></div></div>
<script>
const grid = document.querySelector('[data-grid]');
function build() {
  const cols = Math.max(5, Math.round(innerWidth / 118)), rows = Math.ceil((innerHeight * 1.3) / ((innerWidth * 1.2) / cols));
  grid.style.setProperty('--cols', cols);
  grid.innerHTML = '';
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const d = document.createElement('div');
    d.className = 'd';
    d.style.setProperty('--x', x);
    d.style.setProperty('--y', y);
    d.innerHTML = '<i class="b"></i><i class="e2"></i><i class="e1"></i><i class="f"></i><i class="g"></i>';
    grid.append(d);
  }
}
build();
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
</script>
</body>
</html>
