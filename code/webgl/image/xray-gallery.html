function bloom(src, levels = 5, radius = 1) {

function paint(w, h, fn, el) {
  const c = el || document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  const ctx = c.getContext('2d');
  fn(ctx, c.width, c.height);
  return c;
}

function fitFont(ctx, lines, maxW, maxH, { weight = 800, family = 'system-ui, sans-serif', lh = 1, style = '' } = {}) {
  lines = [].concat(lines);
  let s = maxH / (lines.length * lh);
  ctx.font = `${style} ${weight} ${s}px ${family}`;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width));
  if (w > maxW) s *= maxW / w;
  ctx.font = `${style} ${weight} ${s}px ${family}`;
  return s;
}

function glyphAtlas(chars = ' .:-=+*#%@', cell = 48, font = 'Menlo, ui-monospace, monospace') {
  return paint(cell * chars.length, cell, (ctx, w, h) => {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${cell * .82}px ${font}`;
    [...chars].forEach((ch, i) => ctx.fillText(ch, cell * (i + .5), h * .54));

}

function fileSwap(ctl, name, onLoad) {
  const use = (file) => {

    const url = URL.createObjectURL(file);
    if (file.type.startsWith('video/')) {
      const v = Object.assign(document.createElement('video'), { src: url, muted: true, loop: true, playsInline: true, autoplay: true });

      ctl.tex(name, v, { dynamic: true });

  addEventListener('drop', (e) => { e.preventDefault(); use(e.dataTransfer.files[0]); });
}

<script>
const cv = document.querySelector('[data-c]');

  (c, w, h) => { const g = c.createRadialGradient(w * .5, h * .5, 0, w * .5, h * .5, w * .5); g.addColorStop(0, '#fff2b0'); g.addColorStop(.3, '#ff9a2e'); g.addColorStop(.7, '#c92a12'); g.addColorStop(1, '#3a0d06'); c.fillStyle = g; c.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { c.strokeStyle = `rgba(255,220,120,${Math.random() * .4})`; c.beginPath(); const a = Math.random() * 6.28; c.moveTo(w / 2, h / 2); c.lineTo(w / 2 + Math.cos(a) * w, h / 2 + Math.sin(a) * w); c.stroke(); } },
  (c, w, h) => { c.fillStyle = '#1f9ad6'; c.fillRect(0, 0, w, h); c.fillStyle = '#0d1b2a'; c.beginPath(); c.ellipse(w * .5, h * .55, w * .26, h * .34, 0, 0, 6.28); c.fill(); c.fillStyle = '#0a0a0a'; c.fillRect(w * .26, h * .42, w * .48, h * .1); c.fillStyle = '#f28a6b'; c.fillRect(w * .4, h * .75, w * .2, h * .25); },
  (c, w, h) => { c.fillStyle = '#1e2fa8'; c.fillRect(0, 0, w, h); c.fillStyle = '#e9edf5'; for (let i = 0; i < 9; i++) { c.save(); c.translate(w * .5, h * .45); c.rotate(i * .7); c.beginPath(); c.ellipse(0, -h * .17, w * .06, h * .17, 0, 0, 6.28); c.fill(); c.restore(); } c.strokeStyle = '#2c6b2f'; c.lineWidth = w * .03; c.beginPath(); c.moveTo(w * .5, h * .55); c.quadraticCurveTo(w * .45, h * .8, w * .52, h); c.stroke(); },
  (c, w, h) => { c.fillStyle = '#e8f23a'; c.fillRect(0, 0, w, h); c.fillStyle = '#111'; c.beginPath(); c.moveTo(w * .1, h); c.bezierCurveTo(w * .2, h * .3, w * .6, h * .2, w * .9, h * .5); c.lineTo(w * .7, h); c.fill(); },
  (c, w, h) => { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#7fd4e6'); g.addColorStop(.55, '#d9f3f6'); g.addColorStop(.56, '#3b4e5a'); g.addColorStop(1, '#1b252c'); c.fillStyle = g; c.fillRect(0, 0, w, h); c.fillStyle = '#f5f5f5'; c.fillRect(w * .62, h * .2, w * .05, h * .38); },

const labels = ['sun 0.98', 'person 0.91', 'flower 0.87', 'shape 0.76', 'tower 0.83'];

  H = cv.height = innerHeight * dpr;
