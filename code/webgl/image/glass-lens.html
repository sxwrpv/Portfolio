    const ms = now - last;
    const dt = Math.min(.05, Math.max(0, ms / 1000));
    last = now;
    if (!sync) govern(ms, now);
    if (!reduce) time += dt * speed;
    const idle = (now - m.moved) / 1000;
    if (opt.autoMouse && !reduce && idle > 2.5) {
      if (!m.auto) {
        m.ux = m.rx;
        m.uy = m.ry;
        m.auto = true;
      }
      const a = time * .55, w = Math.min(1, (idle - 2.5) / 2.2), e = w * w * (3 - 2 * w);
      const ax = .5 + .32 * Math.sin(a * 1.3) * (opt.autoMouse.x ?? 1), ay = .5 + .26 * Math.sin(a * 2.1 + .6) * (opt.autoMouse.y ?? 1);
      m.rx = m.ux + (ax - m.ux) * e;
      m.ry = m.uy + (ay - m.uy) * e;
    }
    const k = 1 - Math.exp(-dt * (opt.mouseEase ?? 10)), kv = 1 - Math.exp(-dt * 14);
    const vx = dt > 0 ? (m.rx - m.px) / dt : 0, vy = dt > 0 ? (m.ry - m.py) / dt : 0;
    m.vx += (vx - m.vx) * kv;
    m.vy += (vy - m.vy) * kv;
    m.lx = m.px;
    m.ly = m.py;
    m.px = m.rx;
    m.py = m.ry;
    m.x += (m.rx - m.x) * k;
    m.y += (m.ry - m.y) * k;
    m.h += ((m.inside || m.auto ? 1 : 0) - m.h) * (1 - Math.exp(-dt * 7));
    opt.onFrame?.(time, dt, ctl);
    for (const t of Object.values(textures)) if (t.dynamic || t.dirty) upload(t);
    passes.forEach((ps) => {
      if (ps.skip?.(time)) return;
      let iters = ps.iterations || 1;
      if (ps.hz) {
        ps.acc = Math.min(4, (ps.acc ?? 1) + dt * ps.hz * (reduce ? 0 : speed));
        iters = Math.floor(ps.acc);
        ps.acc -= iters;
        if (!iters && frame < 2) iters = 1;
      }
      for (let it = 0; it < iters; it++) {
        const read = ps.feedback ? ps.fbo[ps.cur] : null;
        const write = ps.feedback ? ps.fbo[1 - ps.cur] : ps.fbo[0];
        gl.bindFramebuffer(gl.FRAMEBUFFER, write.fb);
        gl.viewport(0, 0, ps.w, ps.h);
        gl.useProgram(ps.prog.p);
        let unit = 0;
        for (const [name, u] of Object.entries(ps.prog.u)) {
          if (u.type === gl.SAMPLER_2D) {
            const ref = ps.inputs?.[name] ?? name;
            const other = passes.find((p) => p.id === ref);
            const t = name === 'uPrev' ? (read ? read.tex : blank) : other ? other.out : textures[ref]?.ready ? textures[ref].tex : blank;
            gl.activeTexture(gl.TEXTURE0 + unit);
            gl.bindTexture(gl.TEXTURE_2D, t);
            gl.uniform1i(u.loc, unit++);
            continue;
          }
          switch (name) {
            case 'uRes': gl.uniform2f(u.loc, ps.w, ps.h); break;
            case 'uView': gl.uniform2f(u.loc, W, H); break;
            case 'uPx': gl.uniform1f(u.loc, ps.w / cssW); break;
            case 'uTime': gl.uniform1f(u.loc, time); break;
            case 'uDt': gl.uniform1f(u.loc, dt); break;
            case 'uFrame': gl.uniform1i(u.loc, frame); break;
            case 'uMouse': gl.uniform2f(u.loc, m.x, m.y); break;
            case 'uMouseRaw': gl.uniform2f(u.loc, m.rx, m.ry); break;
            case 'uMouseLast': gl.uniform2f(u.loc, m.lx, m.ly); break;
            case 'uVel': gl.uniform2f(u.loc, m.vx, m.vy); break;
            case 'uDown': gl.uniform1f(u.loc, m.down); break;
            case 'uHover': gl.uniform1f(u.loc, m.h); break;
            default: {
              const ref = name.endsWith('Size') && (ps.inputs?.[name.slice(0, -4)] ?? name.slice(0, -4));
              const t = ref && textures[ref];
              const p = ref && passes.find((x) => x.id === ref);
              if (t) gl.uniform2fv(u.loc, t.size || [1, 1]);
              else if (p) gl.uniform2f(u.loc, p.w || W, p.h || H);
              else if (ps.uniforms && name in ps.uniforms) setUniform(u, ps.uniforms[name]);
              else if (name in values) setUniform(u, values[name]);
            }
          }
        }
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (ps.feedback) {
          ps.cur = 1 - ps.cur;
          ps.out = ps.fbo[ps.cur].tex;
        }
      }
    });
    if (!fin.offscreen) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, cw, ch);
      gl.useProgram(present.p);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, fin.out);
      gl.uniform1i(present.u.uSrc.loc, 0);
      gl.uniform2f(present.u.uSrcSize.loc, fin.w, fin.h);
      gl.uniform1i(present.u.uMode.loc, pixelated ? 2 : fin.w < cw * .98 ? 1 : 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    frame++;
    if (embed && frame === 3 && parent !== window) parent.postMessage('mk-ready', '*');
    if (fade) {
      if (fade < 0) fade = now;
      const f = Math.min(1, (now - fade) / 900);
      canvas.style.opacity = f < 1 ? (1 - (1 - f) ** 3).toFixed(3) : '';
      if (f >= 1) fade = 0;
    }
    if (visible && !paused && !(reduce && !opt.alwaysRun && now - m.moved > 1500 && frame > 2)) raf = requestAnimationFrame((t) => draw(t));
  }
  function kick() {
    if (!raf && visible && !paused && !lost && W) {
      last = performance.now();
      g.run = 0;
      raf = requestAnimationFrame((t) => draw(t));
    }
  }
  const ctl = {
    gl, canvas, textures, passes, mouse: m, reduce,
    set(name, v) { values[name] = v; kick(); },
    get(name) { return values[name]; },
    tex,
    time: () => time,
    setTime(t) { time = t; kick(); },
    speed(s) { speed = s; },
    pause() { paused = true; },
    play() { paused = false; kick(); },
    quality: () => q,
    resize: () => resize(),
    kick,

  canvas.addEventListener('webglcontextrestored', () => location.reload());

  try { ro.observe(canvas, { box: 'device-pixel-content-box' }); } catch (e) { ro.observe(canvas); }

}

function bloom(src, levels = 5, radius = 1) {
  const down = `uniform sampler2D uSrc;
uniform vec2 uSrcSize;
uniform float uFirst;
vec3 tap(vec2 uv) { vec3 c = texture(uSrc, uv).rgb; return uFirst > .5 ? c / (1. + max(c.r, max(c.g, c.b)) / 24.) : c; }
void main() {
  vec2 t = 1. / uSrcSize, uv = vUv;
  vec3 a = tap(uv + t * vec2(-2, 2)), b = tap(uv + t * vec2(0, 2)), c = tap(uv + t * vec2(2, 2));
  vec3 d = tap(uv + t * vec2(-2, 0)), e = tap(uv), f = tap(uv + t * vec2(2, 0));
  vec3 g = tap(uv + t * vec2(-2, -2)), h = tap(uv + t * vec2(0, -2)), i = tap(uv + t * vec2(2, -2));
  vec3 j = tap(uv + t * vec2(-1, 1)), k = tap(uv + t * vec2(1, 1)), l = tap(uv + t * vec2(-1, -1)), m = tap(uv + t * vec2(1, -1));
  o = vec4(e * .125 + (a + c + g + i) * .03125 + (b + d + f + h) * .0625 + (j + k + l + m) * .125, 1);
}`;
  const up = `uniform sampler2D uSrc;
uniform sampler2D uAdd;
uniform vec2 uSrcSize;
uniform float uRadius;
void main() {
  vec2 t = uRadius / uSrcSize;
  vec3 s = texture(uSrc, vUv + t * vec2(-1, 1)).rgb + texture(uSrc, vUv + t * vec2(1, 1)).rgb + texture(uSrc, vUv + t * vec2(-1, -1)).rgb + texture(uSrc, vUv + t * vec2(1, -1)).rgb;
  s += 2. * (texture(uSrc, vUv + t * vec2(0, 1)).rgb + texture(uSrc, vUv + t * vec2(0, -1)).rgb + texture(uSrc, vUv + t * vec2(-1, 0)).rgb + texture(uSrc, vUv + t * vec2(1, 0)).rgb);
  o = vec4((s + 4. * texture(uSrc, vUv).rgb) / 16. + texture(uAdd, vUv).rgb, 1);
}`;
  const p = [];
  for (let i = 1; i <= levels; i++) p.push({ id: `uB${i}`, fs: down, size: 2 ** -i, float: true, inputs: { uSrc: i === 1 ? src : `uB${i - 1}` }, uniforms: { uFirst: i === 1 ? 1 : 0 } });
  for (let i = levels - 1; i >= 1; i--) p.push({ id: i === 1 ? 'uBloom' : `uU${i}`, fs: up, size: 2 ** -i, float: true, inputs: { uSrc: i === levels - 1 ? `uB${levels}` : `uU${i + 1}`, uAdd: `uB${i}` }, uniforms: { uRadius: radius } });
  return p;
}

function paint(w, h, fn, el) {
  const c = el || document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  const ctx = c.getContext('2d');
  fn(ctx, c.width, c.height);
  return c;
}

function fitFont(ctx, lines, maxW, maxH, { weight = 800, family = 'system-ui, sans-serif', lh = 1, style = '' } = {}) {
  lines = [].concat(lines);
  let s = maxH / (lines.length * lh);
  ctx.font = `${style} ${weight} ${s}px ${family}`;
  const w = Math.max(...lines.map((l) => ctx.measureText(l).width));
  if (w > maxW) s *= maxW / w;
  ctx.font = `${style} ${weight} ${s}px ${family}`;
  return s;
}

function glyphAtlas(chars = ' .:-=+*#%@', cell = 48, font = 'Menlo, ui-monospace, monospace') {
  return paint(cell * chars.length, cell, (ctx, w, h) => {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${cell * .82}px ${font}`;
    [...chars].forEach((ch, i) => ctx.fillText(ch, cell * (i + .5), h * .54));
  });
}

function fileSwap(ctl, name, onLoad) {
  const use = (file) => {
    if (!file) return;
    const url = URL.createObjectURL(file);
    if (file.type.startsWith('video/')) {
      const v = Object.assign(document.createElement('video'), { src: url, muted: true, loop: true, playsInline: true, autoplay: true });
      v.play().catch(() => {});
      ctl.tex(name, v, { dynamic: true });
      onLoad?.(v);
    } else {
      const img = new Image();
      img.onload = () => { ctl.tex(name, img); onLoad?.(img); };
      img.src = url;
    }
  };
  document.querySelectorAll('input[type=file][data-file]').forEach((i) => i.addEventListener('change', () => use(i.files[0])));
  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('drop', (e) => { e.preventDefault(); use(e.dataTransfer.files[0]); });
}
