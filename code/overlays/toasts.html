<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Toast stack</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #1c1c20; --line: #2c2c31; --text: #f4f4f5; --muted: #a1a1aa; --ok: #3ddc84; --err: #ff5a5a; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; gap: 12px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
.row { display: flex; gap: 8px; }
.row button { padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
</style>
<style id="effect">
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 50; width: min(360px, calc(100vw - 40px)); height: 0; list-style: none; padding: 0; }
.toast {
  --gap: 14px; position: absolute; right: 0; bottom: 0; width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); touch-action: pan-y; cursor: grab;
  transform: translateY(calc(var(--y, 0px) * -1 + var(--dy, 0px))) translateX(var(--dx, 0px)) scale(var(--s, 1)); opacity: var(--o, 1);
  transition: transform .45s cubic-bezier(.2, 1, .3, 1), opacity .3s; z-index: var(--z);
}
.toast.is-dragging { transition: none; }
.toast.is-entering { --dy: 120%; --o: 0; }
.toast.is-leaving { --dx: 110%; --o: 0; }
.toast__icon { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 50%; font-size: 13px; font-weight: 800; color: #111; }
.toast[data-type="ok"] .toast__icon { background: var(--ok); }
.toast[data-type="err"] .toast__icon { background: var(--err); }
.toast b { display: block; font-size: 15px; }
.toast p { color: var(--muted); font-size: 14px; }
.toast__x { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .toast { transition: opacity .2s; } }
</style>
</head>
<body>
<div class="row"><button type="button" data-add="ok">Success toast</button><button type="button" data-add="err">Error toast</button></div>
<ol class="toasts" data-toasts aria-live="polite" aria-label="Notifications"></ol>
<script>
const box = document.querySelector('[data-toasts]');
let toasts = [];
let expanded = false;
const MSG = { ok: ['Saved', 'Your message is on its way.'], err: ['Upload failed', 'The photo is larger than 10 MB.'] };
function layout() {
  let y = 0;
  toasts.forEach((t, i) => {
    const h = t.el.offsetHeight;
    if (expanded) { t.el.style.setProperty('--y', `${y}px`); t.el.style.setProperty('--s', 1); y += h + 10; }
    else { t.el.style.setProperty('--y', `${Math.min(i, 2) * 14}px`); t.el.style.setProperty('--s', 1 - Math.min(i, 2) * .05); }
    t.el.style.setProperty('--o', i > 2 && !expanded ? 0 : 1);
    t.el.style.setProperty('--z', 100 - i);
  });
  box.style.height = expanded ? `${y}px` : `${(toasts[0]?.el.offsetHeight || 0) + 28}px`;
}
function remove(t) {
  if (!toasts.includes(t)) return;
  clearTimeout(t.timer);
  toasts = toasts.filter((x) => x !== t);
  t.el.classList.add('is-leaving');
  setTimeout(() => t.el.remove(), 350);
  layout();
}
function add(type) {
  const el = document.createElement('li');
  el.className = 'toast is-entering';
  el.dataset.type = type;
  el.innerHTML = `<span class="toast__icon" aria-hidden="true">${type === 'ok' ? '✓' : '!'}</span><div><b>${MSG[type][0]}</b><p>${MSG[type][1]}</p></div><button class="toast__x" type="button" aria-label="Dismiss">×</button>`;
  box.prepend(el);
  const t = { el };
  toasts.unshift(t);
  el.querySelector('.toast__x').addEventListener('click', () => remove(t));
  const arm = () => { clearTimeout(t.timer); t.timer = setTimeout(() => remove(t), 5000); };
  arm();
  let drag = null;
  el.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; drag = { x: e.clientX }; el.setPointerCapture(e.pointerId); el.classList.add('is-dragging'); clearTimeout(t.timer); });
  el.addEventListener('pointermove', (e) => { if (drag) el.style.setProperty('--dx', `${Math.max(0, e.clientX - drag.x)}px`); });
  el.addEventListener('pointerup', (e) => {
    if (!drag) return;
    el.classList.remove('is-dragging');
    if (e.clientX - drag.x > 100) remove(t); else { el.style.setProperty('--dx', '0px'); arm(); }
    drag = null;
  });
  layout();
  el.getBoundingClientRect();
  el.classList.remove('is-entering');
}
box.addEventListener('pointerenter', () => { expanded = true; toasts.forEach((t) => clearTimeout(t.timer)); layout(); });
box.addEventListener('pointerleave', () => { expanded = false; toasts.forEach((t) => { t.timer = setTimeout(() => remove(t), 3000); }); layout(); });
document.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => add(b.dataset.add)));
</script>
</body>
</html>
