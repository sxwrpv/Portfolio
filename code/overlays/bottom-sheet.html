<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Bottom sheet</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #1b1b1f; --line: #2c2c31; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
.open { padding: 14px 22px; border: 0; border-radius: 14px; background: var(--accent); color: #111; font: 700 16px/1 system-ui, sans-serif; cursor: pointer; }
</style>
<style id="effect">
.sheet-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, calc(var(--p, 0) * .55)); pointer-events: none; }
.sheet-scrim.is-on { pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; height: 86vh; border-radius: 22px 22px 0 0; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; transform: translateY(var(--ty, 100%)); touch-action: none; box-shadow: 0 -20px 60px rgba(0, 0, 0, .4); }
.sheet__grab { display: grid; place-items: center; height: 28px; cursor: grab; }
.sheet__grab::before { content: ""; width: 42px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet__body { padding: 4px 22px 30px; display: grid; gap: 12px; }
.sheet__body > * { opacity: 0; transform: translateY(14px); }
.sheet.is-open .sheet__body > * { opacity: 1; transform: none; transition: opacity .35s, transform .5s cubic-bezier(.2, 1, .3, 1); transition-delay: calc(80ms + var(--i) * 45ms); }
.sheet h2 { font-size: 22px; }
.sheet p { color: var(--muted); }
.sheet__opt { display: flex; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
</style>
</head>
<body>
<button class="open" type="button" data-open>Start something</button>
<div class="sheet-scrim" data-scrim></div>
<section class="sheet" data-sheet role="dialog" aria-modal="true" aria-label="Start something" tabindex="-1" hidden>
  <div class="sheet__grab" data-grab aria-hidden="true"></div>
  <div class="sheet__body">
    <h2>What do you need?</h2>
    <p>Drag the handle down to close, or up to expand. Snaps to half and full height.</p>
    <div class="sheet__opt"><span>A website</span><span>→</span></div>
    <div class="sheet__opt"><span>A poster</span><span>→</span></div>
    <div class="sheet__opt"><span>A playlist</span><span>→</span></div>
    <div class="sheet__opt"><span>A birthday surprise</span><span>→</span></div>
  </div>
</section>
<script>
const sheet = document.querySelector('[data-sheet]');
const scrim = document.querySelector('[data-scrim]');
const grab = document.querySelector('[data-grab]');
[...sheet.querySelector('.sheet__body').children].forEach((el, i) => el.style.setProperty('--i', i));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let y = 1, vy = 0, target = 1, drag = null, raf = null;
const H = () => sheet.offsetHeight;
const SNAPS = [0, .45, 1];
const render = () => { sheet.style.setProperty('--ty', `${y * 100}%`); scrim.style.setProperty('--p', Math.max(0, 1 - y).toFixed(3)); };
const loop = () => {
  if (!drag) {
    if (reduce) { y = target; vy = 0; }
    else { vy += (-260 * (y - target) - 28 * vy) / 60; y += vy / 60; }
  }
  render();
  if (drag || Math.abs(y - target) > .0005 || Math.abs(vy) > .001) raf = requestAnimationFrame(loop);
  else { raf = null; if (target === 1) { sheet.hidden = true; sheet.classList.remove('is-open'); scrim.classList.remove('is-on'); } }
};
const go = (t) => { target = t; if (!raf) raf = requestAnimationFrame(loop); };
const open = () => { sheet.hidden = false; sheet.classList.add('is-open'); scrim.classList.add('is-on'); y = 1; go(SNAPS[1]); sheet.focus(); };
const close = () => go(1);
document.querySelector('[data-open]').addEventListener('click', open);
scrim.addEventListener('click', close);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheet.hidden) close(); });
grab.addEventListener('pointerdown', (e) => { drag = { y: e.clientY, start: y, t: performance.now(), v: 0, last: e.clientY }; grab.setPointerCapture(e.pointerId); if (!raf) raf = requestAnimationFrame(loop); });
grab.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const now = performance.now();
  drag.v = ((e.clientY - drag.last) / Math.max(1, now - drag.t)) * 1000 / H();
  drag.last = e.clientY; drag.t = now;
  const raw = drag.start + (e.clientY - drag.y) / H();
  y = raw < 0 ? raw * .25 : raw;
});
grab.addEventListener('pointerup', () => {
  if (!drag) return;
  const v = performance.now() - drag.t > 80 ? 0 : drag.v;
  drag = null;
  vy = v;
  if (v > 1.2) { go(1); return; }
  if (v < -1.2) { go(0); return; }
  const projected = y + v * .2;
  go(SNAPS.reduce((a, b) => (Math.abs(b - projected) < Math.abs(a - projected) ? b : a)));
});
</script>
</body>
</html>
