<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Horizontal scroll gallery</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
.spacer { height: 70vh; display: grid; place-items: center; color: var(--muted); }
</style>
<style id="effect">
.hgal { position: relative; }
.hgal__sticky { position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; align-items: center; }
.hgal__track { display: flex; gap: 3vw; padding: 0 6vw; will-change: transform; }
.hgal__card { flex: none; width: min(64vw, 520px); aspect-ratio: 4 / 3; border-radius: 18px; display: grid; place-items: end start; padding: 22px; font: 800 44px/1 system-ui, sans-serif; color: rgba(255, 255, 255, .9); }
.hgal__bar { position: absolute; left: 6vw; right: 6vw; bottom: 8vh; height: 3px; background: rgba(255, 255, 255, .12); border-radius: 3px; overflow: hidden; }
.hgal__bar i { position: absolute; inset: 0; background: var(--accent); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); }
</style>
</head>
<body>
<div class="spacer">Scroll down</div>
<section class="hgal" data-hgal>
  <div class="hgal__sticky">
    <div class="hgal__track" data-track></div>
    <div class="hgal__bar" aria-hidden="true"><i></i></div>
  </div>
</section>
<div class="spacer">End</div>
<script>
const track = document.querySelector('[data-track]');
for (let i = 0; i < 7; i++) {
  const h = (i * 47 + 10) % 360;
  const c = document.createElement('div');
  c.className = 'hgal__card';
  c.style.background = `radial-gradient(120% 90% at 20% 10%, hsl(${h} 80% 62%), hsl(${(h + 40) % 360} 70% 32%))`;
  c.textContent = String(i + 1).padStart(2, '0');
  track.append(c);
}
const section = document.querySelector('[data-hgal]');
const bar = section.querySelector('.hgal__bar');
const layout = () => { section.style.height = `${track.scrollWidth - innerWidth + innerHeight}px`; update(); };
const update = () => {
  const r = section.getBoundingClientRect();
  const max = section.offsetHeight - innerHeight;
  const p = Math.min(1, Math.max(0, -r.top / max));
  track.style.transform = `translate3d(${-p * (track.scrollWidth - innerWidth)}px, 0, 0)`;
  bar.style.setProperty('--p', p);
};
addEventListener('scroll', update, { passive: true });
addEventListener('resize', layout);
layout();
</script>
</body>
</html>
