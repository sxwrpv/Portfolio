<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Scroll image reveal</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --text: #f4f4f5; --muted: #a1a1aa; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
main { display: grid; gap: 24vh; justify-items: center; padding: 70vh 20px; }
.spacer { color: var(--muted); }
</style>
<style id="effect">
.reveal { width: min(86vw, 760px); overflow: hidden; border-radius: 14px; clip-path: inset(0 calc(50% - var(--p, 0) * 50%) round 14px); }
.reveal__img { aspect-ratio: var(--ar, 4 / 3); transform: scale(calc(1.35 - var(--p, 0) * .35)); }
</style>
</head>
<body>
<main>
  <p class="spacer">Scroll down</p>
  <figure class="reveal" data-reveal><div class="reveal__img" style="--ar: 16 / 10; background: radial-gradient(90% 90% at 30% 20%, #ffb36b, #b8432b 55%, #3a1424)"></div></figure>
  <figure class="reveal" data-reveal><div class="reveal__img" style="--ar: 4 / 3; background: radial-gradient(90% 90% at 70% 30%, #8fd3ff, #2a6fb0 50%, #0f1d3a)"></div></figure>
  <figure class="reveal" data-reveal style="width: min(60vw, 420px)"><div class="reveal__img" style="--ar: 3 / 4; background: radial-gradient(90% 90% at 40% 25%, #c9f27a, #3c8f47 55%, #12301d)"></div></figure>
  <p class="spacer">End</p>
</main>
<script>
const items = [...document.querySelectorAll('[data-reveal]')];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const update = () => {
  items.forEach((el) => {
    if (reduce) { el.style.setProperty('--p', 1); return; }
    const r = el.getBoundingClientRect();
    const start = innerHeight;
    const end = innerHeight * .35;
    const p = Math.min(1, Math.max(0, (start - r.top) / (start - end)));
    el.style.setProperty('--p', (1 - Math.pow(1 - p, 3)).toFixed(4));
  });
};
addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
addEventListener('resize', update);
update();
</script>
</body>
</html>
