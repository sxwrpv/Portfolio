", "desc_en": "The footer is fixed behind the page; the page slides away to reveal it as it fades in and rises."}, {"file": "scroll/scroll-highlight.html", "cat": "scroll", "title": "Барабан выбора", "desc": "Список с прилипанием: пункт в центре увеличен и подсвечен, остальные гаснут. Работает с клавиатуры.", "thumb": "_thumbs/scroll_scroll-highlight.jpg", "src": "motion", "title_en": "Scroll highlight", "desc_en": "A snapping list: the centred item grows and lights up, the rest fade. Works with the keyboard."}, {"file": "scroll/scroll-progress.html", "cat": "scroll", "title": "Прогресс прокрутки", "desc": "Точная полоса и полоса с пружиной, кольцо для блока со своей прокруткой, проценты прохождения элемента через экран.", "thumb": "_thumbs/scroll_scroll-progress.jpg", "src": "motion", "title_en": "Scroll-linked progress", "desc_en": "An exact bar and a spring bar, a ring for a scrolling box, and progress of an element through the viewport."}, {"file": "scroll/scroll-triggered.html", "cat": "scroll", "title": "Появление при входе в экран", "desc": "Подъём, масштаб, сдвиг и переворот при входе в экран. Можно один раз или каждый раз; карточки появляются по очереди.", "thumb": "_thumbs/scroll_scroll-triggered.jpg", "src": "motion", "title_en": "Scroll-triggered animations", "desc_en": "Rise, scale, slide and flip when entering the viewport. Once or every time; cards appear in sequence."}, {"file": "scroll/velocity-planes.html", "cat": "scroll", "title": "Карточки гнутся от скорости прокрутки", "desc": "Горизонтальная лента в 3D: чем быстрее прокрутка, тем сильнее изгиб, потом всё выпрямляется пружиной.", "thumb": "_thumbs/scroll_velocity-planes.jpg", "src": "motion", "title_en": "Scroll velocity planes", "desc_en": "A horizontal 3D strip bends harder the faster you scroll, then springs back straight."}, {"file": "scroll/smooth-scroll.html", "cat": "scroll", "title": "Плавная инерционная прокрутка", "desc": "Прокрутка с инерцией, как в Lenis: колесо, тачпад, клавиши, полоса прогресса, параллакс.", "thumb": "_thumbs/scroll_smooth-scroll.jpg", "src": "motion", "title_en": "Smooth scroll", "desc_en": "Inertial scrolling: wheel, trackpad, keys, a progress bar and parallax."}, {"file": "page-transitions/curtains.html", "cat": "page-transitions", "title": "Шторки между страницами", "desc": "10 эффектов: wipe, clip wipe, stagger wipe, blinds, shutter, doors, iris, iris от точки клика, pixels, fade. Закрытие и открытие можно смешивать, шторку можно ограничить одним блоком.", "thumb": "_thumbs/page-transitions_curtains.jpg", "src": "motion", "title_en": "Page transitions", "desc_en": "Ten effects: wipe, clip wipe, stagger wipe, blinds, shutter, doors, iris, iris from the click point, pixels, fade. Mix in and out effects, or limit the curtain to one block."}, {"file": "page-transitions/view-transitions.html", "cat": "page-transitions", "title": "View Transitions API", "desc": "Раскрытие кругом, перестановка списка, переключатель, слайдшоу с направлением, карточка, превращающаяся в полный экран. Встроено в браузер.", "thumb": "_thumbs/page-transitions_view-transitions.jpg", "src": "motion", "title_en": "View Transitions", "desc_en": "Circular reveal, list reorder, a toggle, a directional slideshow, a card that grows to full screen. Built into the browser."}, {"file": "carousel/carousel.html", "cat": "carousel", "title": "Карусель", "desc": "Перетаскивание с инерцией, стрелки, точки с уменьшением по краям, счётчик «3 / 10», автопрокрутка с полосой (пауза при наведении), свободная прокрутка, RTL, ползунок-скраббер.", "thumb": "_thumbs/carousel_carousel.jpg", "src": "motion", "title_en": "Carousel", "desc_en": "Inertial dragging, arrows, dots that shrink at the edges, a \"3 / 10\" counter, autoplay with a bar (pauses on hover), free scroll, RTL, a scrubber."}, {"file": "carousel/carousel-loop.html", "cat": "carousel", "title": "Бесконечная карусель", "desc": "Крутится по кругу без клонов-скачков. Перетаскивание, клавиатура, автопрокрутка с полосой, вертикальный режим.", "thumb": "_thumbs/carousel_carousel-loop.jpg", "src": "motion", "title_en": "Infinite carousel", "desc_en": "Loops endlessly without clone jumps. Dragging, keyboard, autoplay with a bar, vertical mode."}, {"file": "carousel/coverflow.html", "cat": "carousel", "title": "Coverflow и эффекты по смещению", "desc": "Объёмная лента: обложки поворачиваются, уходят вглубь. Ещё два режима: масштаб по удалению от центра и параллакс внутри карточки.", "thumb": "_thumbs/carousel_coverflow.jpg", "src": "motion", "title_en": "Coverflow and offset-linked carousel", "desc_en": "A 3D strip: covers turn and recede. Two more modes: scale by distance from centre and parallax inside the card."}, {"file": "carousel/thumbnails-lightbox.html", "cat": "carousel", "title": "Галерея с миниатюрами и лайтбоксом", "desc": "Большое фото с полосой миниатюр; по клику фото вырастает на весь экран и обратно. Стрелки и Esc работают.", "thumb": "_thumbs/carousel_thumbnails-lightbox.jpg", "src": "motion", "title_en": "Thumbnail gallery with lightbox", "desc_en": "A large photo with a thumbnail strip; click to grow it to full screen and back. Arrows and Esc work."}, {"file": "ticker/ticker.html", "cat": "ticker", "title": "Бегущая строка", "desc": "Варианты: замедление при наведении, перетаскивание с инерцией, скорость от прокрутки страницы, обратное направление, увеличение центрального элемента, вылет за края, вертикальная.", "thumb": "_thumbs/ticker_ticker.jpg", "src": "motion", "title_en": "Ticker", "desc_en": "Variants: slow down on hover, inertial dragging, speed from page scroll, reverse direction, enlarged centre item, overflow past the edges, vertical."}, {"file": "ticker/ticker-hover-text.html", "cat": "ticker", "title": "Бегущий текст в ссылках и курсоре", "desc": "При наведении подпись ссылки заменяется бегущей строкой. Над карточками появляется круглый курсор с бегущей надписью «View».", "thumb": "_thumbs/ticker_ticker-hover-text.jpg", "src": "motion", "title_en": "Ticker hover text and ticker cursor", "desc_en": "On hover a link label turns into a ticker. A round cursor with a running \"View\" label appears over cards."}, {"file": "cursor/cursor-follow.html", "cat": "cursor", "title": "Курсор с пружиной", "desc": "Точка и кольцо догоняют указатель с разной упругостью, второй режим — хвост из нескольких кругов.", "thumb": "_thumbs/cursor_cursor-follow.jpg", "src": "motion", "title_en": "Cursor follow with springs", "desc_en": "A dot and a ring chase the pointer with different springiness; a second mode is a tail of circles."}, {"file": "cursor/magnetic.html", "cat": "cursor", "title": "Магнитный курсор", "desc": "Курсор обволакивает кнопки, как на iPad, а круглые кнопки тянутся к указателю.", "thumb": "_thumbs/cursor_magnetic.jpg", "src": "motion", "title_en": "Magnetic cursor and buttons", "desc_en": "The cursor wraps around buttons like on iPad, and round buttons pull towards the pointer."}, {"file": "cursor/cursor-content.html", "cat": "cursor", "title": "Курсор с подписью", "desc": "Над плитками курсор раздувается и показывает текст («View», «Play»). Над кругом появляется вращающаяся надпись.", "thumb": "_thumbs/cursor_cursor-content.jpg", "src": "motion", "title_en": "Cursor with custom content", "desc_en": "Over tiles the cursor grows and shows text (\"View\", \"Play\"). Over a circle a rotating label appears."}, {"file": "cursor/image-hover.html", "cat": "cursor", "title": "Картинка за курсором", "desc": "При наведении на строку списка за курсором летит картинка, она наклоняется от скорости движения.", "thumb": "_thumbs/cursor_image-hover.jpg", "src": "motion", "title_en": "Image hover follow", "desc_en": "Hover a list row and an image flies after the cursor, tilting with the speed of movement."}, {"file": "cursor/image-trail.html", "cat": "cursor", "title": "Шлейф из картинок", "desc": "За указателем остаются карточки: в обычном режиме они гаснут на месте, во втором их отбрасывает по инерции.", "thumb": "_thumbs/cursor_image-trail.jpg", "src": "motion", "title_en": "Image trail", "desc_en": "Cards are left behind the pointer: in one mode they fade in place, in the other they are thrown by inertia."}, {"file": "cursor/adaptive-caret.html", "cat": "cursor", "title": "Курсор-каретка", "desc": "Над текстом курсор превращается в каретку высотой со строку под ним.", "thumb": "_thumbs/cursor_adaptive-caret.jpg", "src": "motion", "title_en": "Adaptive caret cursor", "desc_en": "Over text the cursor becomes a caret as tall as the line beneath it."}, {"file": "cursor/pointer-grids.html", "cat": "cursor", "title": "Сетки, реагирующие на курсор", "desc": "Пружинящие плитки, «магнитные опилки», поворачивающиеся к курсору, сетка, ловящая даже быстрые взмахи, конический градиент.", "thumb": "_thumbs/cursor_pointer-grids.jpg", "src": "motion", "title_en": "Pointer grids", "desc_en": "Springy tiles, magnetic filings that turn to the cursor, a grid that catches even fast swipes, a conic gradient."}, {"file": "cursor/line-graph.html", "cat": "cursor", "title": "График с подсказкой у курсора", "desc": "Линия прорисовывается, точка и подсказка цепляются к ближайшему значению, число сверху плавно меняется.", "thumb": "_thumbs/cursor_line-graph.jpg", "src": "motion", "title_en": "Line graph with cursor annotation", "desc_en": "The line draws itself, a dot and tooltip snap to the nearest value, the number on top changes smoothly."}, {"file": "buttons/copy-button.html", "cat": "buttons", "title": "Кнопка «Копировать»", "desc": "Иконка с размытием меняется на галочку, которая прорисовывается, подпись «Copy» сменяется на «Copied».", "thumb": "_thumbs/buttons_copy-button.jpg", "src": "motion", "title_en": "Copy button", "desc_en": "The icon blurs into a check mark that draws itself, and \"Copy\" changes to \"Copied\"."}, {"file": "buttons/confetti.html", "cat": "buttons", "title": "Конфетти", "desc": "Пружинящее нажатие и взрыв конфетти с гравитацией, вращением и затуханием.", "thumb": "_thumbs/buttons_confetti.jpg", "src": "motion", "title_en": "Confetti button", "desc_en": "A springy press and a burst of confetti with gravity, spin and fade."}, {"file": "buttons/dots-morph.html", "cat": "buttons", "title": "Точки превращаются в крестик", "desc": "Четыре точки на пружине вытягиваются в крестик.", "thumb": "_thumbs/buttons_dots-morph.jpg", "src": "motion", "title_en": "Dots morph button", "desc_en": "Four dots stretch into a cross on a spring."}, {"file": "buttons/hold-to-confirm.html", "cat": "buttons", "title": "Удерживайте для подтверждения", "desc": "Заполнение при удержании, пружинный откат при раннем отпускании, работает с мышью, тачем и пробелом.", "thumb": "_thumbs/buttons_hold-to-confirm.jpg", "src": "motion", "title_en": "Hold to confirm", "desc_en": "Fills while held, springs back if released early. Works with mouse, touch and the space bar."}, {"file": "buttons/ripple.html", "cat": "buttons", "title": "Волна при нажатии", "desc": "Круг расходится из точки касания, как в Material Design.", "thumb": "_thumbs/buttons_ripple.jpg", "src": "motion", "title_en": "Press ripple", "desc_en": "A circle spreads from the touch point, Material Design style."}, {"file": "buttons/status-badge.html", "cat": "buttons", "title": "Бейдж со статусами", "desc": "Готово → обработка → успех или ошибка. Ширина плавно подстраивается, при ошибке бейдж трясётся.", "thumb": "_thumbs/buttons_status-badge.jpg", "src": "motion", "title_en": "Multi-state badge", "desc_en": "Ready → processing → success or error. Width adapts smoothly, and the badge shakes on error."}, {"file": "buttons/add-to-basket.html", "cat": "buttons", "title": "Добавить в корзину", "desc": "Товар летит в корзину по дуге, корзина подпрыгивает, счётчик растёт.", "thumb": "_thumbs/buttons_add-to-basket.jpg", "src": "motion", "title_en": "Add to basket", "desc_en": "The product flies into the basket along an arc, the basket bounces, the counter grows."}, {"file": "buttons/create-button.html", "cat": "buttons", "title": "Кнопка «Создать» раскрывается в меню", "desc": "Кнопка растёт в панель с сеткой вариантов через clip-path, варианты появляются по очереди.", "thumb": "_thumbs/buttons_create-button.jpg", "src": "motion", "title_en": "Create button expanding into a menu", "desc_en": "The button grows into a panel with a grid of options through clip-path, options appear in sequence."}, {"file": "navigation/floating-action-button.html", "cat": "navigation", "title": "Плавающая кнопка действий", "desc": "Плюс поворачивается в крестик, над ним по очереди на пружине выезжают действия с подписями.", "thumb": "_thumbs/navigation_floating-action-button.jpg", "src": "motion", "title_en": "Floating action button", "desc_en": "The plus turns into a cross, and labelled actions spring out above it one by one."}, {"file": "navigation/command-palette.html", "cat": "navigation", "title": "Командная палитра (⌘K)", "desc": "Пружинное появление, поиск, подсветка, переезжающая между пунктами, управление стрелками.", "thumb": "_thumbs/navigation_command-palette.jpg", "src": "motion", "title_en": "Command palette", "desc_en": "Springy entrance, search, a highlight that glides between items, arrow-key control."}, {"file": "navigation/radial-menu.html", "cat": "navigation", "title": "Радиальное меню", "desc": "Варианты веером разлетаются вокруг кнопки.", "thumb": "_thumbs/navigation_radial-menu.jpg", "src": "motion", "title_en": "Radial menu", "desc_en": "Options fan out around the button."}, {"file": "navigation/context-menu.html", "cat": "navigation", "title": "Контекстное меню", "desc": "Меню по правому клику растёт из точки клика. Подменю с «безопасным треугольником», чтобы не закрывалось при движении по диагонали. Работает с клавиатуры.", "thumb": "_thumbs/navigation_context-menu.jpg", "src": "motion", "title_en": "Context menu with submenu", "desc_en": "A right-click menu grows from the click point. Submenus use a safe triangle so they stay open on diagonal moves. Works with the keyboard."}, {"file": "navigation/mega-menu.html", "cat": "navigation", "title": "Мега-меню", "desc": "Подсветка переезжает между пунктами, панель меняет размер под каждое меню, колонки появляются по очереди.", "thumb": "_thumbs/navigation_mega-menu.jpg", "src": "motion", "title_en": "Mega menu with sliding indicator", "desc_en": "The highlight glides between items, the panel resizes for each menu, columns appear in sequence."}, {"file": "navigation/tabs.html", "cat": "navigation", "title": "Вкладки и переключатели", "desc": "Вкладки с бегущей линией, содержимым по направлению и плавной высотой; таблетка выбора; группа переключателей с blend-mode.", "thumb": "_thumbs/navigation_tabs.jpg", "src": "motion", "title_en": "Tabs, tab select and toggle group", "desc_en": "Tabs with a sliding line, directional content and smooth height; a pill selector; a toggle group with blend mode."}, {"file": "overlays/toasts.html", "cat": "overlays", "title": "Стопка уведомлений (тосты)", "desc": "Тосты складываются стопкой, раскрываются при наведении, смахиваются вбок и закрываются сами.", "thumb": "_thumbs/overlays_toasts.jpg", "src": "motion", "title_en": "Toast stack", "desc_en": "Toasts stack up, expand on hover, swipe away sideways and dismiss themselves."}, {"file": "overlays/notifications.html", "cat": "overlays", "title": "Уведомления: стопка и список", "desc": "Стопка как на iPhone раскрывается по клику. Список плавно раздвигается при добавлении и удалении.", "thumb": "_thumbs/overlays_notifications.jpg", "src": "motion", "title_en": "Notification stack and list", "desc_en": "An iPhone-style stack that expands on click. A list that makes room smoothly as items are added and removed."}, {"file": "overlays/bottom-sheet.html", "cat": "overlays", "title": "Нижняя шторка", "desc": "Тянется за ручку, прилипает к половине и к полной высоте, смахивается вниз, содержимое появляется по очереди.", "thumb": "_thumbs/overlays_bottom-sheet.jpg", "src": "motion", "title_en": "Bottom sheet", "desc_en": "Drag the handle, snap to half and full height, swipe down to close; content appears in sequence."}, {"file": "overlays/modals.html", "cat": "overlays", "title": "Модальные окна", "desc": "Обычный диалог с пружиной; плитка вырастает в окно и возвращается; пошаговое окно с плавной высотой.", "thumb": "_thumbs/overlays_modals.jpg", "src": "motion", "title_en": "Modals", "desc_en": "A plain dialog with a spring; a tile that grows into a window and back; a stepped dialog with smooth height."}, {"file": "overlays/accordion.html", "cat": "overlays", "title": "Аккордеон", "desc": "Плавная высота при открытии и закрытии, плюс превращается в минус, открыт только один пункт.", "thumb": "_thumbs/overlays_accordion.jpg", "src": "motion", "title_en": "Accordion", "desc_en": "Smooth height on open and close, the plus turns into a minus, only one item is open."}, {"file": "overlays/warp-overlay.html", "cat": "overlays", "title": "Страница отодвигается под окном", "desc": "При открытии шторки страница позади наклоняется, уменьшается и темнеет.", "thumb": "_thumbs/overlays_warp-overlay.jpg", "src": "motion", "title_en": "Warp overlay", "desc_en": "When the sheet opens, the page behind tilts, shrinks and darkens."}, {"file": "forms/ui-primitives.html", "cat": "forms", "title": "Анимированные элементы форм", "desc": "Чекбокс с прорисовкой галочки, радиокнопки, переключатель, выпадающий список, подсказка, прогресс, панель инструментов с подсветкой.", "thumb": "_thumbs/forms_ui-primitives.jpg", "src": "motion", "title_en": "Animated UI primitives", "desc_en": "A checkbox with a drawn check, radio buttons, a switch, a dropdown, a tooltip, progress, a toolbar with a highlight."}, {"file": "forms/ios-slider.html", "cat": "forms", "title": "Тянущийся слайдер", "desc": "Слайдер как в iOS: за краем он растягивается и пружинит обратно.", "thumb": "_thumbs/forms_ios-slider.jpg", "src": "motion", "title_en": "Stretchy slider", "desc_en": "An iOS-style slider that stretches past its ends and springs back."}, {"file": "forms/color-picker.html", "cat": "forms", "title": "Круговой выбор цвета", "desc": "Точки по кругу расступаются и растут возле курсора.", "thumb": "_thumbs/forms_color-picker.jpg", "src": "motion", "title_en": "Circular colour picker", "desc_en": "Dots arranged in a circle part and grow near the cursor."}, {"file": "forms/sign-in-flow.html", "cat": "forms", "title": "Вход: поле по условию, код, меню пользователя", "desc": "Поле пароля выезжает только когда нужно; карточка с кодом наезжает поверх; аватар раскрывается в меню; счётчик символов с кольцом.", "thumb": "_thumbs/forms_sign-in-flow.jpg", "src": "motion", "title_en": "Sign-in flow", "desc_en": "The password field slides in only when needed; a code card slides over; the avatar expands into a menu; a character counter with a ring."}, {"file": "forms/exposure-slider.html", "cat": "forms", "title": "Слайдер экспозиции", "desc": "Линейка с делениями как в камере iPhone: перетаскивание, колесо, клавиши, деления у центра выше.", "thumb": "_thumbs/forms_exposure-slider.jpg", "src": "motion", "title_en": "Exposure slider", "desc_en": "A ruler with ticks like the iPhone camera: drag, wheel, keys, taller ticks near the centre."}, {"file": "layout/layout-basics.html", "cat": "layout", "title": "Анимация раскладки (FLIP)", "desc": "Смена расположения, соотношения сторон, перемешивание, общий подчёркивающий элемент, «якорь» детей при изменении размера, три режима появления и исчезновения.", "thumb": "_thumbs/layout_layout-basics.jpg", "src": "motion", "title_en": "Layout animation basics", "desc_en": "Position and aspect changes, shuffling, a shared underline, anchored children during resizes, three enter and exit modes."}, {"file": "layout/expanding-cards.html", "cat": "layout", "title": "Карточки раскрываются в статью, папка приложений", "desc": "Карточка в стиле App Store раскрывается в статью через clip-path. Папка вырастает в панель с иконками.", "thumb": "_thumbs/layout_expanding-cards.jpg", "src": "motion", "title_en": "Expanding cards and app folder", "desc_en": "An App Store style card opens into an article through clip-path. A folder grows into a panel of icons."}, {"file": "layout/card-stack.html", "cat": "layout", "title": "Стопка карточек со свайпом", "desc": "Свайп как в Tinder: поворот, штампы LIKE и NOPE, улёт с инерцией, следующая карточка поднимается.", "thumb": "_thumbs/layout_card-stack.jpg", "src": "motion", "title_en": "Swipeable card stack", "desc_en": "Tinder-style swipes: rotation, LIKE and NOPE stamps, an inertial throw, the next card rises."}, {"file": "layout/reorder.html", "cat": "layout", "title": "Перетаскивание для сортировки", "desc": "Список задач с галочками и зачёркиванием и сетка с перетаскиванием в двух направлениях. Alt + стрелки работают с клавиатуры.", "thumb": "_thumbs/layout_reorder.jpg", "src": "motion", "title_en": "Drag to reorder", "desc_en": "A to-do list with checks and strike-through, and a grid with dragging in two directions. Alt + arrows work from the keyboard."}, {"file": "layout/swipe-actions.html", "cat": "layout", "title": "Свайп-действия в списке", "desc": "Строка смахивается влево и открывает «Архив» и «Удалить». Длинный свайп сразу удаляет строку.", "thumb": "_thumbs/layout_swipe-actions.jpg", "src": "motion", "title_en": "Swipe actions", "desc_en": "Swipe a row left to reveal Archive and Delete. A long swipe deletes the row at once."}, {"file": "layout/stagger-grid.html", "cat": "layout", "title": "Волна по сетке и бесконечный список", "desc": "Волна расходится от клика, задержка зависит от расстояния. Бесконечный список подгружает элементы с заглушками.", "thumb": "_thumbs/layout_stagger-grid.jpg", "src": "motion", "title_en": "Physical stagger grid and infinite list", "desc_en": "A wave spreads from the click, the delay depends on distance. An infinite list loads items with placeholders."}, {"file": "loading/loaders.html", "cat": "loading", "title": "Загрузчики", "desc": "Кольцо, прыгающие точки, пульсирующие точки, круги, полоса прогресса, вступительный экран с линией.", "thumb": "_thumbs/loading_loaders.jpg", "src": "motion", "title_en": "Loaders", "desc_en": "A ring, bouncing dots, pulsing dots, circles, a progress bar, an intro screen with a line."}, {"file": "loading/skeleton-shimmer.html", "cat": "loading", "title": "Скелетон с переливом", "desc": "Заглушки точного размера с бегущим бликом, затем содержимое проявляется из размытия по очереди.", "thumb": "_thumbs/loading_skeleton-shimmer.jpg", "src": "motion", "title_en": "Skeleton shimmer", "desc_en": "Exact-size placeholders with a running shine, then content emerges from blur in sequence."}, {"file": "interactions/image-compare.html", "cat": "interactions", "title": "Сравнение «до/после»", "desc": "Ползунок делит два изображения; тянуть, нажимать, стрелки. Подписи гаснут у краёв.", "thumb": "_thumbs/interactions_image-compare.jpg", "src": "motion", "title_en": "Before/after image compare slider", "desc_en": "A handle splits two images; drag, click or use arrows. Labels fade near the edges."}, {"file": "interactions/tilt-card.html", "cat": "interactions", "title": "Наклоняющаяся карточка", "desc": "Карточка наклоняется за курсором с пружиной и бликом, текст «приподнят» над ней.", "thumb": "_thumbs/interactions_tilt-card.jpg", "src": "motion", "title_en": "Tilt card", "desc_en": "The card tilts after the cursor with a spring and a glare, its text lifted above the surface."}, {"file": "basics/transition-lab.html", "cat": "basics", "title": "Лаборатория переходов", "desc": "Ползунки жёсткости, затухания и массы пружины; график кривой; сравнение с bounce и ease; готовая CSS-строка linear() для пружины без JS.", "thumb": "_thumbs/basics_transition-lab.jpg", "src": "motion", "title_en": "Transition lab", "desc_en": "Sliders for spring stiffness, damping and mass; a curve plot; comparison with bounce and ease; a ready CSS linear() string for springs without JS."}, {"file": "basics/enter-exit-stagger.html", "cat": "basics", "title": "Появление, исчезновение, кадры, очередь", "desc": "Появление и исчезновение, ключевые кадры, прерываемый поворот, меню «родитель, затем дети», анимация по состоянию, уход в сторону, куда листали.", "thumb": "_thumbs/basics_enter-exit-stagger.jpg", "src": "motion", "title_en": "Enter, exit, keyframes and staggered variants", "desc_en": "Enter and exit, keyframes, an interruptible rotation, a parent-then-children menu, state-driven animation, exit in the swipe direction."}, {"file": "basics/svg-paths.html", "cat": "basics", "title": "SVG-пути", "desc": "Прорисовка линии, превращение фигур, движение по кривой, длина пути от ползунка.", "thumb": "_thumbs/basics_svg-paths.jpg", "src": "motion", "title_en": "SVG paths", "desc_en": "Line drawing, shape morphing, motion along a path, path length from a slider."}, {"file": "basics/drag-gestures.html", "cat": "basics", "title": "Перетаскивание и жесты", "desc": "Свободное перетаскивание с возвратом, границы с упругими краями, блок по направлению, наведение и нажатие, следование за курсором.", "thumb": "_thumbs/basics_drag-gestures.jpg", "src": "motion", "title_en": "Drag and gestures", "desc_en": "Free dragging with return, bounds with elastic edges, axis locking, hover and press, following the cursor."}, {"file": "basics/time-and-values.html", "cat": "basics", "title": "Кадры, время, значения, цвета", "desc": "3D-куб на requestAnimationFrame, вращение с постоянной скоростью, счётчик в тексте, сравнение смешивания цветов (sRGB, линейный RGB, OKLCH).", "thumb": "_thumbs/basics_time-and-values.jpg", "src": "motion", "title_en": "Frame loop, time, values and colour interpolation", "desc_en": "A 3D cube on requestAnimationFrame, constant-speed rotation, a counter in text, colour mixing compared (sRGB, linear RGB, OKLCH)."}, {"file": "basics/bezier-editor.html", "cat": "basics", "title": "Редактор кривой cubic-bezier", "desc": "Перетаскивайте точки (или стрелками) и сразу видите движение и готовую строку CSS.", "thumb": "_thumbs/basics_bezier-editor.jpg", "src": "motion", "title_en": "Cubic-bezier editor", "desc_en": "Drag the points (or use arrows) to see the motion and the ready CSS string at once."}, {"file": "hero/hero-stagger.html", "cat": "hero", "title": "Первый экран с пружинным появлением", "desc": "Бейдж, заголовок, текст, кнопки и цифры появляются одной волной с общей пружиной.", "thumb": "_thumbs/hero_hero-stagger.jpg", "src": "motion", "title_en": "Hero with staggered spring entrance", "desc_en": "Badge, headline, text, buttons and numbers enter in a single wave with a shared spring."}, {"file": "experimental/glow-ripple.html", "cat": "experimental", "title": "Свечение по краю экрана", "desc": "Радужное свечение по контуру и волна от кнопки, как у голосовых ассистентов.", "thumb": "_thumbs/experimental_glow-ripple.jpg", "src": "motion", "title_en": "Glow ripple", "desc_en": "A rainbow glow around the screen edge and a wave from the button, like voice assistants."}, {"file": "experimental/watch-grid.html", "cat": "experimental", "title": "Сетка как на часах", "desc": "Соты из иконок: перетаскивание с инерцией, у краёв иконки уменьшаются.", "thumb": "_thumbs/experimental_watch-grid.jpg", "src": "motion", "title_en": "Watch-style honeycomb grid", "desc_en": "A honeycomb of icons: inertial dragging, icons shrink near the edges."}, {"file": "experimental/bouncy-modal.html", "cat": "experimental", "title": "Игровое окно", "desc": "Окно «уровень пройден»: выпрыгивает с пружиной, звёзды загораются по очереди.", "thumb": "_thumbs/experimental_bouncy-modal.jpg", "src": "motion", "title_en": "Playful game-style modal", "desc_en": "A \"level complete\" window springs in and its stars light up one by one."}, {"file": "charts/area-chart.html", "cat": "charts", "title": "Диаграмма с областями", "desc": "Выручка и расходы за 30 дней: области раскрываются слева направо, переключение кривой, перекрестие с подсказкой и выделение диапазона перетаскиванием.", "thumb": "_thumbs/charts_area-chart.jpg", "src": "motion", "title_en": "Area chart", "desc_en": "Revenue vs costs over 30 days: areas reveal left to right, switchable curves, a crosshair tooltip and drag-to-select range totals."}, {"file": "charts/bar-chart.html", "cat": "charts", "title": "Столбчатая диаграмма", "desc": "90 столбиков вырастают волной; при смене метрики перетекают к новым значениям, остальные столбики отступают при наведении.", "thumb": "_thumbs/charts_bar-chart.jpg", "src": "motion", "title_en": "Bar chart", "desc_en": "90 bars grow in a wave and morph to new values when the metric changes; the rest step back on hover."}, {"file": "charts/candlestick-chart.html", "cat": "charts", "title": "Свечной график", "desc": "Свечи раскрываются от середины, фитили тянутся следом. Перекрестие и ценник справа берут цвет свечи под курсором.", "thumb": "_thumbs/charts_candlestick-chart.jpg", "src": "motion", "title_en": "Candlestick chart", "desc_en": "Candles open from their midpoint with wicks stretching after. The crosshair and price tag take the colour of the candle under the cursor."}, {"file": "charts/choropleth-chart.html", "cat": "charts", "title": "Карта мира по странам", "desc": "Посетители по странам: страны проявляются с запада на восток, шкала фильтрует по уровню, клик плавно приближает страну.", "thumb": "_thumbs/charts_choropleth-chart.jpg", "src": "motion", "title_en": "Choropleth map", "desc_en": "Visitors by country: countries fade in west to east, the scale isolates a band, and a click flies to the country."}, {"file": "charts/composed-chart.html", "cat": "charts", "title": "Комбинированный график", "desc": "Столбцы, область и пунктирная линия на одной оси. Слои скрываются из легенды, кривая меняется для всех фигур сразу.", "thumb": "_thumbs/charts_composed-chart.jpg", "src": "motion", "title_en": "Composed chart", "desc_en": "Bars, an area and a dashed line on one axis. Layers toggle from the legend and the curve swaps for every shape at once."}, {"file": "charts/funnel-chart.html", "cat": "charts", "title": "Воронка продаж", "desc": "Плавная лента воронки с ореолами вырастает из центральной линии; при наведении — доля от общего и от предыдущего этапа.", "thumb": "_thumbs/charts_funnel-chart.jpg", "src": "motion", "title_en": "Funnel chart", "desc_en": "A smooth funnel band with layered halos grows from its centre line; hover shows share of total and of the previous stage."}, {"file": "charts/gauge-chart.html", "cat": "charts", "title": "Шкала с насечками", "desc": "Насечки загораются одна за другой, пока растёт значение, а число в центре прокручивается по цифрам.", "thumb": "_thumbs/charts_gauge-chart.jpg", "src": "motion", "title_en": "Notched gauge", "desc_en": "Notches light up one after another as the value climbs while the figure in the middle rolls digit by digit."}, {"file": "charts/heatmap-chart.html", "cat": "charts", "title": "Тепловая карта активности", "desc": "Год активности круглыми ячейками с разбивкой по кварталам. Ячейки проявляются по диагонали, легенда оставляет один уровень.", "thumb": "_thumbs/charts_heatmap-chart.jpg", "src": "motion", "title_en": "Activity heatmap", "desc_en": "A year of activity in round cells split by quarter. Cells ripple in diagonally and the legend keeps a single level lit."}, {"file": "charts/line-chart.html", "cat": "charts", "title": "Линейный график с зумом", "desc": "Три плавные линии на точечной сетке и мини-обзор снизу: окно перетаскивается и растягивается за ручки, график приближается.", "thumb": "_thumbs/charts_line-chart.jpg", "src": "motion", "title_en": "Line chart with brush", "desc_en": "Three smooth lines on a dot grid with an overview brush below: drag or resize the window to zoom the chart."}, {"file": "charts/live-line-chart.html", "cat": "charts", "title": "Живой график", "desc": "Цена приходит каждую секунду: окно прокручивается, ось плавно подстраивается, цифры перекатываются, точка пульсирует.", "thumb": "_thumbs/charts_live-line-chart.jpg", "src": "motion", "title_en": "Live line chart", "desc_en": "A price streams in every second: the window scrolls, the axis eases to new extremes, digits roll and the head pulses."}, {"file": "charts/pie-chart.html", "cat": "charts", "title": "Круговая диаграмма", "desc": "Сегменты пончика заполняются по кругу, выдвигаются при наведении, центр прокручивается к значению. Дырка плавно закрывается в режиме «Pie».", "thumb": "_thumbs/charts_pie-chart.jpg", "src": "motion", "title_en": "Pie chart", "desc_en": "Donut slices sweep in, pop out on hover and the centre rolls to the value. Switch to a pie and the hole closes smoothly."}, {"file": "charts/profit-loss-line.html", "cat": "charts", "title": "Линия прибыли и убытка", "desc": "Одна линия двух цветов: выше нуля — прибыль, ниже — убыток. Нулевая линия подсвечена, легенда изолирует сторону.", "thumb": "_thumbs/charts_profit-loss-line.jpg", "src": "motion", "title_en": "Profit / loss line", "desc_en": "One line in two colours: above zero is profit, below is loss. The zero baseline is highlighted and the legend isolates a side."}, {"file": "charts/radar-chart.html", "cat": "charts", "title": "Радарная диаграмма", "desc": "Две модели по шести метрикам. Фигуры вырастают из центра, смена квартала перетягивает каждую вершину, сетка — многоугольник или круг.", "thumb": "_thumbs/charts_radar-chart.jpg", "src": "motion", "title_en": "Radar chart", "desc_en": "Two models across six metrics. Shapes grow from the centre, switching quarters morphs every vertex, and the grid toggles polygon/circle."}, {"file": "charts/ring-chart.html", "cat": "charts", "title": "Кольцевые прогресс-бары", "desc": "Вложенные кольца с круглыми концами заполняются по очереди; дуга переключается между полной, три четверти и половиной.", "thumb": "_thumbs/charts_ring-chart.jpg", "src": "motion", "title_en": "Ring chart", "desc_en": "Nested rings with round caps fill one after another; the arc switches between full, three-quarter and half."}, {"file": "charts/sankey-chart.html", "cat": "charts", "title": "Диаграмма Санкей", "desc": "Поток от источника к странице и результату. Ленты переливаются от цвета к цвету, наведение на узел подсвечивает всё, что через него идёт.", "thumb": "_thumbs/charts_sankey-chart.jpg", "src": "motion", "title_en": "Sankey chart", "desc_en": "Flow from source to page to outcome. Bands blend between node colours and hovering a node traces everything that passes through it."}, {"file": "charts/scatter-chart.html", "cat": "charts", "title": "Точечная диаграмма", "desc": "Точки с кольцами появляются по очереди, перекрестие притягивается к ближайшей точке, серии скрываются из легенды.", "thumb": "_thumbs/charts_scatter-chart.jpg", "src": "motion", "title_en": "Scatter chart", "desc_en": "Ringed points pop in one by one, the crosshair snaps to the nearest point, and series hide from the legend."}, {"file": "charts/sunburst-chart.html", "cat": "charts", "title": "Диаграмма «солнце»", "desc": "Выручка на трёх уровнях вложенности. Клик по сегменту приближает его и перестраивает кольца, клик по центру — шаг назад.", "thumb": "_thumbs/charts_sunburst-chart.jpg", "src": "motion", "title_en": "Sunburst chart", "desc_en": "Revenue three levels deep. Click a segment to zoom and re-flow the rings; click the centre to step back out."}, {"file": "webgl/gradients/mesh-gradient.html", "cat": "webgl-gradients", "title": "Меш-градиент из 5 точек", "desc": "Пять цветных точек медленно плавают, между ними мягкий градиент с зерном. Цвета меняются прямо на странице.", "thumb": "_thumbs/webgl_gradients_mesh-gradient.jpg", "src": "webgl", "title_en": "Five-point mesh gradient", "desc_en": "Five coloured points drift slowly with a soft, grainy gradient between them. Colours can be changed on the page."}, {"file": "webgl/gradients/flow-gradient.html", "cat": "webgl-gradients", "title": "Текучий градиент", "desc": "Жидкий розово-фиолетово-зелёный градиент, который всё время перетекает. Палитра настраивается.", "thumb": "_thumbs/webgl_gradients_flow-gradient.jpg", "src": "webgl", "title_en": "Flowing gradient", "desc_en": "A liquid pink, violet and green gradient that keeps flowing. The palette is adjustable."}, {"file": "webgl/gradients/red-flow.html", "cat": "webgl-gradients", "title": "Красный градиент-занавес", "desc": "Мягкий красный «занавес» света на чёрном, волнуется от движения мыши.", "thumb": "_thumbs/webgl_gradients_red-flow.jpg", "src": "webgl", "title_en": "Red gradient curtain", "desc_en": "A soft red curtain of light on black that ripples with the mouse."}, {"file": "webgl/gradients/fluted-glass.html", "cat": "webgl-gradients", "title": "Градиент за рифлёным стеклом", "desc": "Шумовой сине-мятный градиент сквозь рифлёное стекло, число полос регулируется.", "thumb": "_thumbs/webgl_gradients_fluted-glass.jpg", "src": "webgl", "title_en": "Gradient behind fluted glass", "desc_en": "A blue and mint noise gradient behind fluted glass with an adjustable number of flutes."}, {"file": "webgl/gradients/azure-waves.html", "cat": "webgl-gradients", "title": "Синие стеклянные волны", "desc": "Широкая лента сине-фиолетовых волн с бликами на белом фоне.", "thumb": "_thumbs/webgl_gradients_azure-waves.jpg", "src": "webgl", "title_en": "Blue glass waves", "desc_en": "A wide band of blue and violet waves with highlights on white."}, {"file": "webgl/gradients/soft-shapes.html", "cat": "webgl-gradients", "title": "Стопка мягких форм", "desc": "Размытые лавандовые и мятные формы наслаиваются на светлом фоне.", "thumb": "_thumbs/webgl_gradients_soft-shapes.jpg", "src": "webgl", "title_en": "Soft shape stack", "desc_en": "Blurred lavender and mint shapes layered on a light background."}, {"file": "webgl/light/neon-tubes.html", "cat": "webgl-light", "title": "Неоновые трубки", "desc": "Четыре неоновые лампы с цветным свечением и отражением на полу. Трубки перетаскиваются мышью, цвета меняются.", "thumb": "_thumbs/webgl_light_neon-tubes.jpg", "src": "webgl", "title_en": "Neon tubes", "desc_en": "Four neon tubes with coloured glow and a reflection on the floor. Drag the tubes, change the colours."}, {"file": "webgl/light/light-doorway.html", "cat": "webgl-light", "title": "Световой проём", "desc": "Объёмный свет из дверного проёма в бирюзовой дымке, камера медленно приближается. Под заголовок.", "thumb": "_thumbs/webgl_light_light-doorway.jpg", "src": "webgl", "title_en": "Light doorway", "desc_en": "Volumetric light from a doorway in teal haze while the camera slowly moves in. Room for a headline."}, {"file": "webgl/light/circuit-horizon.html", "cat": "webgl-light", "title": "Схемы до горизонта", "desc": "Перспективная сетка из прямоугольных дорожек, по ним бегут светящиеся узлы. Крупный заголовок сверху.", "thumb": "_thumbs/webgl_light_circuit-horizon.jpg", "src": "webgl", "title_en": "Circuits to the horizon", "desc_en": "A perspective grid of rectangular traces with glowing nodes running along them. A large headline on top."}, {"file": "webgl/light/light-helix.html", "cat": "webgl-light", "title": "Световая спираль", "desc": "Голубая спираль из нитей света с частицами и боке на тёмно-синем.", "thumb": "_thumbs/webgl_light_light-helix.jpg", "src": "webgl", "title_en": "Light helix", "desc_en": "A blue helix of light strands with particles and bokeh on dark blue."}, {"file": "webgl/light/horizon-burst.html", "cat": "webgl-light", "title": "Вспышка над горизонтом", "desc": "Синий взрыв света над краем планеты, лучи и туманность. Мышь сдвигает вспышку.", "thumb": "_thumbs/webgl_light_horizon-burst.jpg", "src": "webgl", "title_en": "Burst over the horizon", "desc_en": "A blue burst of light over the edge of a planet, with rays and nebula. The mouse moves the flare."}, {"file": "webgl/light/nebula-rays.html", "cat": "webgl-light", "title": "Зелёные лучи туманности", "desc": "Лучи света из угла экрана в глубоком бирюзовом, под центральный заголовок.", "thumb": "_thumbs/webgl_light_nebula-rays.jpg", "src": "webgl", "title_en": "Green nebula rays", "desc_en": "Rays of light from a corner in deep teal, framing a centred headline."}, {"file": "webgl/light/led-grid.html", "cat": "webgl-light", "title": "Светодиодная сетка", "desc": "Сетка точек загорается по рисуемым линиям, мышь тоже рисует светом.", "thumb": "_thumbs/webgl_light_led-grid.jpg", "src": "webgl", "title_en": "LED grid", "desc_en": "A grid of dots lights up along drawn lines; the mouse paints with light too."}, {"file": "webgl/light/light-collision.html", "cat": "webgl-light", "title": "Столкновение лучей", "desc": "Тёплый и холодный лучи встречаются в одной точке, с хроматической аберрацией и зерном.", "thumb": "_thumbs/webgl_light_light-collision.jpg", "src": "webgl", "title_en": "Light collision", "desc_en": "A warm and a cold beam meet at one point, with chromatic aberration and grain."}, {"file": "webgl/light/light-blades.html", "cat": "webgl-light", "title": "Световые лезвия", "desc": "Изогнутые белые блики, как отражения на клинках, плавно скользят.", "thumb": "_thumbs/webgl_light_light-blades.jpg", "src": "webgl", "title_en": "Light blades", "desc_en": "Curved white highlights, like reflections on blades, glide smoothly."}, {"file": "webgl/light/laser-beam.html", "cat": "webgl-light", "title": "Лазерный луч", "desc": "Фиолетовый луч бьёт в землю и поднимает подсвеченный дым.", "thumb": "_thumbs/webgl_light_laser-beam.jpg", "src": "webgl", "title_en": "Laser beam", "desc_en": "A violet beam strikes the ground and lifts lit smoke."}, {"file": "webgl/light/ray-fan.html", "cat": "webgl-light", "title": "Веер прожекторов", "desc": "Полукруг зелёных лучей, как свет стадиона, пульсирует наружу.", "thumb": "_thumbs/webgl_light_ray-fan.jpg", "src": "webgl", "title_en": "Floodlight fan", "desc_en": "A half circle of green rays, like stadium lights, pulses outwards."}, {"file": "webgl/light/electric-ring.html", "cat": "webgl-light", "title": "Электрическое кольцо", "desc": "Синий эллипс-портал с бегущими молниями.", "thumb": "_thumbs/webgl_light_electric-ring.jpg", "src": "webgl", "title_en": "Electric ring", "desc_en": "A blue elliptical portal with running lightning."}, {"file": "webgl/light/ghost-ring.html", "cat": "webgl-light", "title": "Призрачное кольцо", "desc": "Фиолетовое светящееся кольцо дышит и колышется, поверх символьный дизеринг.", "thumb": "_thumbs/webgl_light_ghost-ring.jpg", "src": "webgl", "title_en": "Ghost ring", "desc_en": "A glowing violet ring breathes and sways under glyph dithering."}, {"file": "webgl/light/red-blinds.html", "cat": "webgl-light", "title": "Красные жалюзи", "desc": "Диагональный луч из красно-розовых квадратов-ламелей на тёмно-бирюзовом.", "thumb": "_thumbs/webgl_light_red-blinds.jpg", "src": "webgl", "title_en": "Red blinds", "desc_en": "A diagonal beam of red and pink slats on dark teal."}, {"file": "webgl/light/arc-lines-scan.html", "cat": "webgl-light", "title": "Дуги и сканирующий луч", "desc": "Пучок тонких синих линий-дуг, по нему проходит яркий луч сканера.", "thumb": "_thumbs/webgl_light_arc-lines-scan.jpg", "src": "webgl", "title_en": "Arcs and a scanning beam", "desc_en": "A bundle of thin blue arcs swept by a bright scanning beam."}, {"file": "webgl/light/glass-logo-beams.html", "cat": "webgl-light", "title": "Стеклянный логотип в лучах света", "desc": "Логотип из стекла преломляет тёплые лучи на тёмно-коричневом. Можно загрузить свой PNG-логотип.", "thumb": "_thumbs/webgl_light_glass-logo-beams.jpg", "src": "webgl", "title_en": "Glass logo in light beams", "desc_en": "A glass logo refracts warm beams on dark brown. Load your own PNG logo."}, {"file": "webgl/light/embossed-chip.html", "cat": "webgl-light", "title": "Чип с бегущим светом", "desc": "Тёмный чип с выдавленной надписью, по нему проходит точечный свет и зажигает рельеф.", "thumb": "_thumbs/webgl_light_embossed-chip.jpg", "src": "webgl", "title_en": "Chip with travelling light", "desc_en": "A dark chip with embossed lettering; a point light sweeps across and lights up the relief."}, {"file": "webgl/3d/circuit-board.html", "cat": "webgl-3d", "title": "Печатная плата с ASCII-линзой", "desc": "3D-плата с контурами и медными дорожками вращается над пиксельным заголовком. Курсор открывает круг оранжевых ASCII-символов.", "thumb": "_thumbs/webgl_3d_circuit-board.jpg", "src": "webgl", "title_en": "Circuit board with an ASCII lens", "desc_en": "A 3D board with outlines and copper traces turns above a pixel headline. The cursor opens a circle of orange ASCII."}, {"file": "webgl/3d/voxel-clouds.html", "cat": "webgl-3d", "title": "Воксельные облака", "desc": "Потолок из кубических облаков над лавандовым небом, заголовок проявляется пиксельными блоками.", "thumb": "_thumbs/webgl_3d_voxel-clouds.jpg", "src": "webgl", "title_en": "Voxel clouds", "desc_en": "A ceiling of cubic clouds over a lavender sky; the headline appears in pixel blocks."}, {"file": "webgl/3d/translucent-discs.html", "cat": "webgl-3d", "title": "Полупрозрачные диски", "desc": "Пять цветных дисков веером, наклоняются к курсору и отбрасывают радужную тень. Чистый CSS 3D.", "thumb": "_thumbs/webgl_3d_translucent-discs.jpg", "src": "webgl", "title_en": "Translucent discs", "desc_en": "Five coloured discs in a fan tilt towards the cursor and cast a rainbow shadow. Pure CSS 3D."}, {"file": "webgl/3d/marble-run.html", "cat": "webgl-3d", "title": "Шарик на трассе", "desc": "Хромовый шарик катится по глянцевой синей трассе на опорах, камера идёт следом, фон мягко размыт.", "thumb": "_thumbs/webgl_3d_marble-run.jpg", "src": "webgl", "title_en": "Marble run", "desc_en": "A chrome marble rolls along a glossy blue track on supports, the camera follows, the background is softly blurred."}, {"file": "webgl/3d/cd-carousel.html", "cat": "webgl-3d", "title": "Карусель CD", "desc": "Диски с обложками летают по кругу и вращаются, ползунок прогресса можно тянуть. CSS 3D.", "thumb": "_thumbs/webgl_3d_cd-carousel.jpg", "src": "webgl", "title_en": "CD carousel", "desc_en": "Discs with covers fly in a circle and spin; the progress slider can be dragged. CSS 3D."}, {"file": "webgl/3d/ribbon-badge.html", "cat": "webgl-3d", "title": "Лента и круговой бейдж", "desc": "Радужная 3D-лента извивается сквозь вращающуюся круговую надпись.", "thumb": "_thumbs/webgl_3d_ribbon-badge.jpg", "src": "webgl", "title_en": "Ribbon and circular badge", "desc_en": "A rainbow 3D ribbon winds through a rotating circular label."}, {"file": "webgl/3d/metal-spheres.html", "cat": "webgl-3d", "title": "Металлические шары с физикой", "desc": "Тёмно-зелёные шары с гравитацией и столкновениями, мышь их расталкивает. Сзади бегущая строка с рябью.", "thumb": "_thumbs/webgl_3d_metal-spheres.jpg", "src": "webgl", "title_en": "Metal spheres with physics", "desc_en": "Dark green spheres with gravity and collisions; the mouse pushes them apart. A rippling ticker behind."}, {"file": "webgl/3d/fracture-cube.html", "cat": "webgl-3d", "title": "Раскалывающийся куб", "desc": "Куб из восьми частей раскрывается и показывает светящееся зелёное ядро.", "thumb": "_thumbs/webgl_3d_fracture-cube.jpg", "src": "webgl", "title_en": "Fracturing cube", "desc_en": "An eight-piece cube opens up to reveal a glowing green core."}, {"file": "webgl/3d/voxel-skyline.html", "cat": "webgl-3d", "title": "Стопки вокселей", "desc": "Серые кубики с фасками растут как город, отбрасывают тени и вспыхивают. Заголовок с засечками.", "thumb": "_thumbs/webgl_3d_voxel-skyline.jpg", "src": "webgl", "title_en": "Voxel stacks", "desc_en": "Grey bevelled cubes grow like a city, cast shadows and flash. A serif headline."}, {"file": "webgl/3d/wireframe-torus.html", "cat": "webgl-3d", "title": "Каркасный тор с искрами", "desc": "Вращающийся тор из персиковых линий, по рёбрам бегут искры.", "thumb": "_thumbs/webgl_3d_wireframe-torus.jpg", "src": "webgl", "title_en": "Wireframe torus with sparks", "desc_en": "A rotating torus of peach lines with sparks running along the edges."}, {"file": "webgl/3d/goop-spheres.html", "cat": "webgl-3d", "title": "Слипающиеся шары", "desc": "Шестнадцать глянцевых шаров     how1: '<b>Animations.</b> The effect styles live in <code>&lt;style id="effect"&gt;</code>, the demo page styles in <code>&lt;style id="page"&gt;</code>. Copy the effect block, the markup and the script at the bottom of the file. <code>spring()</code> turns a spring into a CSS <code>linear()</code> string. <code>prefers-reduced-motion</code> is respected everywhere.',
    how2: '<b>WebGL.</b> Each effect is a fragment shader in <code>&lt;script type="x-shader/x-fragment"&gt;</code>, run by the <code>shader()</code> mini engine inlined in every file: passes, HDR light with bloom, adaptive resolution, mouse trails, text and image textures, pausing off screen. Where there is a “Your photo” button you can also drop your own photo or video onto the page.',
    search: 'Search: carousel, cursor, dithering, glass…', searchLabel: 'Search', all: 'All', motion: 'Animations', webgl: 'WebGL', allCats: 'All sections',
    count: (a, b) => `${a} of ${b}`, empty: 'Nothing found.', foot: '', docTitle: 'Catalogue — sxwrpv motion kit',
  },
};
let lang = 'ru';
try { lang = localStorage.getItem('mk-lang') === 'en' ? 'en' : 'ru'; } catch (e) {}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const srcOf = Object.fromEntries(items.map((i) => [i.cat, i.src]));
const catName = (k) => { const c = cats.find((x) => x[0] === k); return c ? (lang === 'en' ? c[2] : c[1]) : k; };
const tt = (i) => (lang === 'en' ? i.title_en : i.title);
const dd = (i) => (lang === 'en' ? i.desc_en : i.desc);
let source = '', active = '';
const fromHash = () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'motion' || h === 'webgl') { source = h; active = ''; }
  else if (srcOf[h]) { source = srcOf[h]; active = h; }
  else { source = ''; active = ''; }
};
const toHash = () => history.replaceState(null, '', active ? `#${active}` : source ? `#${source}` : location.pathname + location.search);
const srcBox = document.getElementById('src'), chips = document.getElementById('chips'), q = document.getElementById('q');
function srcRender() {
  srcBox.innerHTML = '';
  [['', T[lang].all], ['motion', T[lang].motion], ['webgl', T[lang].webgl]].forEach(([k, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.setAttribute('aria-pressed', String(k === source));

  });
}
function chipsRender() {
  chips.innerHTML = '';
  [['', T[lang].allCats], ...cats.filter(([k]) => !source || srcOf[k] === source).map(([k]) => [k, (!source && srcOf[k] === 'webgl' ? 'WebGL · ' : '') + catName(k)])].forEach(([k, label]) => {
    const b = document.createElement('button');

    chips.append(b);
  });
}
const card = (i) => `<article class="card"><a class="thumb" href="${esc(i.file)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true"><img src="${esc(i.thumb)}" alt="" loading="lazy" decoding="async"></a><div class="meta"><a class="title" href="${esc(i.file)}" target="_blank" rel="noopener">${esc(tt(i))}</a><span class="path">${esc(i.file)}</span><p class="desc">${esc(dd(i))}</p></div></article>`;
function render() {
  const s = q.value.trim().toLowerCase();
  const list = items.filter((i) => (!source || i.src === source) && (!active || i.cat === active) && (!s || `${i.title} ${i.title_en} ${i.desc} ${i.desc_en} ${i.file}`.toLowerCase().includes(s)));
  document.getElementById('list').innerHTML = cats.filter(([k]) => list.some((i) => i.cat === k)).map(([k]) => {
    const g = list.filter((i) => i.cat === k);
    return `<h2 id="cat-${k}">${srcOf[k] === 'webgl' ? 'WebGL · ' : ''}${esc(catName(k))} <span>${g.length}</span></h2><div class="grid">${g.map(card).join('')}</div>`;
  }).join('') || `<p class="empty">${T[lang].empty}</p>`;
  document.getElementById('count').textContent = T[lang].count(list.length, items.length);
}
function applyLang() {
  document.documentElement.lang = lang;
  document.title = T[lang].docTitle;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
  document.querySelectorAll('[data-h]').forEach((el) => { el.innerHTML = T[lang][el.dataset.h]; });
  q.placeholder = T[lang].search;
  q.setAttribute('aria-label', T[lang].searchLabel);

  render();
}
document.querySelector('[data-lang]').addEventListener('click', () => {
  lang = lang === 'ru' ? 'en' : 'ru';
  try { localStorage.setItem('mk-lang', lang); } catch (e) {}
  applyLang();
});
q.addEventListener('input', render);
addEventListener('hashchange', () => { fromHash(); srcRender(); chipsRender(); render(); });
fromHash();
applyLang();
if (active) requestAnimationFrame(() => document.getElementById('cat-' + active)?.scrollIntoView());
const nav = document.querySelector('[data-nav]');
let lastY = scrollY;
addEventListener('scroll', () => {
  const y = scrollY;
  if (Math.abs(y - lastY) < 6) return;
  nav.classList.toggle('is-hidden', y > lastY && y > 120 && !nav.contains(document.activeElement));
  lastY = y;
}, { passive: true });
</script>
