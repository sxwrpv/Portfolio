<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Carousel</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; align-content: center; gap: 24px; padding: 30px 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
.opts { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; color: var(--muted); font-size: 14px; }
.opts label { display: inline-flex; gap: 6px; align-items: center; }
</style>
<style id="effect">
.car { --gap: 16px; --size: min(72vw, 420px); position: relative; display: grid; gap: 16px; }
.car__viewport {
  display: flex; gap: var(--gap); overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: 0 calc(50% - var(--size) / 2); cursor: grab; -webkit-user-select: none; user-select: none;
}
.car__viewport::-webkit-scrollbar { display: none; }
.car.is-free .car__viewport, .car.is-dragging .car__viewport { scroll-snap-type: none; }
.car.is-dragging .car__viewport { cursor: grabbing; }
.car__slide { flex: none; width: var(--size); aspect-ratio: 4 / 3; scroll-snap-align: center; border-radius: 18px; display: grid; place-items: end start; padding: 20px; font: 800 40px/1 system-ui, sans-serif; color: rgba(255, 255, 255, .92); }
.car__nav { display: flex; align-items: center; justify-content: center; gap: 14px; }
.car__arrow { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer; transition: opacity .2s, transform .15s; }
.car__arrow:active { transform: scale(.92); }
.car__arrow:disabled { opacity: .3; cursor: default; }
.car__dots { display: flex; gap: 8px; align-items: center; }
.car__dot { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: var(--muted); opacity: .45; cursor: pointer; transform: scale(var(--s, 1)); transition: transform .3s, opacity .3s, width .3s, border-radius .3s, background-color .3s; }
.car__dot[aria-current="true"] { width: 22px; border-radius: 6px; opacity: 1; background: var(--text); }
.car__count { min-width: 60px; text-align: center; font: 600 14px/1 ui-monospace, Menlo, monospace; color: var(--muted); font-variant-numeric: tabular-nums; }
.car__progress { height: 3px; margin: 0 calc(50% - var(--size) / 2); background: var(--line); border-radius: 3px; overflow: hidden; }
.car__progress i { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(var(--t, 0)); }
.car__scrub { width: calc(var(--size)); justify-self: center; accent-color: var(--accent); }
[dir="rtl"] .car__progress i { transform-origin: 100% 50%; }
</style>
</head>
<body>
<div class="opts">
  <label><input type="checkbox" data-opt="autoplay"> Autoplay</label>
  <label><input type="checkbox" data-opt="free"> Free scroll</label>
  <label><input type="checkbox" data-opt="rtl"> RTL</label>
  <label><input type="checkbox" data-opt="scale" checked> Scaling dots</label>
</div>
<section class="car" data-car aria-roledescription="carousel" aria-label="Gallery">
  <div class="car__viewport" data-viewport tabindex="0"></div>
  <div class="car__progress" aria-hidden="true"><i data-timer></i></div>
  <div class="car__nav">
    <button class="car__arrow" type="button" data-prev aria-label="Previous slide">←</button>
    <div class="car__dots" data-dots></div>
    <span class="car__count" data-count aria-live="polite"></span>
    <button class="car__arrow" type="button" data-next aria-label="Next slide">→</button>
  </div>
  <input class="car__scrub" type="range" min="0" max="1000" value="0" data-scrub aria-label="Scrub through the gallery">
</section>
<script>
const car = document.querySelector('[data-car]');
const vp = car.querySelector('[data-viewport]');
const dotsBox = car.querySelector('[data-dots]');
const count = car.querySelector('[data-count]');
const timer = car.querySelector('[data-timer]');
const scrub = car.querySelector('[data-scrub]');
const N = 10;
for (let i = 0; i < N; i++) {
  const h = (i * 36 + 12) % 360;
  const s = document.createElement('div');
  s.className = 'car__slide';
  s.setAttribute('role', 'group');
  s.setAttribute('aria-label', `${i + 1} of ${N}`);
  s.style.background = `radial-gradient(110% 90% at 25% 15%, hsl(${h} 85% 64%), hsl(${(h + 45) % 360} 70% 28%))`;
  s.textContent = String(i + 1).padStart(2, '0');
  vp.append(s);
  const d = document.createElement('button');
  d.className = 'car__dot';
  d.type = 'button';
  d.setAttribute('aria-label', `Go to slide ${i + 1}`);
  d.addEventListener('click', () => go(i));
  dotsBox.append(d);
}
const slides = [...vp.children];
const dots = [...dotsBox.children];
let index = 0;
const opts = { autoplay: false, free: false, rtl: false, scale: true };
const centerOf = (el) => { const r = el.getBoundingClientRect(); return r.left + r.width / 2; };
const current = () => {
  const mid = centerOf(vp);
  let best = 0, bd = Infinity;
  slides.forEach((s, i) => { const d = Math.abs(centerOf(s) - mid); if (d < bd) { bd = d; best = i; } });
  return best;
};
const go = (i, smooth = true) => {
  index = Math.max(0, Math.min(N - 1, i));
  const s = slides[index];
  const delta = centerOf(s) - centerOf(vp);
  vp.scrollBy({ left: delta, behavior: smooth ? 'smooth' : 'auto' });
  restartTimer();
};
const sync = () => {
  index = current();
  dots.forEach((d, i) => {
    d.setAttribute('aria-current', String(i === index));
    const dist = Math.abs(i - index);
    d.style.setProperty('--s', opts.scale ? Math.max(.4, 1 - Math.max(0, dist - 1) * .25) : 1);
  });
  count.textContent = `${index + 1} / ${N}`;
  car.querySelector('[data-prev]').disabled = index === 0;
  car.querySelector('[data-next]').disabled = index === N - 1;
  const max = vp.scrollWidth - vp.clientWidth;
  if (!scrubbing) scrub.value = Math.round((Math.abs(vp.scrollLeft) / (max || 1)) * 1000);
};
let scrubbing = false;
scrub.addEventListener('input', () => {
  scrubbing = true;
  car.classList.add('is-dragging');
  const max = vp.scrollWidth - vp.clientWidth;
  vp.scrollLeft = (opts.rtl ? -1 : 1) * (scrub.value / 1000) * max;
});
scrub.addEventListener('change', () => { scrubbing = false; car.classList.remove('is-dragging'); if (!opts.free) go(current()); });
vp.addEventListener('scroll', () => requestAnimationFrame(sync), { passive: true });
car.querySelector('[data-prev]').addEventListener('click', () => go(index - 1));
car.querySelector('[data-next]').addEventListener('click', () => go(index + 1));
vp.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { e.preventDefault(); go(index + (opts.rtl ? -1 : 1)); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(index + (opts.rtl ? 1 : -1)); }
});
let drag = null;
vp.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse') return;
  drag = { x: e.clientX, left: vp.scrollLeft, lastX: e.clientX, t: performance.now(), v: 0 };
  vp.setPointerCapture(e.pointerId);
  car.classList.add('is-dragging');
});
vp.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const now = performance.now();
  drag.v = drag.v * .5 + ((e.clientX - drag.lastX) / Math.max(1, now - drag.t)) * .5;
  drag.lastX = e.clientX;
  drag.t = now;
  vp.scrollLeft = drag.left - (e.clientX - drag.x);
});
const release = () => {
  if (!drag) return;
  const v = performance.now() - drag.t > 80 ? 0 : drag.v;
  drag = null;
  car.classList.remove('is-dragging');
  if (opts.free) {
    let vel = -v * 16;
    let last = performance.now();
    const glide = (now = performance.now()) => { const f = Math.min(3, Math.max(0, (now - last) / 16.667)); last = now; vel *= Math.pow(.94, f); vp.scrollLeft += vel * f; if (Math.abs(vel) > .5) requestAnimationFrame(glide); };
    glide();
  } else {
    const forward = opts.rtl ? -1 : 1;
    const step = v < -.3 ? forward : v > .3 ? -forward : 0;
    go(current() + step);
  }
};
vp.addEventListener('pointerup', release);
vp.addEventListener('pointercancel', release);
let autoRaf, autoStart;
const DURATION = 3500;
function restartTimer() {
  cancelAnimationFrame(autoRaf);
  timer.style.setProperty('--t', 0);
  if (!opts.autoplay) return;
  autoStart = performance.now();
  const tick = (now) => {
    if (car.matches(':hover, :focus-within')) autoStart = now - (Number(timer.style.getPropertyValue('--t')) * DURATION);
    const t = Math.min(1, (now - autoStart) / DURATION);
    timer.style.setProperty('--t', t.toFixed(4));
    if (t >= 1) { go(index === N - 1 ? 0 : index + 1); return; }
    autoRaf = requestAnimationFrame(tick);
  };
  autoRaf = requestAnimationFrame(tick);
}
document.querySelectorAll('[data-opt]').forEach((box) => box.addEventListener('change', () => {
  opts[box.dataset.opt] = box.checked;
  car.classList.toggle('is-free', opts.free);
  if (box.dataset.opt === 'rtl') { car.dir = opts.rtl ? 'rtl' : 'ltr'; go(index, false); }
  restartTimer();
  sync();
}));
go(0, false);
sync();
</script>
</body>
</html>
