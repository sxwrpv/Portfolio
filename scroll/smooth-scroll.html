<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Smooth scroll</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, sans-serif; }
section { min-height: 90vh; display: grid; place-items: center; padding: 10vh 6vw; }
section h2 { font: 900 clamp(40px, 8vw, 110px)/1 system-ui, sans-serif; letter-spacing: -.03em; }
.media { width: min(80vw, 760px); aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; }
.media > div { width: 100%; height: 130%; margin-top: -15%; background: radial-gradient(80% 80% at 30% 30%, #ffb36b, #6b2a6a 60%, #121226); }
</style>
<style id="effect">
html.smooth, html.smooth body { overflow: hidden; height: 100%; }
.smooth-viewport { position: fixed; inset: 0; overflow: hidden; }
.smooth-content { will-change: transform; }
.smooth-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 5; background: var(--accent); transform-origin: 0 50%; transform: scaleX(var(--p, 0)); }
</style>
</head>
<body>
<div class="smooth-bar" data-bar aria-hidden="true"></div>
<div class="smooth-viewport" data-viewport>
  <div class="smooth-content" data-content>
    <section><h2>Smooth</h2></section>
    <section><div class="media"><div data-speed="0.25"></div></div></section>
    <section><h2 data-speed="-0.15">Inertia</h2></section>
    <section><div class="media"><div data-speed="0.25" style="background: radial-gradient(80% 80% at 70% 30%, #8fd3ff, #234b8f 60%, #0b1022)"></div></div></section>
    <section><h2>The end</h2></section>
  </div>
</div>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const viewport = document.querySelector('[data-viewport]');
const content = document.querySelector('[data-content]');
const bar = document.querySelector('[data-bar]');
const parallax = [...document.querySelectorAll('[data-speed]')];
let target = 0, current = 0, max = 0;
const measure = () => { max = Math.max(0, content.scrollHeight - innerHeight); target = Math.min(target, max); };
if (reduce) {
  viewport.style.position = 'static';
} else {
  document.documentElement.classList.add('smooth');
  measure();
  addEventListener('resize', measure);
  addEventListener('wheel', (e) => { e.preventDefault(); target = Math.min(max, Math.max(0, target + e.deltaY)); }, { passive: false });
  let touchY = null;
  addEventListener('touchstart', (e) => { touchY = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchmove', (e) => { const y = e.touches[0].clientY; target = Math.min(max, Math.max(0, target + (touchY - y) * 1.6)); touchY = y; }, { passive: true });
  addEventListener('keydown', (e) => {
    const step = { ArrowDown: 80, ArrowUp: -80, PageDown: innerHeight * .9, PageUp: -innerHeight * .9, ' ': innerHeight * .9, Home: -Infinity, End: Infinity }[e.key];
    if (step === undefined) return;
    e.preventDefault();
    target = Math.min(max, Math.max(0, target + step));
  });
  let mids = [];
  const measureMids = () => { mids = parallax.map((el) => { const r = el.parentElement.getBoundingClientRect(); return r.top + current + r.height / 2; }); };
  measureMids();
  addEventListener('resize', measureMids);
  let last = performance.now();
  const tick = (now = performance.now()) => {
    const f = Math.min(3, Math.max(0, (now - last) / 16.667));
    last = now;
    current += (target - current) * (1 - Math.pow(.915, f));
    if (Math.abs(target - current) < .1) current = target;
    content.style.transform = `translate3d(0, ${(-current).toFixed(2)}px, 0)`;
    bar.style.setProperty('--p', max ? (current / max).toFixed(4) : 0);
    parallax.forEach((el, i) => {
      const off = mids[i] - current - innerHeight / 2;
      el.style.transform = `translate3d(0, ${(off * Number(el.dataset.speed)).toFixed(2)}px, 0)`;
    });
    requestAnimationFrame(tick);
  };
  tick();
}
</script>
</body>
</html>
