  $('[data-desc]').textContent = lang === 'en' ? i.desc_en : i.desc;
  $('[data-open]').href = i.file;
  frame.title = tt(i);
  stage.setAttribute('aria-labelledby', `tab-${current}`);
}
// Crossfade: fade the frame out, swap the file, fade back in once it has loaded.
function show(k, focusTab) {
  current = (k + items.length) % items.length;
  tabs.querySelectorAll('[role="tab"]').forEach((b, n) => { b.setAttribute('aria-selected', String(n === current)); b.tabIndex = n === current ? 0 : -1; });
  grid.querySelectorAll('.card').forEach((c, n) => c.setAttribute('aria-current', String(n === current)));
  const tab = tabs.children[current];
  tab.scrollIntoView({ block: 'nearest', inline: 'center', behavior: reduce ? 'auto' : 'smooth' });
  if (focusTab) tab.focus({ preventScroll: true });
  setHash();
  renderInfo();
  const file = items[current].file;
  if (file === wanted) return;
  wanted = file;
  stage.classList.add('is-swapping');
  clearTimeout(swapTimer);
  swapTimer = setTimeout(() => { swapTimer = 0; frame.src = file; }, reduce ? 0 : 220);
}
// Only fade back in once the requested file has loaded, not a late load from the previous one.
frame.addEventListener('load', () => { if (!swapTimer && frame.getAttribute('src') === wanted) stage.classList.remove('is-swapping'); });
tabs.addEventListener('click', (e) => { const b = e.target.closest('[role="tab"]'); if (b) show([...tabs.children].indexOf(b)); });
tabs.addEventListener('keydown', (e) => {
  const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (d) { e.preventDefault(); show(current + d, true); }
  else if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); show(e.key === 'Home' ? 0 : items.length - 1, true); }
});
grid.addEventListener('click', (e) => { const c = e.target.closest('.card'); if (!c) return; show(+c.dataset.k); stage.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); });
$('[data-prev]').addEventListener('click', () => show(current - 1));
$('[data-next]').addEventListener('click', () => show(current + 1));
addEventListener('hashchange', () => { const k = items.findIndex((i) => slug(i) === location.hash.slice(1)); if (k >= 0 && k !== current) show(k); });

function applyLang() {
  document.documentElement.lang = lang;
  document.title = T[lang].docTitle;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[lang][el.dataset.t]; });
  document.querySelectorAll('[data-h]').forEach((el) => { el.innerHTML = T[lang][el.dataset.h]; });
  document.querySelectorAll('[data-l]').forEach((s) => s.setAttribute('aria-current', String(s.dataset.l === lang)));
  $('[data-prev]').setAttribute('aria-label', T[lang].prev);
  $('[data-next]').setAttribute('aria-label', T[lang].next);
  renderLists();
  renderInfo();
}
$('[data-lang]').addEventListener('click', () => {
  lang = lang === 'ru' ? 'en' : 'ru';
  try { localStorage.setItem('mk-lang', lang); } catch (e) {}
  applyLang();
});
// Arrow keys browse charts anywhere on the page, except while typing or inside a tab (the tablist handles its own keys).
addEventListener('keydown', (e) => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.target.closest('input, textarea, [role="tab"]')) return;
  const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (d) show(current + d);
});
applyLang();
wanted = items[current].file;
frame.src = wanted;
setHash();
const nav = $('[data-nav]');
let lastY = scrollY;
addEventListener('scroll', () => {
  const y = scrollY;
  if (Math.abs(y - lastY) < 6) return;
  nav.classList.toggle('is-hidden', y > lastY && y > 120 && !nav.contains(document.activeElement));
  lastY = y;
}, { passive: true });
</script>
<script>
(() => {
  // Scroll progress with a spring chase
  const bar = Object.assign(document.createElement('div'), { className: 'progress' });
  bar.setAttribute('aria-hidden', 'true');
  document.body.prepend(bar);
  const s = { x: 0, v: 0 };
  let raf = 0, last = 0;
  const target = () => scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight);
  const step = (now) => {
    const dt = Math.min(.05, (now - last) / 1000 || .016);
    last = now;
    const t = target();
    for (let i = 0; i < 4; i++) { const f = -260 * (s.x - t) - 30 * s.v; s.v += f * dt / 4; s.x += s.v * dt / 4; }
    bar.style.setProperty('--p', Math.max(0, s.x).toFixed(4));
    raf = Math.abs(s.x - t) + Math.abs(s.v) > 1e-4 ? requestAnimationFrame(step) : 0;
  };
  const kick = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } };
  addEventListener('scroll', kick, { passive: true });
  addEventListener('resize', kick);
  kick();
})();
</script>
