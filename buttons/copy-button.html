<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Copy button</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #3ddc84; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; gap: 18px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
.code { display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font: 15px/1 ui-monospace, Menlo, monospace; }
</style>
<style id="effect">
.copy { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--text); font: 600 14px/1 system-ui, sans-serif; cursor: pointer; transition: border-color .2s, background-color .2s, transform .15s; }
.copy:active { transform: scale(.95); }
.copy__icons { position: relative; width: 18px; height: 18px; }
.copy__icons svg { position: absolute; inset: 0; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: opacity .25s, filter .25s, transform .35s cubic-bezier(.2, .9, .3, 1.3); }
.copy__check { opacity: 0; filter: blur(4px); transform: scale(.5); color: var(--accent); }
.copy__check path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .35s .12s ease-out; }
.copy__labels { display: grid; overflow: hidden; height: 1em; }
.copy__labels span { grid-area: 1 / 1; transition: transform .35s cubic-bezier(.2, .9, .3, 1.2), opacity .25s; }
.copy__labels span + span { transform: translateY(110%); opacity: 0; color: var(--accent); }
.copy.is-done { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.copy.is-done .copy__doc { opacity: 0; filter: blur(4px); transform: scale(.5); }
.copy.is-done .copy__check { opacity: 1; filter: none; transform: none; }
.copy.is-done .copy__check path { stroke-dashoffset: 0; }
.copy.is-done .copy__labels span:first-child { transform: translateY(-110%); opacity: 0; }
.copy.is-done .copy__labels span + span { transform: none; opacity: 1; }
@media (prefers-reduced-motion: reduce) { .copy *, .copy { transition: none !important; } }
</style>
</head>
<body>
<div class="code"><span data-copy-source>npm install motion</span>
  <button class="copy" type="button" data-copy aria-live="polite">
    <span class="copy__icons" aria-hidden="true">
      <svg class="copy__doc" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
      <svg class="copy__check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" pathLength="1"/></svg>
    </span>
    <span class="copy__labels"><span>Copy</span><span>Copied</span></span>
  </button>
</div>
<script>
document.querySelectorAll('[data-copy]').forEach((btn) => {
  const src = btn.parentElement.querySelector('[data-copy-source]');
  let t;
  btn.addEventListener('click', async () => {
    const text = src.textContent;
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    btn.classList.add('is-done');
    btn.setAttribute('aria-label', 'Copied');
    clearTimeout(t);
    t = setTimeout(() => { btn.classList.remove('is-done'); btn.removeAttribute('aria-label'); }, 2000);
  });
});
</script>
</body>
</html>
