<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Scroll word reveal</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --text: #f4f4f5; --muted: #a1a1aa; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
.spacer { height: 70vh; display: grid; place-items: center; color: var(--muted); }
.track { height: 260vh; }
.sticky { position: sticky; top: 0; height: 100vh; display: grid; place-items: center; padding: 0 6vw; }
p.big { max-width: 22ch; font: 700 clamp(30px, 5.2vw, 64px)/1.15 system-ui, -apple-system, sans-serif; letter-spacing: -.01em; }
</style>
<style id="effect">
.reveal-word { opacity: calc(.14 + .86 * var(--p, 0)); transition: opacity .12s linear; }
</style>
</head>
<body>
<div class="spacer">Scroll down</div>
<section class="track" data-reveal-track>
  <div class="sticky"><p class="big" data-reveal-words>From a scribble on a napkin to something people love, every idea deserves a little motion. Start small, move with intent, and let the details do the talking.</p></div>
</section>
<div class="spacer">End</div>
<script>
const track = document.querySelector('[data-reveal-track]');
const para = document.querySelector('[data-reveal-words]');
const words = para.textContent.trim().split(/\s+/);
para.setAttribute('aria-label', para.textContent.trim());
para.innerHTML = words.map((w) => `<span class="reveal-word" aria-hidden="true">${w}</span>`).join(' ');
const spans = [...para.children];
const update = () => {
  const r = track.getBoundingClientRect();
  const progress = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
  const pos = progress * spans.length;
  spans.forEach((s, i) => s.style.setProperty('--p', Math.min(1, Math.max(0, pos - i)).toFixed(3)));
};
addEventListener('scroll', update, { passive: true });
addEventListener('resize', update);
update();
</script>
</body>
</html>
