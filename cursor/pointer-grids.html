<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23070708%22/%3E%3Cpath d=%22M32 13 49 27 32 51 15 27Z%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M15 27h34M24 27l8 24 8-24M24 27l8-14 8 14%22 fill=%22none%22 stroke=%22%23f1f0ec%22 stroke-width=%222%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Pointer grids: bobble, filings, collision, conic</title>
<style id="page">
:root { color-scheme: dark; --bg: #0e0e10; --panel: #18181b; --line: #2a2a2e; --text: #f4f4f5; --muted: #a1a1aa; --accent: #ff6a3d; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100vh; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; padding: 28px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
section { display: grid; gap: 12px; justify-items: center; align-content: start; }
h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
</style>
<style id="effect">
.bobble { display: grid; grid-template-columns: repeat(3, 84px); gap: 10px; }
.bobble i { height: 84px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); will-change: transform; }
.filings { display: grid; grid-template-columns: repeat(14, 18px); gap: 4px; padding: 14px; border-radius: 16px; background: var(--panel); }
.filings i { height: 18px; display: grid; place-items: center; }
.filings i::before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--text); transform: rotate(var(--a, 0deg)); opacity: var(--o, .5); }
.collide { display: grid; grid-template-columns: repeat(20, 14px); gap: 2px; padding: 10px; border-radius: 16px; background: var(--panel); touch-action: none; }
.collide i { height: 14px; border-radius: 3px; background: var(--line); transition: background-color 1.2s ease-out; }
.collide i.hit { background: var(--accent); transition: none; }
.conic { width: 280px; height: 280px; border-radius: 24px; background: conic-gradient(from var(--angle, 0deg) at var(--cx, 50%) var(--cy, 50%), #ff6a3d, #ffd23f, #4f9dff, #b26bff, #ff6a3d); }
</style>
</head>
<body>
<section><h2>Bobble hover</h2><div class="bobble" data-bobble></div></section>
<section><h2>Magnetic filings</h2><div class="filings" data-filings></div></section>
<section><h2>Swept collision</h2><div class="collide" data-collide></div></section>
<section><h2>Conic gradient pointer</h2><div class="conic" data-conic></div></section>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pointer = { x: 0, y: 0, vx: 0, vy: 0, t: performance.now() };
addEventListener('pointermove', (e) => {
  const now = performance.now();
  const dt = Math.max(1, now - pointer.t);
  pointer.vx = (e.clientX - pointer.x) / dt;
  pointer.vy = (e.clientY - pointer.y) / dt;
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.t = now;
});
const bob = document.querySelector('[data-bobble]');
const tiles = Array.from({ length: 9 }, () => { const i = document.createElement('i'); bob.append(i); return { el: i, s: 1, v: 0, r: 0, rv: 0 }; });
tiles.forEach((t) => t.el.addEventListener('pointerenter', () => {
  if (reduce) return;
  const speed = Math.min(4, Math.hypot(pointer.vx, pointer.vy));
  t.v -= 1.5 + speed * 2.5;
  t.rv += (pointer.vx > 0 ? 1 : -1) * (20 + speed * 60);
}));
const fil = document.querySelector('[data-filings]');
const filings = Array.from({ length: 14 * 14 }, () => { const i = document.createElement('i'); fil.append(i); return i; });
const col = document.querySelector('[data-collide]');
const cells = Array.from({ length: 400 }, () => { const i = document.createElement('i'); col.append(i); return i; });
let prev = null;
col.addEventListener('pointermove', (e) => {
  const r = col.getBoundingClientRect();
  const cell = (x, y) => [Math.floor((x - r.left - 10) / 16), Math.floor((y - r.top - 10) / 16)];
  const [x1, y1] = cell(e.clientX, e.clientY);
  const [x0, y0] = prev || [x1, y1];
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let s = 0; s <= steps; s++) {
    const cx = Math.round(x0 + ((x1 - x0) * s) / steps);
    const cy = Math.round(y0 + ((y1 - y0) * s) / steps);
    if (cx < 0 || cy < 0 || cx > 19 || cy > 19) continue;
    const c = cells[cy * 20 + cx];
    c.classList.add('hit');
    requestAnimationFrame(() => requestAnimationFrame(() => c.classList.remove('hit')));
  }
  prev = [x1, y1];
});
col.addEventListener('pointerleave', () => { prev = null; });
const conic = document.querySelector('[data-conic]');
let angle = 0, av = 0;
const frame = () => {
  tiles.forEach((t) => {
    t.v += (-260 * (t.s - 1) - 14 * t.v) / 60;
    t.s += t.v / 60;
    t.rv += (-260 * t.r - 14 * t.rv) / 60;
    t.r += t.rv / 60;
    t.el.style.transform = `scale(${t.s}) rotate(${t.r}deg)`;
  });
  const fr = fil.getBoundingClientRect();
  if (pointer.t) filings.forEach((f, i) => {
    const cx = fr.left + 14 + (i % 14) * 22 + 9;
    const cy = fr.top + 14 + Math.floor(i / 14) * 22 + 9;
    const dx = pointer.x - cx, dy = pointer.y - cy;
    f.style.setProperty('--a', `${Math.atan2(dy, dx) * 180 / Math.PI}deg`);
    f.style.setProperty('--o', Math.max(.25, 1 - Math.hypot(dx, dy) / 400).toFixed(2));
  });
  const cr = conic.getBoundingClientRect();
  const target = Math.atan2(pointer.y - (cr.top + cr.height / 2), pointer.x - (cr.left + cr.width / 2)) * 180 / Math.PI + 90;
  let d = ((target - angle + 540) % 360) - 180;
  av += (d * 120 - av * 16) / 60;
  angle += reduce ? d : av / 60;
  conic.style.setProperty('--angle', `${angle}deg`);
  conic.style.setProperty('--cx', `${Math.min(100, Math.max(0, ((pointer.x - cr.left) / cr.width) * 100))}%`);
  conic.style.setProperty('--cy', `${Math.min(100, Math.max(0, ((pointer.y - cr.top) / cr.height) * 100))}%`);
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
